function searchSkeletonHtml(count = 8) {
  return `<div class="search-skeleton-grid" aria-hidden="true">${Array.from({ length: count }, () =>
    `<div class="search-skeleton-item"><div class="skeleton search-skeleton-poster"></div><div class="skeleton search-skeleton-line"></div><div class="skeleton search-skeleton-line short"></div></div>`
  ).join('')}</div>`;
}

function renderSearch() {
  clearTimeout(searchDebounce);
  const renderRequestId = ++searchRequestId;
  root.innerHTML = chrome() + `
  <div class="container page search-page-wrap">
    <div class="search-heading">
      <p class="eyebrow">EXPLORER LE CATALOGUE</p>
      <h1>Qu'est-ce qu'on regarde&nbsp;?</h1>
      <p class="search-subtitle">Films, séries, acteurs et réalisateurs. Tout commence ici.</p>
    </div>
    <div class="search-box">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search-input" type="search" placeholder="Un titre, un acteur, un réalisateur…" autocomplete="off" spellcheck="false" aria-label="Rechercher dans le catalogue" aria-describedby="search-help" aria-controls="search-results" aria-autocomplete="list" />
      <button id="search-clear" class="search-clear-btn" type="button" aria-label="Effacer la recherche" title="Effacer" hidden>×</button>
    </div>
    <p id="search-help" class="search-help">Astuce : recherche avec au moins 2 caractères. Appuie sur Échap pour effacer.</p>
    <div id="search-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="search-filters" class="search-filters" style="display:none;" aria-label="Filtres des résultats">
      <select id="filter-genre" aria-label="Filtrer par genre" onchange="app.applySearchFilters()"><option value="">Tous genres</option></select>
      <select id="filter-year" aria-label="Filtrer par année" onchange="app.applySearchFilters()"><option value="">Toutes années</option></select>
    </div>
    <div id="search-people-row"></div>
    <div id="search-results" class="search-grid" aria-busy="false" tabindex="-1">
      ${searchEmptyStateHtml('À toi de choisir.', 'Commence à taper pour découvrir des films, des séries et les personnes qui les font.', '✦')}
    </div>
  </div>`;

  const input = document.getElementById('search-input');
  const clearButton = document.getElementById('search-clear');
  const resultsBox = document.getElementById('search-results');
  const peopleBox = document.getElementById('search-people-row');
  const filtersBox = document.getElementById('search-filters');
  const statusBox = document.getElementById('search-status');

  const resetSearchView = (message = 'Commence à taper pour découvrir le catalogue.') => {
    lastSearchResults = { media: [], people: [] };
    lastExecutedSearchQuery = '';
    filtersBox.style.display = 'none';
    peopleBox.innerHTML = '';
    resultsBox.setAttribute('aria-busy', 'false');
    resultsBox.innerHTML = searchEmptyStateHtml('À toi de choisir.', message, '✦');
    statusBox.textContent = message;
  };

  const runSearch = async (query, requestId) => {
    if (requestId !== searchRequestId || (location.hash || '#/') !== '#/search') return;
    lastExecutedSearchQuery = query;
    resultsBox.setAttribute('aria-busy', 'true');
    resultsBox.innerHTML = searchSkeletonHtml();
    peopleBox.innerHTML = '';
    filtersBox.style.display = 'none';
    statusBox.textContent = `Recherche de « ${query} » en cours.`;
    try {
      const results = await searchMedia(query);
      if (requestId !== searchRequestId || (location.hash || '#/') !== '#/search') return;
      lastSearchResults = results;
      peopleBox.innerHTML = peopleRowHtml(results.people);
      // Les filtres sont facultatifs : une panne de la liste de genres ne doit
      // pas effacer les titres déjà récupérés.
      try { await populateSearchFilters(results.media, requestId); }
      catch { if (requestId === searchRequestId) filtersBox.style.display = 'none'; }
      if (requestId !== searchRequestId || (location.hash || '#/') !== '#/search') return;
      const mediaCount = results.media.length;
      const peopleCount = results.people.length;
      if (mediaCount && peopleCount) {
        statusBox.textContent = `${mediaCount} ${mediaCount > 1 ? 'titres trouvés' : 'titre trouvé'} et ${peopleCount} ${peopleCount > 1 ? 'personnes trouvées' : 'personne trouvée'} pour « ${query} ».`;
      } else if (mediaCount) {
        statusBox.textContent = `${mediaCount} ${mediaCount > 1 ? 'titres trouvés' : 'titre trouvé'} pour « ${query} ».`;
      } else if (peopleCount) {
        statusBox.textContent = `Aucun film ni série, mais ${peopleCount} ${peopleCount > 1 ? 'personnes correspondent' : 'personne correspond'} à « ${query} ».`;
      } else {
        statusBox.textContent = `Aucun résultat pour « ${query} ».`;
      }
      if (mediaCount) {
        renderFilteredSearchResults();
      } else if (peopleCount) {
        resultsBox.innerHTML = searchEmptyStateHtml('Des personnes, pas encore de titres.', 'Les personnes correspondant à ta recherche sont affichées juste au-dessus.', '◎');
      } else {
        resultsBox.innerHTML = searchEmptyStateHtml('Rien à l’écran.', `Aucun résultat pour « ${query} ». Essaie un titre plus court ou une autre orthographe.`, '⌕');
      }
    } catch (err) {
      if (requestId !== searchRequestId || (location.hash || '#/') !== '#/search') return;
      resultsBox.innerHTML = `<div class="search-error-state"><strong>La recherche n'a pas abouti.</strong><p>${escapeHtml(err?.message || 'Vérifie ta connexion puis réessaie.')}</p><button class="btn outline" type="button" data-search-retry>Réessayer</button></div>`;
      resultsBox.querySelector('[data-search-retry]')?.addEventListener('click', () => {
        const retryId = ++searchRequestId;
        runSearch(input.value.trim(), retryId);
      });
      statusBox.textContent = 'Erreur de recherche. Réessaie.';
    } finally {
      if (requestId === searchRequestId) resultsBox.setAttribute('aria-busy', 'false');
    }
  };

  input.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    const query = input.value.trim();
    const requestId = ++searchRequestId; // invalide immédiatement toute réponse précédente
    clearButton.hidden = !query;
    if (!query) {
      resetSearchView();
      return;
    }
    if (query.length < 2) {
      lastSearchResults = { media: [], people: [] };
      filtersBox.style.display = 'none';
      peopleBox.innerHTML = '';
      resultsBox.setAttribute('aria-busy', 'false');
      resultsBox.innerHTML = searchEmptyStateHtml('Encore un caractère…', 'Deux caractères suffisent pour lancer la recherche.', '⌕');
      statusBox.textContent = 'Ajoute encore un caractère pour lancer la recherche.';
      return;
    }
    searchDebounce = setTimeout(() => runSearch(query, requestId), 320);
  });

  clearButton.addEventListener('click', () => {
    input.value = '';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.focus({ preventScroll: true });
  });
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && input.value) {
      event.preventDefault();
      input.value = '';
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }
  });
  // Le routeur dessine la page après le chargement initial : demander le focus ici
  // est plus fiable que l'attribut autofocus seul et ne force pas le scroll.
  requestAnimationFrame(() => {
    if (renderRequestId === searchRequestId && document.getElementById('search-input') === input) {
      input.focus({ preventScroll: true });
    }
  });
}

/** Construit les options des deux filtres à partir des résultats déjà reçus
 * (genre_ids + année d'extraction), sans requête réseau supplémentaire — le
 * filtrage par genre/année est donc instantané à chaque changement. Note :
 * TMDB ne permet pas de filtrer par plateforme de streaming sur une recherche
 * textuelle (seul /discover le permet, sans champ de recherche libre), donc
 * ce filtre-là n'est pas disponible ici — "Où regarder" reste sur la fiche
 * de chaque titre. */
async function populateSearchFilters(results, requestId = searchRequestId) {
  const filtersBox = document.getElementById('search-filters');
  if (!results.length) { filtersBox.style.display = 'none'; return; }
  filtersBox.style.display = 'flex';

  const genreSelect = document.getElementById('filter-genre');
  const yearSelect = document.getElementById('filter-year');
  const prevGenre = genreSelect.value, prevYear = yearSelect.value;

  const genres = await loadGenreNames();
  if (requestId !== searchRequestId || (location.hash || '#/') !== '#/search') return;
  const genreIdsPresent = new Set();
  results.forEach(m => (m.genre_ids || []).forEach(id => genreIdsPresent.add(id)));
  const genreOptions = [...genreIdsPresent]
    .map(id => ({ id, name: genres.movie.get(id) || genres.tv.get(id) }))
    .filter(g => g.name)
    .sort((a, b) => a.name.localeCompare(b.name));

  const years = [...new Set(results.map(m => m.release_date?.slice(0, 4)).filter(Boolean))].sort((a, b) => b - a);

  genreSelect.innerHTML = `<option value="">Tous genres</option>` + genreOptions.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');
  yearSelect.innerHTML = `<option value="">Toutes années</option>` + years.map(y => `<option value="${y}">${y}</option>`).join('');
  genreSelect.value = genreOptions.some(g => String(g.id) === prevGenre) ? prevGenre : '';
  yearSelect.value = years.includes(prevYear) ? prevYear : '';
}

/**
 * Génère le HTML de l'aperçu de story. Gère explicitement l'absence de
 * poster/backdrop (dégradé de secours, bloc titre à la place d'une <img>
 * cassée) pour ne jamais faire planter la capture html2canvas ensuite.
 * Si storyState.episode est défini (Story générée depuis un épisode), affiche
 * en plus le badge "S{saison} · E{épisode}" et utilise la vignette de
 * l'épisode comme fond quand elle est disponible.
 */
function renderStoryPreview() {
  const { media, interaction, episode, mode, blur } = storyState;
  if (!media) return;
  const target = document.getElementById('story-canvas-target');
  if (!target) return;

  const backdropSource = episode?.still_path ? backdropUrl(episode.still_path, 'w780') : backdropUrl(media.backdrop_path, 'w780');
  const poster = posterUrl(media.poster_path, 'w342');
  const rating = interaction?.rating ?? null;
  const review = (interaction?.review ?? '').trim();
  const reviewExcerpt = review ? (review.length > 130 ? review.slice(0, 130) + '…' : review) : '';
  const year = media.release_date ? media.release_date.slice(0, 4) : '';

  // Cache-busting : évite qu'une image TMDB déjà en cache navigateur (chargée
  // sans mode CORS ailleurs dans l'app) ne "tainte" le canvas au moment de la
  // capture html2canvas, ce qui produirait une image cassée/vide à l'export.
  const cb = `?cb=${Date.now()}`;
  const backdropCb = backdropSource ? `${backdropSource}${cb}` : null;
  const posterCb = poster ? `${poster}${cb}` : null;

  const bgStyle = backdropCb
    ? `background-image:url('${backdropCb}'); filter: blur(${blur}px) brightness(.55) saturate(1.2);`
    : `background: radial-gradient(circle at 30% 20%, #123, #000); filter: blur(${blur / 3}px);`;

  target.innerHTML = `
    <div class="story-bg" style="${bgStyle}"></div>
    <div class="story-glass-card">
      ${posterCb
        ? `<img class="story-poster" src="${posterCb}" crossorigin="anonymous" alt="" />`
        : `<div class="story-poster story-poster-fallback">${escapeHtml(media.title)}</div>`}
      ${episode ? `<div class="story-episode-badge">S${episode.seasonNumber} · E${episode.episodeNumber}</div>` : ''}
      <h2 class="story-title">${escapeHtml(media.title)}</h2>
      ${episode?.title ? `<p class="story-year">${escapeHtml(episode.title)}</p>` : (year ? `<p class="story-year">${year}</p>` : '')}
      ${rating != null ? `<div class="story-stars">${starsToText(rating)}</div>` : ''}
      ${mode === 'full' && reviewExcerpt ? `<p class="story-review">"${escapeHtml(reviewExcerpt)}"</p>` : ''}
    </div>
    <div class="story-watermark">MatthiasTrack</div>`;
}

async function generateStoryBlob() {
  if (typeof html2canvas === 'undefined') {
    throw new Error("La bibliothèque de génération d'image n'a pas pu se charger (vérifie ta connexion, elle vient d'un CDN).");
  }
  const target = document.getElementById('story-canvas-target');
  const canvas = await html2canvas(target, { scale: 3, useCORS: true, backgroundColor: '#000000', logging: false });
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Échec de génération de l\'image')), 'image/png', 0.95);
  });
}

async function discoverByKeyword(keywordId, mediaType) {
  const data = await tmdbFetch(`/discover/${mediaType}`, { with_keywords: keywordId, sort_by: 'popularity.desc' });
  return (data.results ?? []).slice(0, 20).map(r => normalizeTMDB(r, mediaType));
}

// --- PERSONNE (acteur/réalisateur) : bio + filmographie -----------------
async function getPersonDetails(personId) {
  const [person, credits] = await Promise.all([
    tmdbFetch(`/person/${personId}`),
    tmdbFetch(`/person/${personId}/combined_credits`),
  ]);
  const works = [...(credits.cast ?? []), ...(credits.crew ?? [])]
    .filter(w => (w.media_type === 'movie' || w.media_type === 'tv') && w.poster_path)
    .filter((w, i, arr) => arr.findIndex(x => x.id === w.id && x.media_type === w.media_type) === i) // dédoublonne (acteur + réalisateur sur le même titre par ex.)
    .sort((a, b) => (b.release_date || b.first_air_date || '').localeCompare(a.release_date || a.first_air_date || ''));
  return { person, works };
}

async function renderMyListsTab() {
  const box = document.getElementById('lists-tab-content');
  box.innerHTML = `<div class="loading-center"><span class="spinner"></span> Chargement… (calcul de la progression des séries)</div>`;
  try {
    const { data: interactionRows, error: intErr } = await sb
      .from('interactions')
      .select('status, rating, watched_at, rewatch_count, media(*)')
      .eq('user_id', currentUser.id)
      .order('watched_at', { ascending: false, nullsFirst: false });
    if (intErr) throw new Error(intErr.message);

    const watchedMovies = (interactionRows ?? []).filter(r => r.status === 'watched' && r.media?.media_type === 'movie');
    const watchlist = (interactionRows ?? []).filter(r => r.status === 'watchlist');
    lastWatchlistRows = watchlist; // pour le système de décision (filtre réactif + Shake to Pick)
    // Note perso/éventuelle sur une série vue via `interactions` (rating global,
    // posé indépendamment des épisodes) — utile pour l'afficher sur les séries
    // terminées, comme pour les films.
    const ratingByMediaId = new Map((interactionRows ?? []).filter(r => r.media?.media_type === 'tv' && r.rating != null).map(r => [r.media.id, r.rating]));
    // Séries marquées "vues" via le bouton ✓ de leur fiche (toggleWatched) plutôt
    // qu'épisode par épisode : à traiter comme terminées ici aussi, y compris
    // celles qui n'ont carrément aucun episode_interactions (donc absentes de
    // seriesMap ci-dessous) — sinon elles n'apparaissaient nulle part, ou
    // restaient à tort dans "en cours".
    const explicitlyWatchedTvRows = (interactionRows ?? []).filter(r => r.status === 'watched' && r.media?.media_type === 'tv');
    const explicitlyWatchedTvIds = new Set(explicitlyWatchedTvRows.map(r => r.media.id));

    const epRows = await fetchAllRows(() => sb
      .from('episode_interactions')
      .select('watched_at, episodes(episode_number, runtime, seasons(season_number, media(*)))')
      .eq('user_id', currentUser.id).order('id'));

    // Stats globales : temps total (films + épisodes, rewatch inclus), note moyenne
    const movieMinutes = watchedMovies.reduce((sum, r) => sum + (r.media?.runtime ?? 0) * (1 + (r.rewatch_count ?? 0)), 0);
    const episodeMinutes = (epRows ?? []).reduce((sum, r) => sum + (r.episodes?.runtime ?? 0), 0);
    const totalMinutesAll = movieMinutes + episodeMinutes;
    const ratedMovies = watchedMovies.filter(r => r.rating != null);
    const avgRating = ratedMovies.length ? (ratedMovies.reduce((s, r) => s + r.rating, 0) / ratedMovies.length).toFixed(1) : null;

    // Regroupe les épisodes vus par série (média)
    const seriesMap = new Map(); // media.id -> { media, count, lastWatched }
    for (const row of (epRows ?? [])) {
      const media = row.episodes?.seasons?.media;
      if (!media) continue;
      const entry = seriesMap.get(media.id) ?? { media, count: 0, lastWatched: null };
      entry.count++;
      if (row.watched_at && (!entry.lastWatched || row.watched_at > entry.lastWatched)) entry.lastWatched = row.watched_at;
      seriesMap.set(media.id, entry);
    }

    // Détermine, pour chaque série ayant au moins un épisode vu, si elle est
    // TERMINÉE (tous les épisodes connus sur TMDB sont marqués vus) ou encore
    // EN COURS — avec un pool de 6 appels TMDB en parallèle max (mis en cache
    // en mémoire par getShowTotalEpisodes, donc gratuit dès le 2e rendu de cet
    // onglet dans la session).
    const seriesList = Array.from(seriesMap.values());
    const seriesWithTotals = await mapWithConcurrency(seriesList, 6, async (s) => {
      if (explicitlyWatchedTvIds.has(s.media.id)) return { ...s, total: null, isCompleted: true };
      const total = await getShowTotalEpisodes(s.media.tmdb_id);
      const isCompleted = total != null && total > 0 && s.count >= total;
      return { ...s, total, isCompleted };
    });
    // Séries marquées "vues" en un clic, sans aucun épisode coché individuellement :
    // pas dans seriesMap/seriesWithTotals (basés sur episode_interactions), donc
    // ajoutées ici directement pour apparaître dans "Terminées".
    const untrackedWatched = explicitlyWatchedTvRows
      .filter(r => !seriesMap.has(r.media.id))
      .map(r => ({ media: r.media, count: 0, total: null, isCompleted: true, lastWatched: r.watched_at ?? null }));
    const seriesInProgress = seriesWithTotals.filter(s => !s.isCompleted)
      .sort((a, b) => (b.lastWatched ?? '').localeCompare(a.lastWatched ?? ''));
    const seriesCompleted = seriesWithTotals.filter(s => s.isCompleted).concat(untrackedWatched)
      .sort((a, b) => (b.lastWatched ?? '').localeCompare(a.lastWatched ?? ''));

    box.innerHTML = `
    <div class="container" style="padding:16px 16px 100px;">
      <div class="lists-overview-grid">
        <div class="panel lists-overview-card">
          <div>${watchedMovies.length}</div>
          <div>films vus</div>
        </div>
        <div class="panel lists-overview-card">
          <div>${seriesCompleted.length}</div>
          <div>séries terminées</div>
        </div>
        <div class="panel lists-overview-card">
          <div>${(epRows ?? []).length}</div>
          <div>épisodes vus</div>
        </div>
        <div class="panel lists-overview-card">
          <div>${formatWatchDuration(totalMinutesAll)}</div>
          <div>temps total</div>
        </div>
        <div class="panel lists-overview-card">
          <div>${avgRating ?? '—'}${avgRating ? ' ★' : ''}</div>
          <div>note moyenne (films)</div>
        </div>
      </div>

      <div class="row" style="margin-bottom:36px;">
        <h2 style="padding:0;">📺 Séries en cours (${seriesInProgress.length})</h2>
        ${seriesInProgress.length === 0
          ? `<p style="color:var(--muted); font-size:14px;">Aucune série en cours pour l'instant — ouvre une fiche série pour commencer, ou importe ton historique TV Time.</p>`
          : `<div class="search-grid">${seriesInProgress.map(s => {
              const pct = s.total ? Math.round((s.count / s.total) * 100) : null;
              return `
              <a class="card" style="width:auto;" href="#/media/tv/${s.media.tmdb_id}">
                <div class="poster">${s.media.poster_path ? `<img src="${posterUrl(s.media.poster_path)}" alt="${escapeHtml(s.media.title)}" loading="lazy" />` : ''}</div>
                <div class="title">${escapeHtml(s.media.title)}</div>
                <div style="font-size:11px; color:var(--blue);">${s.count}${s.total ? `/${s.total}` : ''} épisode${s.count > 1 ? 's' : ''} vu${s.count > 1 ? 's' : ''}</div>
                ${pct != null ? `<div class="show-progress-bar" style="margin-top:4px;"><div class="show-progress-fill" style="width:${pct}%;"></div></div>` : ''}
              </a>`;
            }).join('')}</div>`}
      </div>

      <div class="row" style="margin-bottom:36px;">
        <h2 style="padding:0;">✅ Séries terminées (${seriesCompleted.length})</h2>
        ${seriesCompleted.length === 0
          ? `<p style="color:var(--muted); font-size:14px;">Aucune série entièrement terminée pour l'instant.</p>`
          : `<div class="search-grid">${seriesCompleted.map(s => `
              <a class="card" style="width:auto;" href="#/media/tv/${s.media.tmdb_id}">
                <div class="poster">${s.media.poster_path ? `<img src="${posterUrl(s.media.poster_path)}" alt="${escapeHtml(s.media.title)}" loading="lazy" />` : ''}<div class="badge">✓</div></div>
                <div class="title">${escapeHtml(s.media.title)}</div>
                <div style="font-size:11px; color:var(--muted);">${s.total ? `${s.total} épisode${s.total > 1 ? 's' : ''}` : 'Terminée'}</div>
                ${ratingByMediaId.has(s.media.id) ? starsDisplayHtml(ratingByMediaId.get(s.media.id)) : ''}
              </a>`).join('')}</div>`}
      </div>

      <div class="row" style="margin-bottom:36px;">
        <h2 style="padding:0;">Films vus (${watchedMovies.length})</h2>
        ${watchedMovies.length === 0
          ? `<p style="color:var(--muted); font-size:14px;">Aucun film marqué comme vu pour l'instant.</p>`
          : `<div class="search-grid">${watchedMovies.map(r => `
              <a class="card" style="width:auto;" href="#/media/movie/${r.media.tmdb_id}">
                <div class="poster">${r.media.poster_path ? `<img src="${posterUrl(r.media.poster_path)}" alt="${escapeHtml(r.media.title)}" loading="lazy" />` : ''}<div class="badge">✓</div></div>
                <div class="title">${escapeHtml(r.media.title)}</div>
                ${r.rating ? starsDisplayHtml(r.rating) : ''}
              </a>`).join('')}</div>`}
      </div>

      <div class="row">
        <h2 style="padding:0;">Ma liste (${watchlist.length})</h2>
        ${watchlist.length === 0
          ? `<p style="color:var(--muted); font-size:14px;">Ta liste est vide — ajoute des films/séries via le bouton "+" sur leur fiche.</p>`
          : `
          ${(() => {
            const movies = watchlist.filter(r => r.media?.media_type === 'movie');
            const shows = watchlist.filter(r => r.media?.media_type === 'tv');
            const moviesMinutes = movies.reduce((s, r) => s + (r.media?.runtime || 0), 0);
            if (!moviesMinutes && !shows.length) return '';
            return `<p style="color:var(--muted); font-size:12px; margin:-8px 0 14px;">

function watchlistGridHtml(list) {

/** Score heuristique 0-100 "effort intellectuel requis" à partir des genres TMDB (FR).
 * Aucune donnée TMDB dédiée à la complexité n'existe : c'est une approximation par genre. */
const BRAINPOWER_GENRE_SCORES = {
  'Comédie': 10, 'Action': 20, 'Aventure': 22, 'Familial': 8, 'Animation': 18,
  'Fantastique': 35, 'Romance': 25, 'Musique': 20, 'Western': 30,
  'Crime': 55, 'Drame': 50, 'Guerre': 55, 'Téléfilm': 30,
  'Mystère': 72, 'Thriller': 68, 'Horreur': 50,
  'Science-Fiction': 62, 'Histoire': 58, 'Documentaire': 45,
};
function brainpowerScore(genres) {
  if (!genres || genres.length === 0) return 40;
  const scores = genres.map(g => BRAINPOWER_GENRE_SCORES[g] ?? 40);
  return Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
}

function filterWatchlistByControls(list) {
  const brainEl = document.getElementById('brainpower-slider');
  const timeEl = document.getElementById('time-filter-input');
  const genreEl = document.getElementById('pick-genre-filter');
  const queryEl = document.getElementById('watchlist-query');
  const typeEl = document.getElementById('watchlist-type-filter');
  const brain = brainEl ? parseInt(brainEl.value, 10) : 50;
  const timeLimit = timeEl && timeEl.value ? parseInt(timeEl.value, 10) : null;
  const genreFilter = genreEl && genreEl.value ? genreEl.value : null;
  const query = normalizeSearchText(queryEl?.value || '');
  const type = typeEl?.value || 'all';
  return list.filter(r => {
    const m = r.media || {};
    const score = brainpowerScore(m.genres);
    const withinBrain = !brainEl || Math.abs(score - brain) <= 35;
    const withinTime = !timeLimit || !m.runtime || m.runtime <= timeLimit;
    const matchesGenre = !genreFilter || (m.genres ?? []).includes(genreFilter);
    const matchesType = type === 'all' || m.media_type === type;
    const searchable = normalizeSearchText([m.title, m.original_title, ...(m.genres || [])].filter(Boolean).join(' '));
    const matchesQuery = !query || searchable.includes(query);
    return withinBrain && withinTime && matchesGenre && matchesType && matchesQuery;
  });
}

function normalizeSearchText(value) {
  return String(value ?? '').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

function discoveryMoodMatches(media, mood) {
  const wanted = DISCOVERY_MOOD_GENRES[mood];
  if (!wanted || !media?.genres?.length) return true;
  const current = media.genres.map(normalizeSearchText);
  return wanted.some(g => current.some(x => x.includes(normalizeSearchText(g)) || normalizeSearchText(g).includes(x)));

function buildDiscoveryFavoriteGenres(rows) {
  const counts = new Map();
  for (const row of rows) {
    if (!['watched', 'watching'].includes(row.status) || row.rating == null || Number(row.rating) < 4) continue;
    for (const genre of row.media?.genres || []) {
      const key = normalizeSearchText(genre);
      if (!key) continue;
      const prev = counts.get(key) || { label: genre, count: 0 };
      prev.count++;
      counts.set(key, prev);
    }
  }
  discoveryFavoriteGenres = counts;
}
function scoreDiscoveryMedia(media) {
  const genres = (media?.genres || []).map(normalizeSearchText);
  const personal = genres.reduce((sum, g) => sum + (discoveryFavoriteGenres.get(g)?.count || 0), 0);
  const vote = Number(media?.vote_average || 0);
  const moodBonus = discoveryMoodMatches(media, discoveryPrefs.mood) ? 4 : 0;
  const runtimeBonus = discoveryPrefs.runtime && media?.runtime && media.runtime <= Number(discoveryPrefs.runtime) ? 1.5 : 0;
  return personal * 2.5 + vote * 0.6 + moodBonus + runtimeBonus;
}

  if (discoveryPrefs.runtime && media.runtime && Number(media.runtime) > Number(discoveryPrefs.runtime)) return false;
  if (!discoveryMoodMatches(media, discoveryPrefs.mood)) return false;
  const searchable = normalizeSearchText([media.title, media.original_title, ...(media.genres || [])].filter(Boolean).join(' '));
  return !query || searchable.includes(query);

    const types = discoveryPrefs.type === 'all' ? ['movie', 'tv'] : [discoveryPrefs.type];
    const resultsByType = await Promise.all(types.map(async type => {
      const rules = DISCOVERY_MOOD_GENRES[discoveryPrefs.mood] || [];
      const genreMap = names[type];
      let ids = [];
      if (discoveryPrefs.genre) {
        for (const [id, name] of genreMap.entries()) if (normalizeSearchText(name) === normalizeSearchText(discoveryPrefs.genre)) ids.push(id);
      } else if (rules.length) {
        for (const [id, name] of genreMap.entries()) if (rules.some(r => normalizeSearchText(name).includes(normalizeSearchText(r)) || normalizeSearchText(r).includes(normalizeSearchText(name)))) ids.push(id);
        ids = ids.slice(0, 4);
      }
      const params = { sort_by: 'popularity.desc', include_adult: 'false', page: '1', 'vote_count.gte': '80' };
      if (ids.length) params.with_genres = ids.join('|');
      if (discoveryPrefs.runtime) params['with_runtime.lte'] = discoveryPrefs.runtime;
      const data = await tmdbFetch(`/discover/${type}`, params);
      return (data.results || []).map(raw => {
        const media = normalizeTMDB(raw, type);
        media.genres = (raw.genre_ids || []).map(id => genreMap.get(id)).filter(Boolean);
        media.genre_ids = raw.genre_ids || [];
        media._isWatchlist = false;
        return media;
      });
    }));
    if (token !== discoveryLoadToken || (location.hash || '#/') !== '#/discover') return;
    const seen = new Set(discoveryLibraryRows.filter(r => ['watched','watchlist','watching','blacklisted'].includes(r.status)).map(r => `${r.media?.media_type}:${r.media?.tmdb_id}`));
    discoveryCatalogItems = resultsByType.flat().filter(media => !seen.has(`${media.media_type}:${media.tmdb_id}`));
    const title = document.getElementById('discovery-results-title'); if (title) title.textContent = 'Explorer le catalogue';
    const subtitle = document.getElementById('discovery-results-subtitle'); if (subtitle) subtitle.textContent = 'Titres populaires correspondant à tes critères, hors des œuvres déjà présentes dans ta bibliothèque.';
    renderDiscoveryResults();
  } catch (err) {
    if (token !== discoveryLoadToken) return;
    results.innerHTML = `<div class="discovery-empty"><span>!</span><strong>Catalogue temporairement indisponible</strong><p>${escapeHtml(err?.message || 'Vérifie ta connexion puis réessaie.')}</p><button class="btn ghost" onclick="app.exploreDiscoveryCatalog()">Réessayer</button></div>`;
  }
}

// Cache partagé "œuvres vues"" (utilisé par le Mode Timeline) + Shake to Pick
// ============================================================================

/** Source commune pour le Mode Timeline (ne porte que sur les œuvres "vues"). */
/** Source du Mode Timeline. Pour les films, `interactions.status='watched'`
 * est fiable (posé directement au clic). Pour les séries en revanche, ce
 * statut n'est en réalité posé QUE par l'import — le suivi normal (cocher
 * les épisodes un par un) ne le touche jamais — donc s'y fier seul en
 * excluait purement et simplement toute série suivie normalement. On
 * détermine plutôt "vue" pour une série via ses épisodes réellement cochés
 * comparés au total réel (même logique que "Séries terminées" dans Mes
 * listes), et on ne fait entrer dans la Timeline que celles complètes. */
async function getWatchedItemsFull() {
  const { data: movieRows, error: e1 } = await sb.from('interactions')
    .select('timeline_order, timeline_label, media(*)')
    .eq('user_id', currentUser.id).eq('status', 'watched');
  if (e1) throw new Error(formatSbError(e1));
  const movies = (movieRows ?? [])
    .filter(r => r.media && r.media.media_type === 'movie')
    .map(r => ({ ...r.media, timeline_order: r.timeline_order, timeline_label: r.timeline_label }));

  const epRows = await fetchAllRows(() => sb.from('episode_interactions')
    .select('episodes(seasons(media(*)))').eq('user_id', currentUser.id).order('id'));
  const showWatchedCount = new Map(); // media.id -> { media, count }
  for (const r of (epRows ?? [])) {
    const media = r.episodes?.seasons?.media;
    if (!media) continue;
    const cur = showWatchedCount.get(media.id) ?? { media, count: 0 };
    cur.count++;
    showWatchedCount.set(media.id, cur);
  }
  // Un appel TMDB par série (mis en cache par getShowTotalEpisodes) : parallélisé
  // comme ailleurs dans le fichier, au lieu d'un await séquentiel série par série.
  const completedShows = (await mapWithConcurrency(Array.from(showWatchedCount.values()), 6, async ({ media, count }) => {
    const total = await getShowTotalEpisodes(media.tmdb_id);
    return (total != null && total > 0 && count >= total) ? media : null;
  })).filter(Boolean);

  let shows = [];
  if (completedShows.length) {
    const { data: timelineMeta, error: e3 } = await sb.from('interactions')
      .select('media_id, timeline_order, timeline_label')
      .eq('user_id', currentUser.id).in('media_id', completedShows.map(m => m.id));
    if (e3) throw new Error(formatSbError(e3));
    const metaByMediaId = new Map((timelineMeta ?? []).map(r => [r.media_id, r]));
    shows = completedShows.map(media => {
      const meta = metaByMediaId.get(media.id);
      return { ...media, timeline_order: meta?.timeline_order ?? null, timeline_label: meta?.timeline_label ?? null };
    });
  }
  return [...movies, ...shows];
}

let watchedItemsCache = null; // cache en mémoire le temps de la session (évite un refetch à chaque changement de la Timeline)
let lastWatchlistRows = []; // pour le système de décision (Energy/Brainpower, filtre temps, Shake to Pick)
let shakeListenerActive = false;
let lastShakeAt = 0;

let recentPicks = []; // tmdb_id des derniers tirages cette session, pour éviter de retomber dessus tout de suite

function pickRandomFromFilteredWatchlist() {
  const filtered = filterWatchlistByControls(lastWatchlistRows);
  if (filtered.length === 0) { showErrorToast('Aucun titre ne correspond à tes filtres pour choisir.'); return; }
  // Évite un tirage récent tant qu'il reste d'autres choix possibles dans le pool filtré
  const notRecentlyPicked = filtered.filter(r => !recentPicks.includes(r.media.tmdb_id));
  const pool = notRecentlyPicked.length > 0 ? notRecentlyPicked : filtered;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  recentPicks = [pick.media.tmdb_id, ...recentPicks].slice(0, Math.max(1, Math.min(5, filtered.length - 1)));
  navigate(`#/media/${pick.media.media_type}/${pick.media.tmdb_id}`);
}

function handleDeviceShake(e) {
  const acc = e.accelerationIncludingGravity;
  if (!acc) return;
  const magnitude = Math.sqrt((acc.x || 0) ** 2 + (acc.y || 0) ** 2 + (acc.z || 0) ** 2);
  const now = Date.now();
  if (magnitude > 25 && now - lastShakeAt > 1500) {
    lastShakeAt = now;
    pickRandomFromFilteredWatchlist();
  }
}

// depuis la migration serveur v17. Nécessite patch-custom-lists-and-ai.sql.

let customListsCache = null; // { [id]: {id,name,emoji,rankedMode,sortOrder,items:[{mediaId,tmdbId,mediaType,title,poster_path,position}]} } | null tant que pas chargé

/** Charge (ou relit depuis le cache mémoire) les listes perso de l'utilisateur.
 * force=true ignore le cache et relit en base — à utiliser après toute écriture. */
async function fetchCustomLists(force = false) {
  if (customListsCache && !force) return customListsCache;
  if (!currentUser) { customListsCache = {}; return customListsCache; }

  const { data: lists, error } = await sb.from('custom_lists')
    .select('id, name, emoji, ranked_mode, sort_order')
    .eq('user_id', currentUser.id)
    .order('sort_order', { ascending: true });
  if (error) throw new Error(formatSbError(error));

  const result = {};
  for (const l of (lists ?? [])) {
    result[l.id] = { id: l.id, name: l.name, emoji: l.emoji, rankedMode: l.ranked_mode, sortOrder: l.sort_order, items: [] };
  }

  if ((lists ?? []).length > 0) {
    const { data: itemRows, error: itemsErr } = await sb.from('custom_list_items')
      .select('list_id, position, media(id, tmdb_id, media_type, title, poster_path)')
      .in('list_id', lists.map(l => l.id))
      .order('position', { ascending: true });
    if (itemsErr) throw new Error(formatSbError(itemsErr));
    for (const row of (itemRows ?? [])) {
      const bucket = result[row.list_id];
      if (!bucket || !row.media) continue;
      bucket.items.push({
        mediaId: row.media.id, tmdbId: row.media.tmdb_id, mediaType: row.media.media_type,
        title: row.media.title, poster_path: row.media.poster_path, position: row.position,
      });
    }
  }

  customListsCache = result;
  return result;
}

async function createCustomListDb(name, emoji) {
  await ensureFreshSession();
  const lists = await fetchCustomLists();
  const maxOrder = Object.values(lists).reduce((m, l) => Math.max(m, l.sortOrder ?? 0), -1);
  const { error } = await sb.from('custom_lists')
    .insert({ user_id: currentUser.id, name, emoji: emoji || null, sort_order: maxOrder + 1 });
  if (error) throw new Error(formatSbError(error));
  await fetchCustomLists(true);
}
async function renameCustomListDb(id, name) {
  await ensureFreshSession();
  const { error } = await sb.from('custom_lists').update({ name }).eq('id', id);
  if (error) throw new Error(formatSbError(error));
  await fetchCustomLists(true);
}
async function deleteCustomListDb(id) {
  await ensureFreshSession();
  const { error } = await sb.from('custom_lists').delete().eq('id', id); // cascade supprime aussi custom_list_items
  if (error) throw new Error(formatSbError(error));
  await fetchCustomLists(true);
}
async function toggleListRankedModeDb(id) {
  await ensureFreshSession();
  const list = (await fetchCustomLists())[id];
  if (!list) return;
  const { error } = await sb.from('custom_lists').update({ ranked_mode: !list.rankedMode }).eq('id', id);
  if (error) throw new Error(formatSbError(error));
  await fetchCustomLists(true);
}
async function moveCustomListOrderDb(aId, aOrder, bId, bOrder) {
  await ensureFreshSession();
  // Écritures parallèles plutôt que séquentielles : le classement Letterboxd-like
  // doit se sentir instantané, pas attendre deux allers-retours l'un après l'autre.
  const [r1, r2] = await Promise.all([
    sb.from('custom_lists').update({ sort_order: aOrder }).eq('id', aId),
    sb.from('custom_lists').update({ sort_order: bOrder }).eq('id', bId),
  ]);
  if (r1.error || r2.error) throw new Error(formatSbError(r1.error || r2.error));
}
async function addToCustomListDb(listId, media) {
  await ensureFreshSession();
  const list = (await fetchCustomLists())[listId];
  if (!list || !media) return false;
  if (list.items.some(i => i.mediaId === media.id)) return false; // déjà dedans
  const nextPos = list.items.length ? Math.max(...list.items.map(i => i.position)) + 1 : 0;
  const { error } = await sb.from('custom_list_items').insert({ list_id: listId, media_id: media.id, position: nextPos });
  if (error) throw new Error(formatSbError(error));
  await fetchCustomLists(true);
  return true;
}
async function removeFromCustomListDb(listId, mediaId) {
  await ensureFreshSession();
  const { error } = await sb.from('custom_list_items').delete().eq('list_id', listId).eq('media_id', mediaId);
  if (error) throw new Error(formatSbError(error));
  await fetchCustomLists(true);
}
async function moveCustomListItemDb(listId, aMediaId, aPos, bMediaId, bPos) {
  await ensureFreshSession();
  const [r1, r2] = await Promise.all([
    sb.from('custom_list_items').update({ position: aPos }).eq('list_id', listId).eq('media_id', aMediaId),
    sb.from('custom_list_items').update({ position: bPos }).eq('list_id', listId).eq('media_id', bMediaId),
  ]);
  if (r1.error || r2.error) throw new Error(formatSbError(r1.error || r2.error));
}

let smartCollectionState = { rows: [], episodes: [], collections: {}, selected: 'tonight', loadedAt: null };
const SMART_COLLECTION_DEFS = [
  { id: 'tonight', emoji: '🌙', title: 'Ce soir, sans prise de tête', desc: 'Titres de ta liste qui tiennent dans une soirée', note: 'Watchlist · 120 min max' },
  { id: 'favorites', emoji: '💎', title: 'Mes coups de cœur', desc: 'Les œuvres auxquelles tu as donné 4 étoiles ou plus', note: 'Note personnelle ≥ 4/5' },
  { id: 'short', emoji: '⚡', title: 'Format court', desc: 'Des films de ta liste pour une soirée rapide', note: 'Films · 100 min max' },
  { id: 'unrated', emoji: '✍️', title: 'À noter', desc: 'Les œuvres vues qui attendent encore ton avis', note: 'Visionnés · sans note' },
  { id: 'rewatch', emoji: '🔁', title: 'À revoir', desc: 'Les titres que tu as déjà revisionnés', note: 'Revisionnages enregistrés' },
  { id: 'series', emoji: '📺', title: 'Reprendre mes séries', desc: 'Séries suivies avec des épisodes enregistrés', note: 'Progression personnelle' },
  { id: 'hidden', emoji: '✨', title: 'Pépites à découvrir', desc: 'Titres de ta liste bien notés par la communauté', note: 'Note TMDB ≥ 7,2' },
];
function buildSmartCollections(rows, episodeRows) {
  const uniqueMedia = list => {
    const seen = new Set();
    return list.filter(item => {
      const m = item.media || item;
      if (!m || !m.tmdb_id || !m.media_type) return false;
      const k = `${m.media_type}:${m.tmdb_id}`;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    }).map(item => item.media ? { ...item.media, personalRating: item.rating ?? null, personalStatus: item.status, personalReview: item.review || '', personalWatchedAt: item.watched_at || null, personalRewatchCount: item.rewatch_count || 0 } : item);
  };
  const watchlist = rows.filter(r => r.status === 'watchlist' && r.media);
  const watched = rows.filter(r => r.status === 'watched' && r.media);
  const ratedFavorites = rows.filter(r => ['watched','watching'].includes(r.status) && Number(r.rating) >= 4 && r.media);
  const ratedData = watched.filter(r => r.rating == null);
  const rewatched = rows.filter(r => Number(r.rewatch_count || 0) > 0 && r.media);
  const episodeShows = new Map();
  for (const r of episodeRows) {
    const media = r.episodes?.seasons?.media;
    if (media) episodeShows.set(`${media.media_type}:${media.tmdb_id}`, media);
  }
  const statusShows = rows.filter(r => r.media?.media_type === 'tv' && r.status === 'watching');
  const currentShows = uniqueMedia([...statusShows, ...[...episodeShows.values()].map(media => ({ media, status: 'watching' }))]);
  const smart = {
    tonight: uniqueMedia(watchlist.filter(r => r.media.media_type === 'movie' && Number(r.media.runtime) > 0 && Number(r.media.runtime) <= 120).sort((a,b) => Number(b.media.vote_average || 0) - Number(a.media.vote_average || 0))),
    favorites: uniqueMedia(ratedFavorites).sort((a,b) => Number(b.personalRating || 0) - Number(a.personalRating || 0)),
    short: uniqueMedia(watchlist.filter(r => r.media.media_type === 'movie' && Number(r.media.runtime) > 0 && Number(r.media.runtime) <= 100).sort((a,b) => Number(a.media.runtime || 999) - Number(b.media.runtime || 999))),
    unrated: uniqueMedia(ratedData).sort((a,b) => String(b.personalWatchedAt || '').localeCompare(String(a.personalWatchedAt || ''))),
    rewatch: uniqueMedia(rewatched).sort((a,b) => Number(b.personalRewatchCount || 0) - Number(a.personalRewatchCount || 0)),
    series: currentShows,
    hidden: uniqueMedia(watchlist.filter(r => Number(r.media.vote_average || 0) >= 7.2).sort((a,b) => Number(b.media.vote_average || 0) - Number(a.media.vote_average || 0))),
  };
  return smart;
}

  const box = document.getElementById('lists-tab-content');
  if (!box) return;
  box.innerHTML = `<div class="container smart-collections-page"><div class="loading-center"><span class="spinner"></span><p>On compose tes collections personnalisées…</p></div></div>`;
  try {
    const [rows, episodeRows] = await Promise.all([

// RECOMMANDATIONS PERSONNALISÉES — basées sur TMDB, sans fournisseur d'IA externe.
// ============================================================================
let ratingRecommendationsCache = null; // résultats de la dernière recherche, gardés pendant la session

/** Recommandations basées sur les notes personnelles et TMDB, sans IA externe.
 * Le type film/série est déduit de la fiche source lorsque TMDB ne le répète pas
 * dans chaque résultat. Les titres déjà présents dans les interactions OU dans
 * le suivi d'épisodes sont exclus ; les recos citées par plusieurs favoris montent. */
async function getRatingBasedRecommendations() {
  if (!currentUser) return { seeds: [], recs: [] };
  const { data, error } = await sb.from('interactions')
    .select('rating, watched_at, media(*)')
    .eq('user_id', currentUser.id).eq('status', 'watched').gte('rating', 4)
    .order('watched_at', { ascending: false }).limit(8);
  if (error) throw new Error(formatSbError(error));

  const seeds = (data ?? []).filter(r => r.media);
  if (!seeds.length) return { seeds: [], recs: [] };

  // Toutes les interactions évitent les doublons (vus, en cours, à voir et blacklistés).
  const knownInteractionRows = await fetchAllRows(() => sb.from('interactions')
    .select('id, media(tmdb_id, media_type)').eq('user_id', currentUser.id).order('id'));
  const knownEpisodeRows = await fetchAllRows(() => sb.from('episode_interactions')
    .select('id, episodes(seasons(media(tmdb_id, media_type)))')
    .eq('user_id', currentUser.id).order('id'));
  const alreadyKnown = new Set();
  for (const row of knownInteractionRows) {
    const media = row.media;
    if (media?.tmdb_id != null && media?.media_type) alreadyKnown.add(`${media.media_type}-${media.tmdb_id}`);
  }
  for (const row of knownEpisodeRows) {
    const media = row.episodes?.seasons?.media;
    if (media?.tmdb_id != null && media?.media_type) alreadyKnown.add(`${media.media_type}-${media.tmdb_id}`);
  }

  const perSeed = await mapWithConcurrency(seeds, 4, async r => {
    const mediaType = r.media.media_type;
    try {
      const response = await tmdbFetch(`/${mediaType}/${r.media.tmdb_id}/recommendations`);
      return {
        seedKey: `${mediaType}-${r.media.tmdb_id}`,
        seedTitle: r.media.title,
        mediaType,
        results: (response.results ?? []).slice(0, 12),
      };
    } catch {
      return { seedKey: `${mediaType}-${r.media.tmdb_id}`, seedTitle: r.media.title, mediaType, results: [] };
    }
  });

  const candidates = new Map();
  for (const source of perSeed) {
    for (const raw of source.results) {
      if (!raw || raw.id == null) continue;
      // Les endpoints /movie/... et /tv/... ne renvoient pas toujours media_type.
      const mediaType = raw.media_type === 'movie' || raw.media_type === 'tv' ? raw.media_type : source.mediaType;
      const key = `${mediaType}-${raw.id}`;
      if (alreadyKnown.has(key)) continue;
      let candidate = candidates.get(key);
      if (!candidate) {
        candidate = { raw, mediaType, sources: new Map() };
        candidates.set(key, candidate);
      }
      candidate.sources.set(source.seedKey, source.seedTitle);
    }
  }

  const ranked = [...candidates.values()].sort((a, b) => {
    // Le signal le plus fort est le nombre de favoris personnels qui pointent
    // vers le titre ; la note TMDB et la popularité départagent les égalités.
    const score = x => x.sources.size * 10
      + (Math.max(0, Math.min(10, Number(x.raw.vote_average) || 0)) * 0.35)
      + Math.log10(Math.max(0, Number(x.raw.popularity) || 0) + 1) * 0.25;
    return score(b) - score(a);
  });

  const recs = ranked.slice(0, 18).map(candidate => {
    const media = normalizeTMDB(candidate.raw, candidate.mediaType);
    const sourceTitles = [...candidate.sources.values()];
    media.recommendationMatchCount = sourceTitles.length;
    media.recommendationReason = sourceTitles.length > 1
      ? `Proche de ${sourceTitles.slice(0, 2).join(' et ')}${sourceTitles.length > 2 ? ` (+${sourceTitles.length - 2})` : ''}`
      : `Parce que tu as aimé ${sourceTitles[0]}`;
    return media;
  });

  return { seeds: seeds.map(r => r.media.title), recs };
}

function recommendationCardHtml(media) {

      ${poster ? `<img src="${poster}" alt="${escapeHtml(media.title)}" loading="lazy" />` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:#64748b;padding:8px;text-align:center;">${escapeHtml(media.title)}</div>`}

// ============================================================================
// MODE TIMELINE — Étape 4 (synchronisé Supabase depuis la migration serveur)
// Ordonne des œuvres par chronologie interne d'univers plutôt que par date de
// sortie.
// ============================================================================
async function setTimelineEntryDb(mediaId, order, label) {
  await ensureFreshSession();
  const patch = {};
  if (order !== undefined) patch.timeline_order = order;
  if (label !== undefined) patch.timeline_label = label;
  // Une série suivie uniquement via ses épisodes n'a parfois AUCUNE ligne
  // `interactions` (seule `episode_interactions` existe) — un simple UPDATE
  // échouait alors silencieusement (0 ligne affectée, pas d'erreur), et le
  // classement Timeline ne se sauvegardait jamais pour elle.
  const { data: existing, error: selErr } = await sb.from('interactions').select('id')
    .eq('user_id', currentUser.id).eq('media_id', mediaId).maybeSingle();
  if (selErr) throw new Error(formatSbError(selErr));
  if (existing) {
    const { error } = await sb.from('interactions').update(patch).eq('id', existing.id);
    if (error) throw new Error(formatSbError(error));
  } else {
    // Seule une série effectivement complète peut atteindre la Timeline
    // (voir getWatchedItemsFull), donc status:'watched' est correct ici.
    const { error } = await sb.from('interactions').insert({ user_id: currentUser.id, media_id: mediaId, status: 'watched', ...patch });
    if (error) throw new Error(formatSbError(error));
  }
}
async function removeTimelineEntryDb(mediaId) {
  await ensureFreshSession();
  const { error } = await sb.from('interactions').update({ timeline_order: null, timeline_label: null })
    .eq('user_id', currentUser.id).eq('media_id', mediaId);
  if (error) throw new Error(formatSbError(error));
}

async function addToTimelineImpl(mediaId) {
  const maxOrder = (watchedItemsCache ?? []).reduce((m, it) => Math.max(m, it.timeline_order ?? 0), 0);
  await setTimelineEntryDb(mediaId, maxOrder + 1, '');
  const item = watchedItemsCache?.find(i => i.id === mediaId);
  if (item) { item.timeline_order = maxOrder + 1; item.timeline_label = ''; }
}
async function removeFromTimelineImpl(mediaId) {
  await removeTimelineEntryDb(mediaId);
  const item = watchedItemsCache?.find(i => i.id === mediaId);
  if (item) { item.timeline_order = null; item.timeline_label = null; }
}
async function updateTimelineLabelImpl(mediaId, label) {
  await setTimelineEntryDb(mediaId, undefined, label);
  const item = watchedItemsCache?.find(i => i.id === mediaId);
  if (item) item.timeline_label = label;
}
async function moveTimelineItemImpl(mediaId, dir) {
  const inTimeline = (watchedItemsCache ?? []).filter(i => i.timeline_order != null).sort((a, b) => a.timeline_order - b.timeline_order);
  const idx = inTimeline.findIndex(i => i.id === mediaId);
  const swapIdx = idx + dir;
  if (idx < 0 || swapIdx < 0 || swapIdx >= inTimeline.length) return;
  const a = inTimeline[idx], b = inTimeline[swapIdx];
  const aOrder = a.timeline_order, bOrder = b.timeline_order;
  await Promise.all([setTimelineEntryDb(a.id, bOrder, undefined), setTimelineEntryDb(b.id, aOrder, undefined)]);
  a.timeline_order = bOrder; b.timeline_order = aOrder;
}

/** Journal façon Letterboxd : tout ce qui a été vu (films/séries + épisodes),
 * trié du plus récent au plus ancien. Deux requêtes ciblées (mêmes tables et
 * même échelle que getProfileStats, déjà utilisée ailleurs) plutôt qu'une
 * troisième source de données à maintenir. */
async function getJournalEntries() {
  if (!currentUser) return [];

  const movieRows = await fetchAllRows(() => sb.from('interactions')
    .select('watched_at, rating, review, media(*)')
    .eq('user_id', currentUser.id).eq('status', 'watched').not('watched_at', 'is', null).order('id', { ascending: true }));

  const epRows = await fetchAllRows(() => sb.from('episode_interactions')
    .select('watched_at, rating, review, episodes(episode_number, title, seasons(season_number, media(*)))')
    .eq('user_id', currentUser.id).not('watched_at', 'is', null).order('id'));

  const entries = [];
  for (const r of movieRows ?? []) {
    if (!r.media) continue;
    entries.push({ date: r.watched_at, kind: 'media', media: r.media, rating: r.rating, review: r.review });
  }
  for (const r of epRows ?? []) {
    const ep = r.episodes, season = ep?.seasons, media = season?.media;
    if (!media) continue;
    entries.push({
      date: r.watched_at, kind: 'episode', media,
      seasonNumber: season.season_number, episodeNumber: ep.episode_number, episodeTitle: ep.title,
      rating: r.rating, review: r.review,
    });
  }
  entries.sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0)); // plus récent en premier, dates normalisées à l'affichage
  return entries;
}

// Cache en mémoire du journal : les filtres modifient uniquement le DOM de résultats,
// sans refaire les requêtes ni déplacer le focus à chaque frappe.
let journalEntriesCache = [];
let journalFilterState = { query: '', kind: 'all', period: 'all' };

/** Retourne le jour local du visionnage. Les valeurs date-only restent inchangées ;
 * les timestamps ISO sont convertis en date locale, puis normalisés en YYYY-MM-DD. */
function journalDateKey(value) {
  if (!value) return '';
  const raw = String(value);
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  const d = new Date(raw);
  if (Number.isNaN(d.getTime())) return raw.slice(0, 10);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function journalEntryHtml(entry) {
  const poster = posterUrl(entry.media.poster_path, 'w200');
  const isEpisode = entry.kind === 'episode';
  const subtitle = isEpisode
    ? `S${String(entry.seasonNumber ?? '?').padStart(2, '0')}E${String(entry.episodeNumber ?? '?').padStart(2, '0')}${entry.episodeTitle ? ' · ' + escapeHtml(entry.episodeTitle) : ''}`
    : (entry.media.release_date || entry.media.first_air_date || '').slice(0, 4);
  const typeLabel = isEpisode ? 'ÉPISODE' : (entry.media.media_type === 'tv' ? 'SÉRIE' : 'FILM');
  const reviewExcerpt = (entry.review ?? '').trim();
  const dateKey = journalDateKey(entry.date);
  return `
  <a class="journal-entry" href="#/media/${entry.media.media_type}/${entry.media.tmdb_id}">
    <div class="journal-entry-poster">${poster ? `<img src="${poster}" alt="Affiche de ${escapeHtml(entry.media.title)}" loading="lazy" decoding="async" />` : `<div class="image-fallback"><span>${escapeHtml(entry.media.title)}</span></div>`}</div>
    <div class="journal-entry-info">
      <div class="journal-entry-overline"><span>${typeLabel}</span>${subtitle && !isEpisode ? `<span>${escapeHtml(subtitle)}</span>` : ''}</div>
      <div class="journal-entry-title">${escapeHtml(entry.media.title)}</div>
      ${isEpisode && subtitle ? `<div class="journal-entry-subtitle">${subtitle}</div>` : ''}
      ${entry.rating != null ? `<div class="journal-entry-stars" aria-label="Note ${entry.rating} sur 5">${starsDisplayHtml(entry.rating)}</div>` : ''}
      ${reviewExcerpt ? `<div class="journal-entry-review">“${escapeHtml(reviewExcerpt.length > 160 ? reviewExcerpt.slice(0, 160) + '…' : reviewExcerpt)}”</div>` : ''}
    </div>
    <div class="journal-entry-arrow" aria-hidden="true">↗</div>
  </a>`;
}

function journalNormalizeText(value) {
  return String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('fr-FR').trim();
}

function filterJournalEntries(entries) {
  const query = journalNormalizeText(journalFilterState.query);
  const kind = journalFilterState.kind;
  let cutoffKey = '';
  if (journalFilterState.period !== 'all') {
    const days = Number(journalFilterState.period);
    const cutoff = new Date();
    cutoff.setHours(0, 0, 0, 0);
    cutoff.setDate(cutoff.getDate() - Math.max(0, days - 1));
    cutoffKey = journalDateKey(cutoff.toISOString());
  }
  return entries.filter(entry => {
    const isEpisode = entry.kind === 'episode';
    if (kind === 'episodes' && !isEpisode) return false;
    if (kind === 'media' && (isEpisode || !['movie', 'tv'].includes(entry.media?.media_type))) return false;
    if (kind === 'reviews' && !(String(entry.review ?? '').trim() || entry.rating != null)) return false;
    const dateKey = journalDateKey(entry.date);
    if (cutoffKey && dateKey < cutoffKey) return false;
    if (query) {
      const haystack = journalNormalizeText([
        entry.media?.title, entry.episodeTitle, entry.review,
        isEpisode ? `saison ${entry.seasonNumber} episode ${entry.episodeNumber}` : '',
      ].filter(Boolean).join(' '));
      if (!haystack.includes(query)) return false;
    }
    return true;
  });
}

function journalSummaryHtml(entries) {
  const mediaCount = entries.filter(e => e.kind !== 'episode').length;
  const episodeCount = entries.filter(e => e.kind === 'episode').length;
  const notedCount = entries.filter(e => e.rating != null || String(e.review ?? '').trim()).length;
  const stats = [
    { value: entries.length, label: 'entrées' },
    { value: mediaCount, label: 'films & séries' },
    { value: episodeCount, label: 'épisodes' },
    { value: notedCount, label: 'avec une note ou un avis' },
  ];
  return stats.map(s => `<div class="journal-stat"><span class="journal-stat-value">${s.value}</span><span class="journal-stat-label">${s.label}</span></div>`).join('');
}

function renderJournalEntryResults() {
  const resultsBox = document.getElementById('journal-entry-results');
  const count = document.getElementById('journal-result-count');
  const summary = document.getElementById('journal-summary');
  if (!resultsBox) return;
  const filtered = filterJournalEntries(journalEntriesCache);
  if (count) count.textContent = `${filtered.length} résultat${filtered.length > 1 ? 's' : ''} sur ${journalEntriesCache.length}`;
  if (summary) summary.innerHTML = journalSummaryHtml(journalEntriesCache);
  if (!filtered.length) {
    const hasFilters = Boolean(journalFilterState.query || journalFilterState.kind !== 'all' || journalFilterState.period !== 'all');
    resultsBox.innerHTML = `<div class="journal-state-card">
      <div class="journal-state-icon">${hasFilters ? '⌕' : '◷'}</div>
      <h3>${hasFilters ? 'Aucun résultat pour ces filtres' : 'Ton journal commence ici'}</h3>
      <p>${hasFilters ? 'Essaie un autre mot-clé ou élargis la période sélectionnée.' : 'Les films, séries et épisodes que tu marques comme vus apparaîtront ici, dans l’ordre de tes visionnages.'}</p>
      ${hasFilters ? `<button class="btn ghost" type="button" onclick="app.resetJournalFilters()">Effacer les filtres</button>` : `<a class="btn blue" href="#/search">Découvrir des œuvres</a>`}
    </div>`;
    return;
  }
  const groups = [];
  let group = null;
  for (const entry of filtered) {
    const key = journalDateKey(entry.date);
    if (!group || group.date !== key) {
      group = { date: key, items: [] };
      groups.push(group);
    }
    group.items.push(entry);
  }
  resultsBox.innerHTML = groups.map(g => `
    <section class="journal-day-group" aria-label="${escapeHtml(formatCalendarDate(g.date))}">
      <div class="journal-day-heading"><div class="journal-day-label">${escapeHtml(formatCalendarDate(g.date))}</div><span>${g.items.length} entrée${g.items.length > 1 ? 's' : ''}</span></div>
      <div class="journal-day-list">${g.items.map(journalEntryHtml).join('')}</div>
    </section>`).join('');
}

let currentFranchiseKey = null;
let currentFranchiseOrder = 'chrono'; // 'chrono' | 'release'

/** Récupère les détails de chaque film de la franchise (réutilise
 * getMediaDetails, donc son cache mémoire — pas de refetch si déjà visité). */
async function getFranchiseData(key) {
  const preset = UNIVERSE_PRESETS[key];
  const films = await mapWithConcurrency(preset.films, 4, async f => {
    try {
      const media = await getMediaDetails(f.tmdbId, 'movie');
      return { ...media, chronoOrder: f.chronoOrder, chronoLabel: f.chronoLabel };
    } catch { return null; } // un film indisponible ne doit pas casser toute la saga
  });
  return { ...preset, films: films.filter(Boolean) };
}

/** N'importe que les films déjà marqués "vus" (la Timeline ne porte que sur
 * les œuvres vues, voir getWatchedItemsFull) — écritures parallélisées. */
async function importUniverseToTimelineImpl() {
  const franchise = currentFranchiseData;
  if (!franchise) return { imported: 0, skipped: 0 };
  const sorted = [...franchise.films].sort((a, b) => a.chronoOrder - b.chronoOrder);
  const toImport = sorted.filter(f => currentFranchiseInteractions[f.id]?.status === 'watched');
  await mapWithConcurrency(toImport, 4, f => setTimelineEntryDb(f.id, f.chronoOrder, f.chronoLabel));
  watchedItemsCache = null; // la Timeline doit refléter ce changement au prochain accès
  return { imported: toImport.length, skipped: sorted.length - toImport.length };
}

/** Une seule requête large ; tous les calculs (heatmap, objectif, temps d'écran,
 * wrapped, fidélité) se font ensuite côté client sur ces deux tableaux. */
async function getProfileStats() {
  // Les statistiques et le Wrapped doivent compter tout l'historique : comme
  // pour les épisodes, on pagine les interactions pour dépasser la limite 1000.
  const interactionRows = await fetchAllRows(() => sb.from('interactions')
    .select('status, rating, review, watched_at, rewatch_count, media(*)')
    .eq('user_id', currentUser.id).order('id', { ascending: true }));

  const epRows = await fetchAllRows(() => sb.from('episode_interactions')
    .select('watched_at, rewatch_count, episodes(runtime, seasons(media_id, media(*)))')
    .eq('user_id', currentUser.id).order('id', { ascending: true }));

  return { interactionRows: interactionRows ?? [], epRows: epRows ?? [] };
}

/** Calcule le streak courant et le meilleur streak à partir d'un ensemble de
 * dates 'YYYY-MM-DD' où au moins un visionnage a eu lieu. Le streak courant
 * reste "vivant" tant qu'aujourd'hui n'est pas fini : s'il n'y a rien
 * aujourd'hui mais qu'hier compte, le streak n'est pas encore rompu. */
function computeStreakFromDays(daySet) {
  if (daySet.size === 0) return { current: 0, longest: 0 };
  const sorted = [...daySet].sort(); // les chaînes 'YYYY-MM-DD' se trient chronologiquement telles quelles
  let longest = 1, run = 1;
  for (let i = 1; i < sorted.length; i++) {
    const diff = Math.round((new Date(sorted[i] + 'T00:00:00') - new Date(sorted[i - 1] + 'T00:00:00')) / 86400000);
    run = diff === 1 ? run + 1 : 1;
    if (run > longest) longest = run;
  }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayStr = localDateISO(today);
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = localDateISO(yesterday);

  let cursor;
  if (daySet.has(todayStr)) cursor = today;
  else if (daySet.has(yesterdayStr)) cursor = yesterday;
  else return { current: 0, longest };

  let current = 0;
  while (daySet.has(localDateISO(cursor))) { current++; cursor.setDate(cursor.getDate() - 1); }
  return { current, longest };
}

// Cache de session pour le streak affiché dans la barre du haut : chargé une
// seule fois (via getProfileStats, déjà utilisé par la page Profil — aucune
// requête dédiée en plus) puis mis à jour localement à chaque visionnage,
// jamais refetché à chaud pour rester léger.
let streakCache = null; // { current, longest, days: Set<string> }

async function loadStreakCache() {
  if (!currentUser || streakCache) return; // déjà chargé cette session
  try {
    const stats = await getProfileStats();
    const days = new Set();
    for (const r of stats.interactionRows) { const day = normalizeWatchedDay(r.watched_at); if (r.status === 'watched' && day) days.add(day); }
    for (const r of stats.epRows) { const day = normalizeWatchedDay(r.watched_at); if (day) days.add(day); }
    streakCache = { ...computeStreakFromDays(days), days };
    updateStreakBadge();
  } catch { /* le badge de streak est un bonus, une erreur ici ne doit pas gêner le reste de l'app */ }
}

/** À appeler après tout visionnage (film/série/épisode) : met à jour le streak
 * en mémoire sans requête réseau, en ajoutant simplement le jour courant. */
function noteWatchedToday() {
  invalidatePersonalViews();
  if (!streakCache) return;
  const todayStr = localDateISO();
  if (streakCache.days.has(todayStr)) return; // déjà compté aujourd'hui
  streakCache.days.add(todayStr);
  const recomputed = computeStreakFromDays(streakCache.days);
  streakCache.current = recomputed.current;
  streakCache.longest = recomputed.longest;
  updateStreakBadge();
}

function updateStreakBadge() {
  const el = document.getElementById('streak-badge');
  if (!el) return;
  if (!streakCache || streakCache.current === 0) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = `🔥 ${streakCache.current}`;
}

function buildActivityMap(interactionRows, epRows) {
  const map = {};
  for (const r of interactionRows) {
    if (r.status !== 'watched') continue;
    const day = normalizeWatchedDay(r.watched_at);
    if (day) map[day] = (map[day] || 0) + 1;
  }
  for (const r of epRows) {
    const day = normalizeWatchedDay(r.watched_at);
    if (day) map[day] = (map[day] || 0) + 1;
  }
  return map;
}

function buildWeeklyMinutes(interactionRows, epRows) {
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(localDateISO(d)); }
  const minutesByDay = Object.fromEntries(days.map(d => [d, 0]));
  for (const r of interactionRows) {
    const day = normalizeWatchedDay(r.watched_at);
    if (r.status === 'watched' && day && minutesByDay[day] !== undefined) minutesByDay[day] += (r.media?.runtime || 0);
  }
  for (const r of epRows) {
    const day = normalizeWatchedDay(r.watched_at);
    if (day && minutesByDay[day] !== undefined) minutesByDay[day] += (r.episodes?.runtime || 0);
  }
  return days.map(d => ({ date: d, minutes: minutesByDay[d] }));
}

/** Genres les plus regardés (films + séries vus), à partir des données déjà
 * chargées pour le profil — aucune requête en plus. */
function buildGenreDistribution(interactionRows) {
  const counts = {};
  for (const r of interactionRows) {
    if (r.status !== 'watched' || !r.media?.genres) continue;
    for (const g of r.media.genres) counts[g] = (counts[g] || 0) + 1;
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8);
}

/** Activité des 12 derniers mois (nombre de films/épisodes vus par mois), à
 * partir de l'activityMap déjà construite pour le calendrier d'activité. */
function buildMonthlyActivity(activityMap) {
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    months.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, label: d.toLocaleDateString('fr-FR', { month: 'short' }) });
  }
  const counts = Object.fromEntries(months.map(m => [m.key, 0]));
  for (const [date, count] of Object.entries(activityMap)) {
    const monthKey = date.slice(0, 7);
    if (counts[monthKey] !== undefined) counts[monthKey] += count;
  }
  return months.map(m => ({ label: m.label, count: counts[m.key] }));
}

/** Films/séries les plus revus — combine le rewatch_count des films
 * (interactions) et la somme des rewatch_count par série (episode_interactions,
 * un épisode peut être revu plusieurs fois indépendamment des autres). */
function buildMostRewatched(interactionRows, epRows) {
  const items = [];
  for (const r of interactionRows) {
    if (r.media && (r.rewatch_count ?? 0) > 0) items.push({ media: r.media, count: r.rewatch_count });
  }
  const showRewatchByMedia = new Map();
  for (const r of epRows) {
    const count = r.rewatch_count ?? 0;
    if (!count) continue;
    const media = r.episodes?.seasons?.media;
    if (!media) continue;
    if (!showRewatchByMedia.has(media.id)) showRewatchByMedia.set(media.id, { media, count: 0 });
    showRewatchByMedia.get(media.id).count += count;
  }
  items.push(...showRewatchByMedia.values());
  return items.sort((a, b) => b.count - a.count).slice(0, 8);
}

function wrappedRelation(value) {
  return Array.isArray(value) ? (value[0] ?? null) : (value ?? null);
}

function wrappedPeriodRange(period) {
  const today = localDateISO();
  if (period === 'year') return { start: `${new Date().getFullYear()}-01-01`, end: today, label: `Année ${new Date().getFullYear()}` };
  if (period === 'all') return { start: null, end: today, label: 'Depuis le début' };
  const startDate = new Date();
  startDate.setHours(12, 0, 0, 0);
  startDate.setDate(startDate.getDate() - 29);
  return { start: localDateISO(startDate), end: today, label: '30 derniers jours' };
}

function buildWrappedStats(interactionRows = [], epRows = [], period = '30d') {
  const range = wrappedPeriodRange(period);
  const inRange = value => {
    const day = normalizeWatchedDay(value);
    if (!day) return period === 'all';
    return day <= range.end && (!range.start || day >= range.start);
  };
  const activeInteractions = interactionRows.filter(r => r.status === 'watched' && inRange(r.watched_at));
  const activeEpisodes = epRows.filter(r => inRange(r.watched_at));
  const movies = activeInteractions.filter(r => wrappedRelation(r.media)?.media_type === 'movie');
  const tvInteractions = activeInteractions.filter(r => wrappedRelation(r.media)?.media_type === 'tv');

  const mediaById = new Map();
  const seriesById = new Map();
  const addMedia = (media, fallbackId) => {
    media = wrappedRelation(media);
    if (!media) return null;
    const id = media.id ?? fallbackId ?? `${media.media_type || 'media'}:${media.tmdb_id ?? media.title}`;
    if (!mediaById.has(String(id))) mediaById.set(String(id), media);
    return String(id);
  };
  for (const row of [...movies, ...tvInteractions]) {
    const media = wrappedRelation(row.media);
    const fallback = row.media_id ?? (media ? `tmdb:${media.media_type}:${media.tmdb_id}` : null);
    const id = addMedia(media, fallback);
    if (id && media?.media_type === 'tv' && !seriesById.has(id)) seriesById.set(id, { id, media, episodes: 0 });
  }
  for (const row of activeEpisodes) {
    const episode = wrappedRelation(row.episodes);
    const season = wrappedRelation(episode?.seasons);
    const media = wrappedRelation(season?.media);
    const id = addMedia(media, season?.media_id ?? media?.id);
    if (id && media) {
      if (!seriesById.has(id)) seriesById.set(id, { id, media, episodes: 0 });
      seriesById.get(id).episodes += 1;
    }
  }

  const genreCount = new Map();
  for (const media of mediaById.values()) {
    const genres = Array.isArray(media.genres) ? media.genres : [];
    for (const genre of genres) {
      const name = typeof genre === 'string' ? genre : (genre?.name || 'Autre');
      if (name) genreCount.set(name, (genreCount.get(name) || 0) + 1);
    }
  }
  const genres = [...genreCount.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4);
  const rated = activeInteractions.map(row => ({ row, media: wrappedRelation(row.media), rating: Number(row.rating) }))
    .filter(item => item.media && Number.isFinite(item.rating) && item.rating > 0);
  const avgRating = rated.length ? (rated.reduce((sum, item) => sum + item.rating, 0) / rated.length).toFixed(1) : null;
  rated.sort((a, b) => b.rating - a.rating);
  const topRated = rated[0] ? { title: rated[0].media.title || rated[0].media.name || 'Sans titre', rating: rated[0].rating, mediaType: rated[0].media.media_type } : null;

  const activity = new Map();
  const addActivity = dayValue => {
    const day = normalizeWatchedDay(dayValue);
    if (day && day <= range.end && (!range.start || day >= range.start)) activity.set(day, (activity.get(day) || 0) + 1);
  };
  for (const row of activeInteractions) addActivity(row.watched_at);
  for (const row of activeEpisodes) addActivity(row.watched_at);
  const peak = [...activity.entries()].sort((a, b) => b[1] - a[1] || b[0].localeCompare(a[0]))[0];
  let peakDay = null;
  if (peak) {
    const parsed = new Date(`${peak[0]}T12:00:00`);
    peakDay = { label: parsed.toLocaleDateString('fr-FR', { weekday: 'long' }), count: peak[1], date: peak[0] };
  }
  const streak = computeStreakFromDays(new Set(activity.keys()));
  const totalMinutes = movies.reduce((sum, row) => sum + (Number(wrappedRelation(row.media)?.runtime) || 0), 0)
    + activeEpisodes.reduce((sum, row) => sum + (Number(wrappedRelation(row.episodes)?.runtime) || 0), 0);
  const sortedSeries = [...seriesById.values()].sort((a, b) => b.episodes - a.episodes || String(a.media.title || a.media.name || '').localeCompare(String(b.media.title || b.media.name || '')));
  const topSeries = sortedSeries[0] && sortedSeries[0].episodes > 0
    ? { title: sortedSeries[0].media.title || sortedSeries[0].media.name || 'Série suivie', episodes: sortedSeries[0].episodes }
    : null;
  const seriesCount = seriesById.size;
  const activeDays = activity.size;
  const mood = activeEpisodes.length >= 24 ? 'Marathonien' : (movies.length >= activeEpisodes.length && movies.length > 0 ? 'Grand écran' : (totalMinutes >= 720 ? 'Binge-watcher' : 'Explorateur'));
  const totalHours = Math.round(totalMinutes / 60);
  const hasActivity = movies.length + activeEpisodes.length > 0;
  return {
    period, periodLabel: range.label, start: range.start, end: range.end,
    moviesCount: movies.length, episodesCount: activeEpisodes.length, seriesCount,
    totalMinutes, totalHours, formattedDuration: formatWatchDuration(totalMinutes),
    topGenre: genres[0]?.[0] ?? null, genres, avgRating, topRated, topSeries,
    peakDay, activeDays, currentStreak: streak.current, longestStreak: streak.longest,
    watchedTitleCount: mediaById.size, mood, hasActivity,
  };
}

function build30DayWrapped(interactionRows, epRows) {
  return buildWrappedStats(interactionRows, epRows, '30d');
}

function buildLoyaltyIndex(interactionRows, epRows) {
  const watchedMovies = interactionRows.filter(r => r.status === 'watched' && r.media?.media_type === 'movie');
  const discoveryMin = watchedMovies.reduce((s, r) => s + (r.media?.runtime || 0), 0) + epRows.reduce((s, r) => s + (r.episodes?.runtime || 0), 0);
  const rewatchMin = watchedMovies.reduce((s, r) => s + (r.media?.runtime || 0) * (r.rewatch_count || 0), 0);
  const total = discoveryMin + rewatchMin;
  return { discoveryMin, rewatchMin, pct: total ? Math.round((rewatchMin / total) * 100) : 0 };
}

function buildGoalProgress(interactionRows, epRows, goal) {
  const year = new Date().getFullYear();
  const yearStart = `${year}-01-01`;
  const moviesThisYear = interactionRows.filter(r => r.status === 'watched' && normalizeWatchedDay(r.watched_at) >= yearStart && normalizeWatchedDay(r.watched_at) <= localDateISO() && r.media?.media_type === 'movie').length;
  const showSet = new Set();
  for (const r of epRows) { const day = normalizeWatchedDay(r.watched_at); if (day && day >= yearStart && day <= localDateISO()) { const mid = r.episodes?.seasons?.media_id; if (mid) showSet.add(mid); } }
  const achieved = moviesThisYear + showSet.size;
  if (!goal) return { achieved, goal: null, pct: 0, paceMsg: null };

  const dayOfYear = Math.ceil((Date.now() - new Date(year, 0, 1).getTime()) / 86400000);
  const daysInYear = ((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0) ? 366 : 365;
  const expected = Math.round((goal * dayOfYear) / daysInYear);
  const pct = Math.min(100, Math.round((achieved / goal) * 100));
  const diff = achieved - expected;
  const paceMsg = diff >= 2 ? `En avance de ${diff} sur ton rythme idéal 🚀`
    : diff <= -2 ? `En retard de ${Math.abs(diff)} sur ton rythme idéal`
    : `Dans le rythme 👌`;
  return { achieved, goal, pct, paceMsg };
}

function heatmapHtml(activityMap) {
  const year = new Date().getFullYear();
  const start = new Date(year, 0, 1);
  const end = new Date(year, 11, 31);
  const gridStart = new Date(start);
  gridStart.setDate(gridStart.getDate() - gridStart.getDay());

  const weeks = [];
  let cur = new Date(gridStart);
  while (cur <= end) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      const dateStr = localDateISO(cur);
      const inYear = cur.getFullYear() === year;
      week.push({ date: dateStr, count: inYear ? (activityMap[dateStr] || 0) : -1 });
      cur.setDate(cur.getDate() + 1);
    }
    weeks.push(week);
  }

  const levelOf = (c) => c <= 0 ? '' : c === 1 ? 'lvl1' : c <= 3 ? 'lvl2' : c <= 5 ? 'lvl3' : 'lvl4';
  const cellsHtml = weeks.map(week => week.map(day =>
    day.count < 0 ? `<div style="width:11px;height:11px;"></div>`
      : `<div class="heatmap-cell ${levelOf(day.count)}" title="${day.date} — ${day.count} activité(s)"></div>`
  ).join('')).join('');

  return `
  <div class="heatmap-scroll">
    <div class="heatmap">${cellsHtml}</div>
  </div>
  <div class="heatmap-legend">
    <span>Moins</span>
    <div class="heatmap-cell"></div><div class="heatmap-cell lvl1"></div><div class="heatmap-cell lvl2"></div><div class="heatmap-cell lvl3"></div><div class="heatmap-cell lvl4"></div>
    <span>Plus</span>
  </div>`;
}

function genreTasteSummaryHtml(interactionRows) {
  const stats = new Map();
  for (const row of interactionRows || []) {
    const rating = Number(row.rating);
    if (!Number.isFinite(rating) || rating <= 0 || !row.media || !['watched','watching'].includes(row.status)) continue;
    for (const genre of row.media.genres || []) {

  const ranked = [...stats.values()].map(g => ({ ...g, average: g.total / g.count })).sort((a,b) => b.average - a.average || b.count-a.count).slice(0,5);
