// ============================================================================
// TMDB
// ============================================================================
const TMDB_BASE = 'https://api.themoviedb.org/3';

async function tmdbFetch(path, params = {}) {
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set('api_key', config.tmdbKey);
  url.searchParams.set('language', 'fr-FR');
  for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);

  const MAX_ATTEMPTS = 3;
  let lastError;
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    try {
      const res = await fetch(url.toString());
      if (res.ok) return res.json();
      // 502/503/504 = erreurs serveur temporaires côté TMDB, ça vaut le coup de réessayer
      if ([502, 503, 504].includes(res.status) && attempt < MAX_ATTEMPTS) {
        await new Promise(r => setTimeout(r, 400 * attempt));
        continue;
      }
      throw new Error(`TMDB ${path} a échoué (${res.status})`);
    } catch (err) {
      lastError = err;
      if (attempt < MAX_ATTEMPTS) { await new Promise(r => setTimeout(r, 400 * attempt)); continue; }
      throw lastError;
    }
  }
}

function posterUrl(path, size = 'w342') { return path ? `https://image.tmdb.org/t/p/${size}${path}` : null; }
function backdropUrl(path, size = 'w1280') { return path ? `https://image.tmdb.org/t/p/${size}${path}` : null; }

/** Cache mémoire (avec expiration — voir plus bas pourquoi) du nombre total
 * d'épisodes d'une série, sert à distinguer "série en cours" de "série
 * terminée" à plusieurs endroits de l'app (Reprendre sur l'accueil, Mes
 * listes), sans re-appeler TMDB à chaque rendu. */
const showTotalEpisodesCache = new Map(); // tmdb_id -> { value, expiresAt }
const SHOW_TOTAL_EPISODES_TTL_MS = 60 * 60 * 1000; // 1h : assez frais pour une série qui vient de sortir un nouvel épisode/une nouvelle saison, sans marteler TMDB
async function getShowTotalEpisodes(tmdbId) {
  const cached = showTotalEpisodesCache.get(tmdbId);
  if (cached && Date.now() < cached.expiresAt) return cached.value;
  try {
    const raw = await tmdbFetch(`/tv/${tmdbId}`);
    // number_of_episodes est le total agrégé que TMDB maintient lui-même
    // (affiché sur sa propre page du show) — plus fiable que resommer
    // manuellement episode_count saison par saison, ce dernier étant souvent
    // en retard sur une saison en cours de diffusion (donnée communautaire,
    // mise à jour épisode par épisode au fil de la diffusion).
    //
    // MAIS number_of_episodes inclut aussi les épisodes de la saison 0
    // (spéciaux/bonus/coulisses) — or getShowSeasonsList() les exclut
    // volontairement de l'interface, donc l'utilisateur ne peut jamais les
    // cocher. Sans cette soustraction, toute série ayant des spéciaux sur
    // TMDB restait "en cours" pour toujours, même entièrement regardée :
    // le compteur d'épisodes vus ne pouvait jamais atteindre ce total gonflé.
    const specialsCount = (raw.seasons ?? []).find(s => s.season_number === 0)?.episode_count ?? 0;
    const seasonsSum = (raw.seasons ?? []).filter(s => s.season_number > 0).reduce((sum, s) => sum + (s.episode_count ?? 0), 0);
    let total = raw.number_of_episodes != null ? raw.number_of_episodes - specialsCount : seasonsSum;
    // Série terminée/annulée : plus rien ne sera ajouté, donc la somme des
    // saisons est fiable ; on prend le plus petit des deux totaux pour ne pas
    // laisser une donnée agrégée TMDB gonflée bloquer la série en "en cours".
    if ((raw.status === 'Ended' || raw.status === 'Canceled') && seasonsSum > 0) total = Math.min(total, seasonsSum);
    showTotalEpisodesCache.set(tmdbId, { value: total, expiresAt: Date.now() + SHOW_TOTAL_EPISODES_TTL_MS });
    return total;
  } catch {
    return null; // TMDB indisponible : on ne peut pas trancher, on n'affichera juste pas de statut "terminée"
  }
}
// NOTE : mapWithConcurrency (utilitaire pour paralléliser les appels TMDB ci-dessus
// avec une limite) existe déjà plus loin dans ce fichier — inutile de le redéfinir.

/** Formate une durée de visionnage en s'adaptant à l'échelle : heures si < 1 jour,
 * jours (+ heures) si < 30 jours, mois (+ jours) au-delà — plus lisible qu'un
 * simple total en heures une fois qu'on a accumulé beaucoup de visionnage. */
// ============================================================================
// Étoiles (demi-points pris en charge, pas de rating entier)
// ============================================================================

/** Étoiles cliquables (0.5 à 5, par pas de 0.5). Chaque étoile est divisée en
 * deux zones cliquables (moitié gauche = X.5, moitié droite = X), avec un
 * remplissage visuel en dégradé via --fill (0%/50%/100%) plutôt que de
 * changer de glyphe — évite tout souci de rendu de caractère ⭐/½ selon police. */
function starRatingInputHtml(rating, onClickFn) {
  const r = rating ?? 0;
  return `<div class="star-rating">
    ${[1, 2, 3, 4, 5].map(i => {
      const fillPct = r >= i ? 100 : r >= i - 0.5 ? 50 : 0;
      return `<span class="star-slot" style="--fill:${fillPct}%">
        <span class="star-half star-half-left" onclick="${onClickFn}(${i - 0.5})"></span>
        <span class="star-half star-half-right" onclick="${onClickFn}(${i})"></span>
      </span>`;
    }).join('')}
  </div>`;
}

/** Version non-interactive (affichage seul) — même rendu visuel, sans les
 * zones cliquables, pour les listes/cartes/journal. */
function starsDisplayHtml(rating) {
  const r = rating ?? 0;
  return `<span class="star-rating star-rating-display">
    ${[1, 2, 3, 4, 5].map(i => {
      const fillPct = r >= i ? 100 : r >= i - 0.5 ? 50 : 0;
      return `<span class="star-slot" style="--fill:${fillPct}%"></span>`;
    }).join('')}
  </span>`;
}

/** Pour les exports texte (Markdown/Notion, story) où on ne peut pas mettre
 * de CSS : demi-étoile rendue avec "½" plutôt que d'arrondir en silence. */
function starsToText(rating) {
  if (rating == null) return '';
  const full = Math.floor(rating);
  const half = rating % 1 !== 0;
  const empty = 5 - full - (half ? 1 : 0);
  return '⭐'.repeat(full) + (half ? '½' : '') + '☆'.repeat(Math.max(0, empty));
}

/** Section repliable "Détailler ma note" : 4 mini lignes d'étoiles
 * (scénario / rythme / acteurs / mise en scène). Ouverte automatiquement si
 * au moins un critère est déjà renseigné. Sans effet si la migration
 * schema-v3-detailed-ratings.sql n'a pas été appliquée : les colonnes seront
 * simplement toujours vides et l'upsert échouera silencieusement (catché) —
 * le reste de l'app continue de fonctionner normalement. */
function detailedRatingSectionHtml(mediaId, interaction) {
  const hasAnyDetail = RATING_CRITERIA.some(c => interaction?.[c.key] != null);
  return `
  <details class="panel" style="margin-top:10px; padding:12px 14px;" ${hasAnyDetail ? 'open' : ''}>
    <summary style="cursor:pointer; font-size:13px; color:var(--muted);">🎚️ Détailler ma note (scénario, rythme, acteurs, mise en scène)</summary>
    <div id="detailed-rating-rows" style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
      ${RATING_CRITERIA.map(c => detailedRatingRowHtml(mediaId, c, interaction?.[c.key] ?? null)).join('')}
    </div>
  </details>`;
}
function detailedRatingRowHtml(mediaId, criterion, value) {
  return `
  <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
    <span style="font-size:12.5px; color:#cbd5e1; min-width:110px;">${criterion.label}</span>
    <div id="detail-stars-${criterion.key}" class="stars" style="transform:scale(0.8); transform-origin:right center;">
      ${starRatingInputHtml(value, `app.detailRateCriterion.bind(null, '${mediaId}', '${criterion.key}')`)}
    </div>
  </div>`;
}

function formatCurrencyUSD(amount) {
  if (!amount) return null;
  if (amount >= 1_000_000_000) return `$${(amount / 1_000_000_000).toFixed(2)} Md`;
  if (amount >= 1_000_000) return `$${(amount / 1_000_000).toFixed(1)} M`;
  if (amount >= 1_000) return `$${(amount / 1_000).toFixed(0)} k`;
  return `$${amount}`;
}

/** Estimation grossière de rentabilité façon industrie : un film en salles
 * doit généralement rapporter ~2.5x son budget (marketing + part exploitants
 * non incluse dans "budget" TMDB) pour être considéré rentable. Volontairement
 * simpliste — ignore SVOD/merchandising — d'où le mot "estimation" affiché. */
function computeBoxOfficeVerdict(budget, revenue) {
  if (!budget || !revenue) return null;
  const ratio = revenue / budget;
  if (ratio >= 2.5) return { label: '✅ Rentable (estimation)', color: 'var(--green)', ratio };
  if (ratio >= 1) return { label: '⚠️ Seuil incertain (estimation)', color: 'var(--amber)', ratio };
  return { label: '❌ Probable perte (estimation)', color: 'var(--red)', ratio };
}

function formatWatchDuration(totalMinutes) {
  const totalHours = totalMinutes / 60;
  if (totalHours < 24) return `${Math.round(totalHours)}h`;
  const totalDays = totalHours / 24;
  if (totalDays < 30) {
    const days = Math.floor(totalDays);
    const hours = Math.round((totalDays - days) * 24);
    return hours > 0 ? `${days}j ${hours}h` : `${days}j`;
  }
  const months = Math.floor(totalDays / 30);
  const days = Math.round(totalDays - months * 30);
  return days > 0 ? `${months} mois ${days}j` : `${months} mois`;
}

function normalizeTMDB(raw, mediaType) {
  return {
    tmdb_id: raw.id,
    media_type: mediaType,
    title: raw.title ?? raw.name ?? 'Sans titre',
    original_title: raw.original_title ?? raw.original_name ?? null,
    overview: raw.overview ?? null,
    tagline: raw.tagline ?? null,
    poster_path: raw.poster_path ?? null,
    backdrop_path: raw.backdrop_path ?? null,
    release_date: raw.release_date ?? raw.first_air_date ?? null,
    runtime: mediaType === 'movie' ? (raw.runtime ?? null) : (raw.episode_run_time?.[0] ?? null),
    genres: raw.genres?.map(g => g.name) ?? [],
    vote_average: raw.vote_average ?? null,
  };
}

// Cache mémoire (le temps de la session) des fiches média déjà résolues : sans lui,
// l'accueil refaisait un fetch TMDB + un upsert Supabase pour les MÊMES films/séries
// à chaque rafraîchissement stale-while-revalidate, plusieurs fois par session.
const mediaDetailsCache = new Map(); // clé "type:tmdbId" -> { data, expiresAt }
const MEDIA_DETAILS_TTL_MS = 30 * 60 * 1000; // 30 min : assez frais, sans re-fetch à chaque accueil

/** Rappel des sorties du jour — vérifié au plus une fois par jour (garde-fou
 * localStorage) pour ne jamais alourdir le chargement de l'accueil : les deux
 * appels réseau nécessaires (films en watchlist + prochains épisodes des
 * séries suivies) ne partent donc qu'une seule fois par jour, pas à chaque
 * ouverture de l'app. Utilise l'API Notification du navigateur si la
 * permission a été accordée, et affiche toujours un toast en complément (visible
 * même sans permission navigateur — parité avec les rappels de TV Time). */
async function checkReleaseReminders() {
  if (!currentUser) return;
  if (localStorage.getItem('streamtrack_notif_enabled') !== '1') return;
  const todayStr = localDateISO();
  if (localStorage.getItem('streamtrack_notif_last_check') === todayStr) return;
  try {
    const [movies, episodes] = await Promise.all([getUpcomingMovies(), getUpcomingEpisodes()]);
    localStorage.setItem('streamtrack_notif_last_check', todayStr);
    const todays = [
      ...movies.filter(m => m.release_date === todayStr).map(m => `🎬 ${m.title}`),
      ...episodes.filter(e => e.next.air_date === todayStr).map(e => `📺 ${e.show.title} S${e.next.season_number}E${e.next.episode_number}`),
    ];
    if (!todays.length) return;
    const summary = todays.length === 1
      ? `Sortie aujourd'hui : ${todays[0]}`
      : `${todays.length} sorties aujourd'hui : ${todays.slice(0, 3).join(', ')}${todays.length > 3 ? '…' : ''}`;
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      new Notification('StreamTrack', { body: summary });
    }
    showToast(summary, 'success');
  } catch { /* un rappel raté est un détail — ne doit jamais faire planter l'accueil */ }
}

async function getMediaDetails(tmdbId, mediaType) {
  const key = `${mediaType}:${tmdbId}`;
  const cached = mediaDetailsCache.get(key);
  if (cached && Date.now() < cached.expiresAt) return cached.data;

  // append_to_response regroupe plusieurs sous-ressources dans le MÊME appel
  // réseau (external_ids pour le lien IMDb, release_dates/content_ratings
  // pour la certification d'âge, keywords pour les mots-clés cliquables) —
  // zéro requête TMDB supplémentaire.
  const appendKey = mediaType === 'movie' ? 'release_dates' : 'content_ratings';
  const raw = await tmdbFetch(`/${mediaType}/${tmdbId}`, { append_to_response: `external_ids,keywords,${appendKey}` });
  const normalized = normalizeTMDB(raw, mediaType);
  const { data, error } = await sb.from('media').upsert(normalized, { onConflict: 'tmdb_id,media_type' }).select().single();
  if (error) throw new Error('Impossible de mettre en cache le média : ' + error.message);
  // next_episode_to_air ne fait pas partie du schéma persisté (ça changerait à
  // chaque diffusion), mais TMDB nous le donne gratuitement dans cette même
  // réponse — autant le garder en mémoire pour le compte à rebours de la fiche
  // détail plutôt que de le re-fetcher avec un appel TMDB dédié.
  if (mediaType === 'tv') data.next_episode_to_air = raw.next_episode_to_air ?? null;
  if (mediaType === 'tv') data.created_by = raw.created_by ?? [];
  if (mediaType === 'tv') data.status = raw.status ?? null; // "Returning Series" / "Ended" / "Canceled"…
  // belongs_to_collection (sagas) : même logique — donnée TMDB gratuite dans
  // cette réponse, jamais persistée en base (ce n'est pas une caractéristique
  // durable du média), gardée en mémoire pour le lien "Fait partie de…".
  if (mediaType === 'movie') data.belongs_to_collection = raw.belongs_to_collection ?? null;
  // Fiche technique de production : budget/revenu/studios (films) ou chaînes
  // (séries) — mêmes principes que ci-dessus, données TMDB gratuites dans
  // cette réponse, jamais persistées (pas des caractéristiques "durables" au
  // sens du schéma), gardées en mémoire pour le bloc "Production & Échelle".
  if (mediaType === 'movie') {
    data.budget = raw.budget ?? 0;
    data.revenue = raw.revenue ?? 0;
    data.production_companies = raw.production_companies ?? [];
  }
  if (mediaType === 'tv') data.networks = raw.networks ?? [];

  // Lien IMDb — imdb_id est directement sur /movie/{id}, mais seulement dans
  // external_ids pour /tv/{id} (d'où le append_to_response ci-dessus).
  data.imdb_id = mediaType === 'movie' ? (raw.imdb_id ?? null) : (raw.external_ids?.imdb_id ?? null);
  data.homepage = raw.homepage || null;

  // Mots-clés — TMDB nomme la clé différemment entre films (keywords.keywords)
  // et séries (keywords.results), asymétrie connue de leur API.
  data.keywords = (mediaType === 'movie' ? raw.keywords?.keywords : raw.keywords?.results) ?? [];

  // Certification d'âge (FR en priorité, sinon US en repli — beaucoup de
  // titres n'ont pas de certification française renseignée sur TMDB).
  data.certification = mediaType === 'movie'
    ? extractMovieCertification(raw.release_dates?.results)
    : extractTvCertification(raw.content_ratings?.results);

  mediaDetailsCache.set(key, { data, expiresAt: Date.now() + MEDIA_DETAILS_TTL_MS });
  return data;
}

function extractMovieCertification(releaseDatesResults) {
  if (!releaseDatesResults) return null;
  const fr = releaseDatesResults.find(r => r.iso_3166_1 === 'FR');
  const us = releaseDatesResults.find(r => r.iso_3166_1 === 'US');
  const cert = fr?.release_dates?.find(d => d.certification)?.certification
    || us?.release_dates?.find(d => d.certification)?.certification;
  return cert || null;
}

function extractTvCertification(contentRatingsResults) {
  if (!contentRatingsResults) return null;
  const fr = contentRatingsResults.find(r => r.iso_3166_1 === 'FR');
  const us = contentRatingsResults.find(r => r.iso_3166_1 === 'US');
  return fr?.rating || us?.rating || null;
}

function translateTvStatus(status) {
  const map = {
    'Returning Series': '🟢 En cours',
    'Ended': '⚫ Terminée',
    'Canceled': '🔴 Annulée',
    'In Production': '🟡 En production',
    'Planned': '🟡 Prévue',
    'Pilot': '🟡 Pilote',
  };
  return map[status] || status;
}

async function getTrending(mediaType) {
  const data = await tmdbFetch(`/trending/${mediaType}/week`);
  return data.results.map(r => normalizeTMDB(r, mediaType));
}

/** Casting + réalisateur (les showrunners d'une série viennent de created_by,
 * capturé directement sur l'objet média — voir getMediaDetails). */
async function getCredits(tmdbId, mediaType) {
  try {
    const data = await tmdbFetch(`/${mediaType}/${tmdbId}/credits`);
    const director = mediaType === 'movie' ? (data.crew ?? []).find(c => c.job === 'Director') ?? null : null;
    return { cast: (data.cast ?? []).slice(0, 12), director };
  } catch { return { cast: [], director: null }; } // ne doit jamais empêcher d'afficher le reste de la fiche
}

/** Films d'une saga (collection TMDB), triés par date de sortie. */
async function getCollectionMovies(collectionId) {
  const data = await tmdbFetch(`/collection/${collectionId}`);
  return {
    name: data.name,
    overview: data.overview,
    backdrop_path: data.backdrop_path,
    movies: (data.parts ?? [])
      .filter(m => m.release_date)
      .sort((a, b) => a.release_date.localeCompare(b.release_date))
      .map(m => normalizeTMDB(m, 'movie')),
  };
}

async function searchMedia(query) {
  if (!query.trim()) return { media: [], people: [] };
  const data = await tmdbFetch('/search/multi', { query, include_adult: 'false' });
  const media = data.results.filter(r => r.media_type === 'movie' || r.media_type === 'tv')
    .map(r => ({ ...normalizeTMDB(r, r.media_type), genre_ids: r.genre_ids ?? [] }));
  const people = data.results.filter(r => r.media_type === 'person' && r.profile_path)
    .slice(0, 6)
    .map(p => ({ id: p.id, name: p.name, profile_path: p.profile_path, known_for_department: p.known_for_department }));
  return { media, people };
}

/** Disponibilités de visionnage régionales issues de TMDB/JustWatch.
 * La région choisie est stockée localement et n'affecte aucune donnée du compte. */
const watchProvidersCache = new Map();
async function getWatchProviders(tmdbId, mediaType, region = (localStorage.getItem('streamtrack_provider_region') || 'FR')) {
  const country = ['FR', 'BE'].includes(String(region).toUpperCase()) ? String(region).toUpperCase() : 'FR';
  const key = `${mediaType}:${tmdbId}:${country}`;
  const cached = watchProvidersCache.get(key);
  if (cached && Date.now() < cached.expiresAt) return cached.value;
  try {
    const data = await tmdbFetch(`/${mediaType}/${tmdbId}/watch/providers`);
    const value = data.results?.[country] ?? null;
    watchProvidersCache.set(key, { value, expiresAt: Date.now() + 6 * 60 * 60 * 1000 });
    return value;
  } catch { return null; } // une erreur régionale ne bloque jamais la fiche
}

function watchProvidersHtml(providers, country = 'FR') {
  const groups = [
    ['flatrate', 'Inclus dans un abonnement'],
    ['free', 'Gratuit'],
    ['ads', 'Avec publicité'],
    ['rent', 'Location'],
    ['buy', 'Achat'],
  ];
  const present = groups.filter(([key]) => providers?.[key]?.length);
  if (!present.length) {
    return `<div class="provider-empty"><span aria-hidden="true">◌</span><div><strong>Aucune disponibilité confirmée</strong><p>TMDB ne renseigne pas d'offre pour ${country === 'BE' ? 'la Belgique' : 'la France'} sur ce titre. Le catalogue peut évoluer.</p></div></div>${providers?.link ? `<a class="provider-source-link" href="${escapeHtml(providers.link)}" target="_blank" rel="noreferrer">Vérifier toutes les options ↗</a>` : ''}`;
  }
  return `<div class="provider-groups">${present.map(([key, label]) => `<div class="provider-group"><span class="provider-group-label">${label}</span><div class="provider-logos">${providers[key].slice(0, 8).map(p => `<span class="provider-logo-wrap" title="${escapeHtml(p.provider_name)}">${p.logo_path ? `<img class="provider-logo" src="https://image.tmdb.org/t/p/w92${p.logo_path}" alt="" loading="lazy" />` : ''}<span>${escapeHtml(p.provider_name)}</span></span>`).join('')}</div></div>`).join('')}</div>${providers?.link ? `<a class="provider-source-link" href="${escapeHtml(providers.link)}" target="_blank" rel="noreferrer">Voir toutes les offres avec JustWatch ↗</a>` : ''}<p class="provider-attribution">Disponibilités fournies par TMDB / JustWatch. Elles peuvent varier selon l'abonnement et la date.</p>`;
}

// Cache de session pour les noms de genres (filtre de recherche) : chargé une
// seule fois, jamais refetché.
let genreNamesCache = null; // { movie: Map<id,name>, tv: Map<id,name> }
async function loadGenreNames() {
  if (genreNamesCache) return genreNamesCache;
  const [movieGenres, tvGenres] = await Promise.all([
    tmdbFetch('/genre/movie/list'),
    tmdbFetch('/genre/tv/list'),
  ]);
  genreNamesCache = {
    movie: new Map((movieGenres.genres ?? []).map(g => [g.id, g.name])),
    tv: new Map((tvGenres.genres ?? []).map(g => [g.id, g.name])),
  };
  return genreNamesCache;
}

async function getShowSeasonsList(tmdbId) {
  const data = await tmdbFetch(`/tv/${tmdbId}`);
  return (data.seasons ?? []).filter(s => s.season_number > 0);
}

/** Cherche la meilleure bande-annonce YouTube dispo pour un film/série (ou null si aucune) */
async function getBestTrailerKey(tmdbId, mediaType) {
  try {
    const data = await tmdbFetch(`/${mediaType}/${tmdbId}/videos`);
    const vids = data.results ?? [];
    const pick = vids.find(v => v.site === 'YouTube' && v.type === 'Trailer' && v.official)
      ?? vids.find(v => v.site === 'YouTube' && v.type === 'Trailer')
      ?? vids.find(v => v.site === 'YouTube' && v.type === 'Teaser');
    return pick ? pick.key : null;
  } catch { return null; }
}

/** Catégories TMDB additionnelles pour enrichir la page d'accueil — pas d'upsert Supabase ici
 * (contrairement à getMediaDetails), juste des listes légères pour affichage/clic-vers-détail. */
async function getMovieCategory(category) { // 'now_playing' | 'top_rated' | 'upcoming' | 'popular'
  const data = await tmdbFetch(`/movie/${category}`);
  return data.results.map(r => normalizeTMDB(r, 'movie'));
}
async function getTVCategory(category) { // 'top_rated' | 'on_the_air' | 'popular' | 'airing_today'
  const data = await tmdbFetch(`/tv/${category}`);
  return data.results.map(r => normalizeTMDB(r, 'tv'));
}

async function refreshCurrentUser() {
  if (!sb) { currentUser = null; return; }
  const { data } = await sb.auth.getUser();
  currentUser = data.user ?? null;
}

/** À appeler avant toute écriture en base : vérifie que la session est encore valide,
 * la rafraîchit si elle est proche de l'expiration, et échoue clairement plutôt que de
 * laisser partir une requête sans authentification valide (cause du bug RLS silencieux). */
/** Mémorise la page courante puis ouvre l'écran de connexion : après login,
 * l'utilisateur revient exactement là où il était (fiche film, liste…) au lieu
 * de l'accueil. sessionStorage = limité à l'onglet, rien de persistant. */
const AFTER_LOGIN_KEY = 'mt_after_login';
function redirectToLogin() {
  const here = location.hash || '#/';
  if (!here.startsWith('#/login')) {
    try { sessionStorage.setItem(AFTER_LOGIN_KEY, here); } catch { /* stockage indisponible : retour à l'accueil */ }
    navigate('#/login');
  }
}
function consumeAfterLoginHash() {
  try {
    const saved = sessionStorage.getItem(AFTER_LOGIN_KEY);
    sessionStorage.removeItem(AFTER_LOGIN_KEY);
    // Seules les routes internes sont acceptées (pas d'URL externe injectée).
    if (saved && /^#\/[\w\-/%.?=&]*$/.test(saved) && !saved.startsWith('#/login')) return saved;
  } catch { /* ignore */ }
  return '#/';
}

async function ensureFreshSession() {
  const { data, error } = await sb.auth.getSession();
  if (error) throw new Error('Session invalide : ' + formatSbError(error));

  if (!data.session) {
    const wasLoggedIn = !!currentUser;
    currentUser = null;
    redirectToLogin();
    throw new Error(wasLoggedIn
      ? "Ta session a expiré — reconnecte-toi pour continuer."
      : "Connecte-toi pour enregistrer ça dans ton suivi.");
  }

  const nowSec = Math.floor(Date.now() / 1000);
  if (data.session.expires_at && data.session.expires_at - nowSec < 60) {
    const { data: refreshed, error: refreshErr } = await sb.auth.refreshSession();
    if (refreshErr || !refreshed.session) {
      currentUser = null;
      redirectToLogin();
      throw new Error("Ta session a expiré — reconnecte-toi pour continuer.");
    }
    currentUser = refreshed.session.user;
  } else {
    currentUser = data.session.user;
  }
}

/** Supabase/PostgREST plafonne chaque requête à 1000 lignes (silencieusement) :
 * au-delà, compteurs "épisodes vus", "dernier épisode vu" et complétion des
 * séries étaient faux. Ce helper pagine jusqu'à épuisement. `buildQuery` doit
 * renvoyer une NOUVELLE requête à chaque appel, avec un tri stable. */
async function fetchAllRows(buildQuery, pageSize = 1000) {
  const all = [];
  for (let from = 0; ; from += pageSize) {
    const { data, error } = await buildQuery().range(from, from + pageSize - 1);
    if (error) throw new Error(formatSbError(error));
    const rows = data ?? [];
    all.push(...rows);
    if (rows.length < pageSize) break;
  }
  return all;
}

/** Message d'erreur Supabase complet (message + hint + details), pour un vrai diagnostic
 * au lieu du message générique tronqué. */
function formatSbError(error) {
  if (!error) return 'Erreur inconnue';
  let msg = error.message ?? String(error);
  if (error.hint) msg += ` — ${error.hint}`;
  if (error.details) msg += ` (${error.details})`;
  return msg;
}

async function signUp(email, password, username) {
  const { error } = await sb.auth.signUp({ email, password, options: { data: { username, display_name: username } } });
  return { error: error?.message ?? null };
}
async function signIn(email, password) {
  const { error } = await sb.auth.signInWithPassword({ email, password });
  return { error: error?.message ?? null };
}
async function signOut() { await sb.auth.signOut(); }

async function requestPasswordReset(email) {
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  return { error: error?.message ?? null };
}
async function updatePassword(newPassword) {
  const { error } = await sb.auth.updateUser({ password: newPassword });
  return { error: error?.message ?? null };
}
function isRecoveryHash() { return location.hash.includes('type=recovery'); }

/** Une seule variable en mémoire (pas de re-détection à chaque appel) : passe
 * à false dès qu'une requête confirme que les colonnes de notation détaillée
 * n'existent pas encore (migration schema-v3-detailed-ratings.sql non
 * appliquée). Évite de re-tenter une requête vouée à échouer à chaque fiche
 * média tant que la migration n'a pas été jouée. */
let detailedRatingColumnsAvailable = true;

async function getInteractionForMedia(mediaId) {
  if (!currentUser) return null;
  if (detailedRatingColumnsAvailable) {
    const { data, error } = await sb.from('interactions')
      .select('status, rating, review, rewatch_count, notes, tags, rating_story, rating_pacing, rating_acting, rating_directing')
      .eq('user_id', currentUser.id).eq('media_id', mediaId).maybeSingle();
    if (!error) return data;
    if (!/column .* does not exist/i.test(error.message)) throw new Error(error.message);
    detailedRatingColumnsAvailable = false; // repli une fois pour toutes sur l'ancien schéma
  }
  const { data, error } = await sb.from('interactions').select('status, rating, review, rewatch_count, notes, tags')
    .eq('user_id', currentUser.id).eq('media_id', mediaId).maybeSingle();
  if (error) throw new Error(error.message);
  return data;
}

// ============================================================================
// NOTATION DÉTAILLÉE (multi-critères) — optionnelle, en plus de la note
// globale rapide (rating). Nécessite schema-v3-detailed-ratings.sql.
// La note globale est recalculée automatiquement comme la moyenne des
// critères renseignés à chaque sauvegarde, arrondie au 0.5 le plus proche.
// ============================================================================
const RATING_CRITERIA = [
  { key: 'rating_story', label: 'Scénario' },
  { key: 'rating_pacing', label: 'Rythme' },
  { key: 'rating_acting', label: 'Acteurs' },
  { key: 'rating_directing', label: 'Mise en scène' },
];

function roundToHalf(n) { return Math.round(n * 2) / 2; }

/** Sauvegarde un critère de notation détaillée, puis recalcule et sauvegarde
 * la note globale comme moyenne des critères actuellement renseignés. Si la
 * migration SQL n'a pas encore été appliquée, l'erreur "colonne inconnue"
 * est traduite en message clair plutôt que de planter silencieusement. */
async function saveDetailedRating(mediaId, criterionKey, value, currentDetail) {
  await ensureFreshSession();
  const updated = { ...currentDetail, [criterionKey]: value };
  const filledValues = RATING_CRITERIA.map(c => updated[c.key]).filter(v => v != null && v !== '');
  const overall = filledValues.length ? roundToHalf(filledValues.reduce((a, b) => a + b, 0) / filledValues.length) : null;

  const { error } = await sb.from('interactions').upsert(
    { user_id: currentUser.id, media_id: mediaId, status: 'watched', rating: overall, [criterionKey]: value },
    { onConflict: 'user_id,media_id' }
  );
  if (error) {
    if (/column .* does not exist/i.test(error.message)) {
      detailedRatingColumnsAvailable = false;
      throw new Error("La notation détaillée nécessite d'avoir exécuté schema-v3-detailed-ratings.sql dans Supabase (SQL Editor).");
    }
    throw new Error(formatSbError(error));
  }
  return { ...updated, rating: overall };
}

/** Capsule Temporelle : ce qui a été vu à date identique (jour/mois) une ou plusieurs années plus tôt. */
async function getFlashbackItems() {
  if (!currentUser) return [];
  const today = new Date();
  const mmdd = today.toISOString().slice(5, 10);
  const thisYear = today.getFullYear();

  const { data: interactionRows, error: e1 } = await sb.from('interactions')
    .select('watched_at, media(*)').eq('user_id', currentUser.id).eq('status', 'watched');
  if (e1) throw new Error(formatSbError(e1));

  const { data: epRows, error: e2 } = await sb.from('episode_interactions')
    .select('watched_at, episodes(seasons(media(*)))').eq('user_id', currentUser.id);
  if (e2) throw new Error(formatSbError(e2));

  const map = new Map(); // media.id -> { media, yearsAgo } (garde le plus ancien souvenir)
  const consider = (watchedAt, media) => {
    if (!watchedAt || !media) return;
    if (watchedAt.slice(5, 10) !== mmdd) return;
    const y = parseInt(watchedAt.slice(0, 4), 10);
    if (!Number.isFinite(y) || y >= thisYear) return;
    const yearsAgo = thisYear - y;
    const existing = map.get(media.id);
    if (!existing || yearsAgo > existing.yearsAgo) map.set(media.id, { media, yearsAgo });
  };
  for (const r of (interactionRows ?? [])) consider(r.watched_at, r.media);
  for (const r of (epRows ?? [])) consider(r.watched_at, r.episodes?.seasons?.media);

  return [...map.values()];
}

/** Séries "à reprendre" sur l'accueil : les plus récemment avancées, mais
 * SEULEMENT celles qui ne sont pas terminées — sans ce filtre, une série vue
 * intégralement resterait proposée indéfiniment en "Reprendre" puisque ses
 * épisodes restent les plus récents dans l'historique. On élargit la fenêtre
 * de lecture (80 lignes / jusqu'à 20 séries distinctes) pour compenser celles
 * qui seront écartées, sans pour autant lancer des dizaines d'appels TMDB. */
async function getContinueWatching() {
  if (!currentUser) return [];
  const [{ data, error }, { data: watchedRows, error: watchedErr }, allCountRows] = await Promise.all([
    sb.from('episode_interactions')
      .select('watched_at, episodes(seasons(media(*)))')
      .eq('user_id', currentUser.id)
      .order('watched_at', { ascending: false, nullsFirst: false })
      .limit(80),
    // Une série marquée "vue" via le bouton ✓ de sa fiche (toggleWatched) au lieu
    // d'être cochée épisode par épisode doit être traitée comme terminée ici
    // aussi. Sans ça, elle restait bloquée dans "Reprendre" pour toujours, son
    // compteur d'épisodes vus (déduit uniquement de episode_interactions) ne
    // pouvant jamais atteindre le total.
    sb.from('interactions').select('media_id').eq('user_id', currentUser.id).eq('status', 'watched'),
    // Décompte COMPLET des épisodes vus par série : la requête ci-dessus est
    // limitée aux 80 dernières lignes (suffisant pour l'ordre de "Reprendre"),
    // mais y compter les épisodes tronquait le total dès qu'une série avait de
    // l'historique hors de cette fenêtre — elle ne pouvait alors jamais être
    // vue comme terminée.
    fetchAllRows(() => sb.from('episode_interactions')
      .select('episodes(seasons(media_id))')
      .eq('user_id', currentUser.id).order('id')),
  ]);
  if (error) throw new Error(error.message);
  if (watchedErr) throw new Error(watchedErr.message);
  const explicitlyWatched = new Set((watchedRows ?? []).map(r => r.media_id));
  const fullCountByMedia = new Map();
  for (const r of allCountRows) {
    const mid = r.episodes?.seasons?.media_id;
    if (mid) fullCountByMedia.set(mid, (fullCountByMedia.get(mid) ?? 0) + 1);
  }

  const mediaById = new Map();
  const orderedMediaIds = []; // ordre de dernière activité (le plus récent d'abord)
  for (const row of (data ?? [])) {
    const media = row.episodes?.seasons?.media;
    if (!media) continue;
    if (!mediaById.has(media.id)) { mediaById.set(media.id, media); orderedMediaIds.push(media.id); }
    // (le décompte réel vient de fullCountByMedia, pas de cette fenêtre limitée)
    // PAS de "break" ici : couper la boucle avant d'avoir fini de compter les
    // épisodes vus d'une série (même une déjà bien avancée dans la liste)
    // faussait son décompte et pouvait la faire passer à tort pour "en cours"
    // alors qu'elle est en réalité terminée — voir la limite appliquée plus
    // bas, une fois tous les compteurs complets.
  }
  const candidateIds = orderedMediaIds.slice(0, 20); // limite appliquée seulement APRÈS un comptage complet

  // Un appel TMDB par série candidate (mis en cache par getShowTotalEpisodes) :
  // paralléliser avec mapWithConcurrency (comme pour "À suivre" et la page Stats)
  // au lieu d'un await séquentiel — celui-ci enchaînait jusqu'à 20 allers-retours
  // TMDB l'un après l'autre et ralentissait nettement le chargement de l'accueil.
  const withTotals = await mapWithConcurrency(candidateIds, 6, async (mediaId) => {
    const media = mediaById.get(mediaId);
    const watched = fullCountByMedia.get(mediaId) ?? 0;
    if (explicitlyWatched.has(mediaId)) return { media, watched, total: null, isCompleted: true };
    const total = await getShowTotalEpisodes(media.tmdb_id);
    const isCompleted = total != null && total > 0 && watched >= total;
    return { media, watched, total, isCompleted };
  });

  return withTotals
    .filter(s => !s.isCompleted)
    .slice(0, 12)
    // _watchedCount/_totalEpisodes portés directement sur l'objet média pour que
    // la carte "Reprendre" de l'accueil puisse afficher la barre de progression
    // (façon Disney+), comme le fait déjà la page Stats pour "Séries en cours".
    .map(s => ({ ...s.media, _watchedCount: s.watched, _totalEpisodes: s.total }));
}

/** Marque tous les épisodes connus (déjà diffusés) d'une série comme vus dans

 * logique que importShowWatched, pour que "Marquer comme vu" sur la fiche
 * série ait le même effet que cocher chaque épisode un par un. */
async function markAllEpisodesWatched(media) {
  const raw = await tmdbFetch(`/tv/${media.tmdb_id}`);
  const seasonNumbers = (raw.seasons ?? []).map(s => s.season_number).filter(n => n > 0).sort((a, b) => a - b);
  const todayStr = localDateISO();
  const isAired = (ep) => !ep.air_date || ep.air_date <= todayStr;

  const allEpisodesBySeason = await mapWithConcurrency(seasonNumbers, 4,
    seasonNumber => getOrSyncSeason(media.id, media.tmdb_id, seasonNumber));
  const allEpisodes = allEpisodesBySeason.flat().filter(isAired);
  if (!allEpisodes.length) return;
  const rows = allEpisodes.map(ep => ({ user_id: currentUser.id, episode_id: ep.id }));
  const { error } = await sb.from('episode_interactions').upsert(rows, { onConflict: 'user_id,episode_id' });
  if (error) throw new Error(formatSbError(error));
}

  return lines.filter((line, i, arr) => !(line === '' && arr[i - 1] === '')).join('\n');

// ============================================================================
// SAISONS / ÉPISODES (Lazy-Sync)
// ============================================================================
/** Progression globale d'une série (toutes saisons confondues) : combine le
 * total d'épisodes TMDB (déjà chargé pour les onglets saison) avec le nombre
 * d'épisodes marqués vus en base — sans jamais refetcher tout l'historique de
 * l'utilisateur, juste les épisodes qui appartiennent à CETTE série. */
async function getShowWatchProgress(mediaId, tmdbId, seasons) {
  const totalEpisodes = seasons.reduce((sum, s) => sum + (s.episode_count ?? 0), 0);
  if (!currentUser || totalEpisodes === 0) return { watched: 0, total: totalEpisodes };
  // Synchronise TOUTES les saisons connues avant de compter : sans ça, une
  // saison jamais ouverte manuellement dans l'app n'existait pas encore dans
  // les tables locales `seasons`/`episodes`, et ses épisodes vus étaient
  // invisibles au calcul — ça faussait complètement le pourcentage affiché
  // (parfois jusqu'à un 100% incorrect si le total réel de saisons
  // "invisibles" compensait par coïncidence). getOrSyncSeason est gratuite
  // pour une saison déjà à jour (pas de re-fetch TMDB dans ce cas), donc ça
  // reste léger même pour une série avec beaucoup de saisons.
  await mapWithConcurrency(seasons, 4, s => getOrSyncSeason(mediaId, tmdbId, s.season_number).catch(() => null));

  const { data: seasonRows, error: e1 } = await sb.from('seasons').select('id').eq('media_id', mediaId);
  if (e1) throw new Error(formatSbError(e1));
  const seasonIds = (seasonRows ?? []).map(s => s.id);
  if (!seasonIds.length) return { watched: 0, total: totalEpisodes };
  const { data: epRows, error: e2 } = await sb.from('episodes').select('id').in('season_id', seasonIds);
  if (e2) throw new Error(formatSbError(e2));
  const episodeIds = (epRows ?? []).map(e => e.id);
  if (!episodeIds.length) return { watched: 0, total: totalEpisodes };
  const { data: watchedRows, error: e3 } = await sb.from('episode_interactions').select('episode_id')
    .eq('user_id', currentUser.id).in('episode_id', episodeIds);
  if (e3) throw new Error(formatSbError(e3));
  return { watched: (watchedRows ?? []).length, total: totalEpisodes };
}

async function getOrSyncSeason(mediaId, tmdbId, seasonNumber) {
  const { data: existingSeason, error: selErr } = await sb.from('seasons').select('id, synced_at')
    .eq('media_id', mediaId).eq('season_number', seasonNumber).maybeSingle();
  if (selErr) throw new Error(formatSbError(selErr));

  const isStale = !existingSeason || !existingSeason.synced_at ||
    (Date.now() - new Date(existingSeason.synced_at).getTime()) > 30 * 24 * 60 * 60 * 1000;

  let seasonId = existingSeason?.id;

  if (isStale) {
    const details = await tmdbFetch(`/tv/${tmdbId}/season/${seasonNumber}`);
    const syncedAt = new Date().toISOString();
    const { data: seasonRow, error: seasonErr } = await sb.from('seasons').upsert({
      media_id: mediaId, season_number: seasonNumber, name: details.name, overview: details.overview,
      poster_path: details.poster_path, episode_count: details.episodes.length, synced_at: syncedAt,
    }, { onConflict: 'media_id,season_number' }).select('id').single();
    if (seasonErr) throw new Error(formatSbError(seasonErr));
    seasonId = seasonRow.id;

    const episodeRows = details.episodes.map(ep => ({
      season_id: seasonId, episode_number: ep.episode_number, tmdb_episode_id: ep.id,
      title: ep.name, overview: ep.overview, air_date: ep.air_date || null,
      still_path: ep.still_path, runtime: ep.runtime, synced_at: syncedAt,
    }));
    if (episodeRows.length) {
      const { error: epErr } = await sb.from('episodes').upsert(episodeRows, { onConflict: 'season_id,episode_number' });
      if (epErr) throw new Error(formatSbError(epErr));
    }
  }

  const { data: episodes, error } = await sb.from('episodes').select('*').eq('season_id', seasonId).order('episode_number');
  if (error) throw new Error(formatSbError(error));
  return episodes;
}

// ----------------------------------------------------------------------------
// "À SUIVRE" (façon TV Time) — pour chaque série en cours, détermine le prochain
// épisode non vu, en synchronisant la saison à la demande seulement si besoin
// (jamais d'appel TMDB si l'épisode suivant est déjà connu localement).
//
// Note technique : on récupère TOUT l'historique d'épisodes vus en une requête
// (même forme que getContinueWatching, déjà éprouvée) puis on regroupe/compare
// côté JS, plutôt que de filtrer sur une colonne imbriquée (episodes.seasons.media_id)
// côté serveur — ce filtrage imbriqué n'a aucun précédent ailleurs dans ce projet
// et pourrait échouer silencieusement selon la version de PostgREST.
// ----------------------------------------------------------------------------
async function getLastWatchedEpisodeByShow() {
  const rows = await fetchAllRows(() => sb.from('episode_interactions')
    .select('episodes(episode_number, seasons(season_number, media_id))')
    .eq('user_id', currentUser.id).order('id'));
  const perShow = new Map(); // media_id -> { season, episode }
  for (const row of rows) {
    const season = row.episodes?.seasons?.season_number;
    const episode = row.episodes?.episode_number;
    const mediaId = row.episodes?.seasons?.media_id;
    if (season == null || episode == null || !mediaId) continue;
    const cur = perShow.get(mediaId);
    if (!cur || season > cur.season || (season === cur.season && episode > cur.episode)) {
      perShow.set(mediaId, { season, episode });
    }
  }
  return perShow;
}

async function resolveNextEpisode(media, lastSeason, lastEpisode) {
  const todayStr = localDateISO();
  const isAired = (ep) => !ep.air_date || ep.air_date <= todayStr; // même règle que le verrou 🔒 sur la fiche saison

  // 1) Cherche localement dans la saison en cours, sans forcer d'appel TMDB
  const { data: curSeasonRow } = await sb.from('seasons').select('id')
    .eq('media_id', media.id).eq('season_number', lastSeason).maybeSingle();
  if (curSeasonRow) {
    const { data: localNext } = await sb.from('episodes').select('*')
      .eq('season_id', curSeasonRow.id).eq('episode_number', lastEpisode + 1).maybeSingle();
    if (localNext && isAired(localNext)) return { ...localNext, season_number: lastSeason };
  }
  // 2) Pas trouvé localement : synchronise la saison en cours (débloque un épisode fraîchement sorti)
  try {
    const episodes = await getOrSyncSeason(media.id, media.tmdb_id, lastSeason);
    const found = episodes.find(e => e.episode_number === lastEpisode + 1);
    if (found && isAired(found)) return { ...found, season_number: lastSeason };
  } catch { /* saison en cours indisponible côté TMDB, on tente la suivante */ }
  // 3) Saison en cours terminée : tente la saison suivante (épisode 1)
  try {
    const episodes = await getOrSyncSeason(media.id, media.tmdb_id, lastSeason + 1);
    const found = episodes.find(e => e.episode_number === 1);
    if (found && isAired(found)) return { ...found, season_number: lastSeason + 1 };
  } catch { /* pas de saison suivante (pas encore annoncée/sortie) : la série est à jour */ }
  return null; // le prochain épisode existe peut-être déjà côté TMDB mais n'est pas encore diffusé : on n'en parle pas encore
}

async function getUpNextForShow(media) {
  const lastByShow = await getLastWatchedEpisodeByShow();
  const last = lastByShow.get(media.id);
  if (!last) return null;
  return resolveNextEpisode(media, last.season, last.episode);
}

/** Limité aux séries les plus récemment actives (même source que "Reprendre") pour éviter
 * de spammer TMDB — chaque série sans épisode suivant connu localement coûte 1-2 appels. */
async function getUpNextEpisodes() {
  if (!currentUser) return [];
  const shows = await getContinueWatching();
  if (!shows.length) return [];
  const lastByShow = await getLastWatchedEpisodeByShow();
  const candidates = shows.slice(0, 10).map(media => ({ media, last: lastByShow.get(media.id) })).filter(c => c.last);
  // Résolu en parallèle (4 à la fois) plutôt qu'un await séquentiel : jusqu'à 10 appels
  // TMDB l'un après l'autre pouvaient ajouter plusieurs secondes au chargement de l'accueil.
  const resolved = await mapWithConcurrency(candidates, 4, async ({ media, last }) => {
    try {
      const next = await resolveNextEpisode(media, last.season, last.episode);
      return next ? { media, next } : null;
    } catch { return null; /* série indisponible (TMDB down, série retirée...) : ignorée silencieusement */ }
  });
  return resolved.filter(Boolean);
}

async function toggleEpisodeWatched(episodeId) {

  // (par ex. double-clic rapide), on évite une erreur de contrainte unique silencieuse
  const { error } = await sb.from('episode_interactions').upsert({
    user_id: currentUser.id, episode_id: episodeId, watched_at: localDateISO(),
  }, { onConflict: 'user_id,episode_id' });

/** Incrémente le compteur de rewatch d'un épisode déjà vu (nécessite patch-episode-features.sql).
 * Miroir de incrementRewatch() pour les films/séries dans leur ensemble. */
async function incrementEpisodeRewatch(episodeId) {
  await ensureFreshSession();
  const { data: existing, error: selErr } = await sb.from('episode_interactions').select('id, rewatch_count')
    .eq('user_id', currentUser.id).eq('episode_id', episodeId).maybeSingle();
  if (selErr) throw new Error(formatSbError(selErr));

  const watchedAt = localDateISO();
  if (existing) {
    const next = (existing.rewatch_count ?? 0) + 1;
    const { error } = await sb.from('episode_interactions').update({ rewatch_count: next, watched_at: watchedAt }).eq('id', existing.id);
    if (error) throw new Error(formatSbError(error));
    return next;
  }
  const { error } = await sb.from('episode_interactions').insert({ user_id: currentUser.id, episode_id: episodeId, watched_at: watchedAt, rewatch_count: 1 });
  if (error) throw new Error(formatSbError(error));
  return 1;
}

// ============================================================================
// IMPORT UNIVERSEL (Letterboxd / TV Time)
// ============================================================================
const FIELD_ALIASES = {
  letterboxdUri: ['letterboxd uri'],
  name: ['name', 'film title', 'title'],
  year: ['year', 'release year'],
  rating: ['rating', 'your rating'],
  rewatch: ['rewatch'],
  watchedDate: ['watched date', 'date', 'diary date'],
  seriesTitle: ['series name', 'series title', 'show name', 'show title', 'tv show', 'tv show name'],
  seasonNumber: ['season number', 'season'],
  episodeNumber: ['episode number', 'episode'],
  episodeTitle: ['episode name', 'episode title'],
  episodeWatchedDate: ['episode watched date', 'watched at', 'date watched'],
  imdbId: ['imdb id', 'imdb_id'],
  episodesSeenCount: ['nb episodes seen', 'episodes seen', 'number of episodes seen'],
  isFollowed: ['is followed', 'followed'],
};
function normHeader(h) { return h.trim().toLowerCase().replace(/[\s_-]+/g, ' '); }
function buildHeaderIndex(headers) {
  const map = new Map(headers.map(h => [normHeader(h), h]));
  const idx = {};
  for (const [field, aliases] of Object.entries(FIELD_ALIASES)) {
    for (const alias of aliases) { if (map.has(alias)) { idx[field] = map.get(alias); break; } }
  }
  return idx;
}
/**
 * Détecte le format. Ajout Étape 2 : les exports TV Time "liste de séries"
 * (followed_tv_show.csv, user_tv_show_data.csv...) n'ont qu'une colonne
 * tv_show_name/series name, SANS numéro de saison/épisode — on les distingue
 * bien des exports "épisode par épisode" (format 'tvtime') qui ont ces numéros.
 */
function detectImportFormat(headers) {
  const idx = buildHeaderIndex(headers);
  if (idx.letterboxdUri) return 'letterboxd';
  if (idx.seriesTitle && (idx.seasonNumber || idx.episodeNumber)) return 'tvtime';
  if (idx.seriesTitle && !idx.seasonNumber && !idx.episodeNumber) return 'tvtime_shows';
  if (idx.name && idx.watchedDate && idx.imdbId && !idx.seasonNumber) return 'tvtime';
  if (idx.name && (idx.year || idx.rating)) return 'letterboxd';
  return 'unknown';
}
function normDate(raw) {
  if (!raw) return null;
  const t = raw.trim(); if (!t) return null;
  const iso = t.match(/^(\d{4}-\d{2}-\d{2})/); if (iso) return iso[1];
  const d = new Date(t); return isNaN(d.getTime()) ? null : localDateISO(d);
}
function mapLetterboxdRow(row, idx) {
  const title = idx.name ? row[idx.name]?.trim() : undefined;
  if (!title) return null;
  const ratingRaw = idx.rating ? row[idx.rating] : undefined;
  const rating = ratingRaw ? parseFloat(ratingRaw) : null;
  return {
    kind: 'movie', title, year: idx.year ? row[idx.year]?.trim() : undefined,
    watchedDate: normDate(idx.watchedDate ? row[idx.watchedDate] : undefined),
    rating: Number.isFinite(rating) ? rating : null,
    isRewatch: idx.rewatch ? row[idx.rewatch]?.trim().toLowerCase() === 'yes' : false,
  };
}
function mapTVTimeRow(row, idx) {
  if (idx.name && !idx.seasonNumber) {
    const title = row[idx.name]?.trim(); if (!title) return null;
    return { kind: 'movie', title, watchedDate: normDate(idx.watchedDate ? row[idx.watchedDate] : undefined), rating: null };
  }
  const seriesTitle = idx.seriesTitle ? row[idx.seriesTitle]?.trim() : undefined;
  const seasonNumber = parseInt(idx.seasonNumber ? row[idx.seasonNumber] : '', 10);
  const episodeNumber = parseInt(idx.episodeNumber ? row[idx.episodeNumber] : '', 10);
  if (!seriesTitle || isNaN(seasonNumber) || isNaN(episodeNumber)) return null;
  return {
    kind: 'episode', seriesTitle, seasonNumber, episodeNumber,
    episodeTitle: idx.episodeTitle ? (row[idx.episodeTitle]?.trim() || null) : null,
    watchedDate: normDate(idx.episodeWatchedDate ? row[idx.episodeWatchedDate] : undefined),
  };
}
/** Fichier récapitulatif "séries suivies" TV Time (ex : user_tv_show_data.csv) :
 * une ligne = une série entière, sans détail épisode par épisode — mais avec,
 * quand le fichier le fournit, un compteur `nb_episodes_seen` et un statut
 * `is_followed` qu'on exploite pour une progression fidèle (voir
 * importShowWatched) plutôt que de tout marquer "vu" en bloc. */
function mapTVTimeShowRow(row, idx) {
  const seriesTitle = idx.seriesTitle ? row[idx.seriesTitle]?.trim() : undefined;
  if (!seriesTitle) return null;
  const countRaw = idx.episodesSeenCount ? row[idx.episodesSeenCount] : undefined;
  const episodesSeenCount = countRaw !== undefined && countRaw !== '' ? parseInt(countRaw, 10) : null;
  const isFollowed = idx.isFollowed ? row[idx.isFollowed]?.trim() === '1' : undefined;
  return {
    kind: 'show_watched', seriesTitle,
    episodesSeenCount: Number.isFinite(episodesSeenCount) ? episodesSeenCount : null,
    isFollowed,
  };
}
/** Letterboxd (et TV Time) peuvent avoir plusieurs lignes pour le même film (rewatch).
 * On les fusionne en une seule entrée avec un compteur, plutôt que de perdre l'historique
 * en n'important que la dernière ligne (comportement précédent, silencieusement incorrect). */
function mergeMovieRewatches(records) {
  const merged = new Map(); // clé: titre+année normalisés -> record fusionné
  const others = [];
  for (const rec of records) {
    if (rec.kind !== 'movie') { others.push(rec); continue; }
    const key = (rec.title || '').trim().toLowerCase() + '|' + (rec.year || '');
    if (!merged.has(key)) {
      merged.set(key, { ...rec, rewatchCount: 0 });
      continue;
    }
    const existing = merged.get(key);
    existing.rewatchCount++;
    if (rec.isRewatch) existing.isRewatch = true;
    // On garde la date la plus récente (et la note associée à cette date-là)
    if (!existing.watchedDate || (rec.watchedDate && rec.watchedDate > existing.watchedDate)) {
      existing.watchedDate = rec.watchedDate ?? existing.watchedDate;
      if (rec.rating != null) existing.rating = rec.rating;
    }
  }
  return [...others, ...merged.values()];
}
function parseImportFile(fileContent, formatHint) {
  const { data, meta } = Papa.parse(fileContent, { header: true, skipEmptyLines: true });
  const headers = meta.fields ?? [];
  const format = formatHint && formatHint !== 'auto' ? formatHint : detectImportFormat(headers);
  const idx = buildHeaderIndex(headers);
  if (format === 'unknown') return { format, records: [], skipped: data.length };
  const records = []; let skipped = 0;
  for (const row of data) {
    let rec;
    if (format === 'letterboxd') rec = mapLetterboxdRow(row, idx);
    else if (format === 'tvtime') rec = mapTVTimeRow(row, idx);
    else if (format === 'tvtime_shows') rec = mapTVTimeShowRow(row, idx);
    if (rec) records.push(rec); else skipped++;
  }
  return { format, records: mergeMovieRewatches(records), skipped };
}

/** Marque une série comme suivie/vue à partir d'un import "récapitulatif"
 * (une ligne = une série entière). Comportement piloté par `episodesSeenCount` :
 *
 *  1. > 0 : marque les N premiers épisodes (ordre saisons/épisodes croissant,
 *     spéciaux exclus) comme vus dans `episode_interactions` — PAS tous les
 *     épisodes — pour une progression fidèle à ce qui a été réellement
 *     regardé. Statut global déduit : "watched" si N couvre tous les
 *     épisodes connus, sinon "watching".
 *  2. absent, vide ou = 0 (fichier sans compteur exploitable — ex : une simple
 *     liste de séries suivies pour les notifications, sans historique de
 *     visionnage) : AUCUN épisode n'est marqué vu. La série est ajoutée en
 *     "watchlist" (sauf si `isFollowed === false`, auquel cas ignorée). On ne
 *     marque jamais une série comme vue sans preuve réelle de visionnage.
 *
 * Important : `episode_interactions` est la table utilisée PARTOUT ailleurs
 * dans l'app (Mes listes, Hub Franchises, progression) pour savoir ce qui a
 * été vu — un simple `interactions.status='watched'` sans ces lignes reste
 * invisible dans l'interface, d'où cette synchronisation systématique. */
async function importShowWatched(mediaId, tmdbId, opts = {}) {
  await ensureFreshSession();
  const { episodesSeenCount = null, isFollowed } = opts;

  if (!episodesSeenCount) { // null, 0, ou colonne absente du fichier : aucune preuve de visionnage
    if (isFollowed === false) return 'skipped';
    const { error } = await sb.from('interactions').upsert(
      { user_id: currentUser.id, media_id: mediaId, status: 'watchlist' },
      { onConflict: 'user_id,media_id' }
    );
    if (error) throw new Error(formatSbError(error));
    return 'watchlist';
  }

  const raw = await tmdbFetch(`/tv/${tmdbId}`);
  const seasonNumbers = (raw.seasons ?? []).map(s => s.season_number).filter(n => n > 0).sort((a, b) => a - b);

  // mapWithConcurrency préserve l'ordre des saisons malgré la parallélisation
  // (résultats indexés par position d'origine) — important ici car l'ordre
  // saison/épisode croissant détermine quels épisodes sont considérés "vus".
  const episodesBySeason = await mapWithConcurrency(seasonNumbers, 4,
    seasonNumber => getOrSyncSeason(mediaId, tmdbId, seasonNumber)); // déjà triés par episode_number
  const allEpisodes = episodesBySeason.flat();
  const totalEpisodes = allEpisodes.length;
  const watchedCount = Math.min(episodesSeenCount, totalEpisodes);
  const episodesToMark = allEpisodes.slice(0, watchedCount);

  if (episodesToMark.length) {
    const rows = episodesToMark.map(ep => ({ user_id: currentUser.id, episode_id: ep.id }));
    const { error: eiErr } = await sb.from('episode_interactions').upsert(rows, { onConflict: 'user_id,episode_id' });
    if (eiErr) throw new Error(formatSbError(eiErr));
  }

  const status = (totalEpisodes > 0 && watchedCount >= totalEpisodes) ? 'watched' : 'watching';
  const { error } = await sb.from('interactions').upsert(
    { user_id: currentUser.id, media_id: mediaId, status },
    { onConflict: 'user_id,media_id' }
  );
  if (error) throw new Error(formatSbError(error));
  return status;
}

/** Exporte toutes les interactions de l'utilisateur (films + séries) en CSV téléchargeable. */
async function exportUserData() {
  await ensureFreshSession();
  const baseSelect = 'status, rating, review, rewatch_count, watched_at, media(title, media_type, tmdb_id, release_date)';
  const detailedSelect = 'status, rating, review, rewatch_count, watched_at, rating_story, rating_pacing, rating_acting, rating_directing, media(title, media_type, tmdb_id, release_date)';

  let data, error;
  if (detailedRatingColumnsAvailable) {
    ({ data, error } = await sb.from('interactions').select(detailedSelect).eq('user_id', currentUser.id));
    if (error && /column .* does not exist/i.test(error.message)) {
      detailedRatingColumnsAvailable = false;
      ({ data, error } = await sb.from('interactions').select(baseSelect).eq('user_id', currentUser.id));
    }
  } else {
    ({ data, error } = await sb.from('interactions').select(baseSelect).eq('user_id', currentUser.id));
  }
  if (error) throw new Error(formatSbError(error));

  const rows = (data ?? []).map(r => ({
    titre: r.media?.title ?? '',
    type: r.media?.media_type === 'movie' ? 'film' : 'série',
    annee: r.media?.release_date ? r.media.release_date.slice(0, 4) : '',
    tmdb_id: r.media?.tmdb_id ?? '',
    statut: r.status,
    note: r.rating ?? '',
    note_scenario: r.rating_story ?? '',
    note_rythme: r.rating_pacing ?? '',
    note_acteurs: r.rating_acting ?? '',
    note_mise_en_scene: r.rating_directing ?? '',
    avis: r.review ?? '',
    fois_revu: r.rewatch_count ?? 0,
    date_visionnage: r.watched_at ?? '',
  }));

  const csv = Papa.unparse(rows);
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }); // \uFEFF = BOM, pour qu'Excel affiche bien les accents
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `matthiastrack-export-${localDateISO()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  localStorage.setItem('streamtrack_last_backup', localDateISO()); // préférence UI locale, pas une clé API
  return rows.length;

/**
 * Sauvegarde JSON des tables liées au compte courant. Chaque requête personnelle
 * est filtrée par l'identifiant issu de la session Supabase ; aucune clé secrète
 * ni jeton de session n'est exporté. Les relations d'œuvres/épisodes sont jointes
 * pour que l'archive soit compréhensible sans se limiter à un CSV aplati.
 */
async function exportUserBackupJson() {
  if (!currentUser) throw new Error('Connecte-toi pour créer une sauvegarde.');
  await ensureFreshSession();

  const [interactions, episodeInteractions, customLists, profileResult] = await Promise.all([
    fetchAllRows(() => sb.from('interactions').select('*, media(*)')
      .eq('user_id', currentUser.id).order('id', { ascending: true })),
    fetchAllRows(() => sb.from('episode_interactions')
      .select('*, episodes(*, seasons(*, media(*)))')
      .eq('user_id', currentUser.id).order('id', { ascending: true })),
    fetchAllRows(() => sb.from('custom_lists').select('*')
      .eq('user_id', currentUser.id).order('sort_order', { ascending: true }).order('id', { ascending: true })),
    sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle(),
  ]);
  if (profileResult.error) throw new Error(formatSbError(profileResult.error));

  const listIds = customLists.map(list => list.id);
  const customListItems = listIds.length
    ? await fetchAllRows(() => sb.from('custom_list_items')
        .select('list_id, media_id, position, media(*)')
        .in('list_id', listIds).order('list_id').order('position'))
    : [];

  // Cette table dépend d'une migration facultative. Son indisponibilité ne doit
  // pas empêcher d'exporter tout le reste : l'archive l'indique explicitement.
  let notificationPreferences = null;
  let optionalWarnings = [];
  try {
    const { data, error } = await sb.from('notification_preferences')
      .select('*').eq('user_id', currentUser.id).maybeSingle();
    if (error) optionalWarnings.push('Préférences de résumé mail non exportées : ' + formatSbError(error));
    else notificationPreferences = data;
  } catch (err) {
    optionalWarnings.push('Préférences de résumé mail non exportées : ' + (err?.message || 'table indisponible'));
  }

  const localPreferenceKeys = [
    'streamtrack_amoled', 'streamtrack_accent', 'streamtrack_font',
    'streamtrack_notif_enabled', 'streamtrack_last_backup', 'matthiastack_discovery_prefs', 'streamtrack_provider_region',
  ];
  const localPreferences = {};
  for (const key of localPreferenceKeys) {
    const value = localStorage.getItem(key);
    if (value !== null) localPreferences[key] = value;
  }

  const backup = {
    format: 'MatthiasTrack JSON Backup',
    schema_version: 1,
    app_version: APP_VERSION,
    exported_at: new Date().toISOString(),
    account: { user_id: currentUser.id, email: currentUser.email ?? null },
    data: {
      interactions,
      episode_interactions: episodeInteractions,
      custom_lists: customLists,
      custom_list_items: customListItems,
      profile: profileResult.data ?? null,
      notification_preferences: notificationPreferences,
      local_preferences: localPreferences,
    },
    counts: {
      interactions: interactions.length,
      episode_interactions: episodeInteractions.length,
      custom_lists: customLists.length,
      custom_list_items: customListItems.length,
    },
    warnings: optionalWarnings,
  };

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `matthiastrack-sauvegarde-${localDateISO()}.json`;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  localStorage.setItem('streamtrack_last_backup', localDateISO());
  return backup;
}

/** Rappel de sauvegarde : purement local (aucune donnée envoyée nulle part).
 * Retourne le nombre de jours depuis le dernier export CSV/JSON, ou null si
 * aucun export n'a jamais été fait sur ce navigateur. */
function daysSinceLastBackup() {
  const last = localStorage.getItem('streamtrack_last_backup');
  if (!last) return null;
  const diffMs = Date.now() - new Date(last + 'T00:00:00').getTime();
  return Math.floor(diffMs / (24 * 60 * 60 * 1000));
}

// Navigation basse intelligente : observation ciblée des modales (pas de MutationObserver
// sur tous les attributs de la page), et navigation jamais masquée si elle porte le focus.
(() => {
  if (window.__mtNavScrollBound) return;
  window.__mtNavScrollBound = true;
  let lastY = Math.max(0, window.scrollY || 0), downTravel = 0, upTravel = 0;
  const overlays = new Set();
  const modalOpen = () => [...overlays].some(el => el.isConnected && getComputedStyle(el).display !== 'none');
  const trackOverlay = el => {
    if (!(el instanceof Element) || !el.matches('.trailer-overlay') || overlays.has(el)) return;
    overlays.add(el);
    navModalObserver.observe(el, { attributes:true, attributeFilter:['style','class','aria-hidden'] });
  };
  const showNav = () => {
    document.body.classList.remove('nav-hidden');
    const nav = document.querySelector('.bottom-nav');
    if (nav) { nav.removeAttribute('aria-hidden'); nav.inert = false; }
    downTravel = 0;
  };
  const hideNav = nav => {
    if (nav?.contains(document.activeElement)) { showNav(); return; }
    document.body.classList.add('nav-hidden');
    if (nav) { nav.setAttribute('aria-hidden','true'); nav.inert = true; }
  };
  const navModalObserver = new MutationObserver(() => { if (modalOpen()) showNav(); });
  document.querySelectorAll('.trailer-overlay').forEach(trackOverlay);
  const addedOverlayObserver = new MutationObserver(records => {
    for (const record of records) for (const node of record.addedNodes || []) {
      if (!(node instanceof Element)) continue;
      trackOverlay(node);
      node.querySelectorAll?.('.trailer-overlay').forEach(trackOverlay);
    }
    if (modalOpen()) showNav();
  });
  addedOverlayObserver.observe(document.body, { childList:true });
  const onScroll = () => {
    const y = Math.max(0, window.scrollY || 0), delta = y - lastY;
    const nav = document.querySelector('.bottom-nav');
    if (!nav) { lastY = y; return; }
    if (y < 90 || modalOpen() || document.activeElement?.matches('input,textarea,select,[contenteditable="true"]') || nav.contains(document.activeElement)) {
      showNav(); upTravel = 0; lastY = y; return;
    }
    if (delta > 0) { downTravel += delta; upTravel = 0; }
    else if (delta < 0) { upTravel += -delta; downTravel = 0; }
    if (downTravel > 22 && y > 145) hideNav(nav);
    if (upTravel > 10) showNav();
    lastY = y;
  };
  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('hashchange', () => {
    showNav(); lastY = Math.max(0, window.scrollY || 0); upTravel = 0;
  });
  document.addEventListener('focusin', e => {
    if (e.target?.matches('input,textarea,select,[contenteditable="true"]') || e.target?.closest('.bottom-nav')) showNav();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastY = Math.max(0,window.scrollY||0); showNav(); } });
  window.addEventListener('pageshow', showNav);
})();

// Une affiche TMDB indisponible ne doit jamais laisser une icône d'image cassée.
// Le remplacement garde les classes de l'image, donc ses dimensions et son arrondi.
window.addEventListener('error', (event) => {
  const img = event.target;
  if (!(img instanceof HTMLImageElement) || img.dataset.fallbackApplied === '1') return;
  img.dataset.fallbackApplied = '1';
  const fallback = document.createElement('div');
  fallback.className = `${img.className || ''} image-fallback`.trim();
  fallback.setAttribute('role', 'img');
  const label = (img.alt || '').trim();
  fallback.setAttribute('aria-label', label ? `Image indisponible : ${label}` : 'Image indisponible');
  const title = document.createElement('span');
  title.textContent = label.replace(/^(Affiche de|Portrait de)\s+/i, '').slice(0, 56);
  fallback.appendChild(title);
  if (img.getAttribute('style')) fallback.setAttribute('style', img.getAttribute('style'));
  if (img.width) fallback.style.width = img.style.width || `${img.width}px`;
  if (img.height) fallback.style.height = img.style.height || `${img.height}px`;
  img.replaceWith(fallback);
}, true);

  const existing = document.getElementById('shortcuts-help-overlay');

// Navigation tactile de la story : un balayage horizontal passe à la page
// suivante/précédente sans gêner le défilement vertical de la modale.
const wrappedModalForSwipe = document.getElementById('wrapped-modal');
if (wrappedModalForSwipe) {
  let wrappedTouchStart = null;
  wrappedModalForSwipe.addEventListener('touchstart', event => {
    if (!event.target.closest('.wrapped-story') || !event.changedTouches?.length) return;
    const touch = event.changedTouches[0];
    wrappedTouchStart = { x: touch.clientX, y: touch.clientY };
  }, { passive: true });
  wrappedModalForSwipe.addEventListener('touchend', event => {
    if (!wrappedTouchStart || !event.changedTouches?.length) return;
    const touch = event.changedTouches[0];
    const dx = touch.clientX - wrappedTouchStart.x;
    const dy = touch.clientY - wrappedTouchStart.y;
    wrappedTouchStart = null;
    if (Math.abs(dx) > 54 && Math.abs(dx) > Math.abs(dy) * 1.25) window.app?.moveWrappedSlide(dx < 0 ? 1 : -1);
  }, { passive: true });
}

window.addEventListener('keydown', (e) => {
  if (isTypingInField()) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  if (e.key === 'Escape') {
    if (anyModalOpen()) { closeAnyOpenModal(); return; }
    const helpOverlay = document.getElementById('shortcuts-help-overlay');
    if (helpOverlay) { helpOverlay.remove(); return; }
  }

  if (isModalVisible('wrapped-modal')) {
    if (e.key === 'ArrowRight') { e.preventDefault(); window.app?.moveWrappedSlide(1); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); window.app?.moveWrappedSlide(-1); return; }
  }
  if (anyModalOpen()) return; // pas de navigation pendant qu'une modale est ouverte

  if (e.key === '?') { e.preventDefault(); showKeyboardShortcutsHelp(); return; }
  if (e.key === '/') { e.preventDefault(); navigate('#/search'); return; }

  if (shortcutPendingG) {
    shortcutPendingG = false;
    clearTimeout(shortcutPendingTimer);
    if (e.key === 'h') navigate('#/');
    else if (e.key === 'l') navigate(currentUser ? '#/lists' : '#/login');
    else if (e.key === 'd') navigate(currentUser ? '#/discover' : '#/login');
    else if (e.key === 's') navigate('#/search');
    else if (e.key === 'p') navigate(currentUser ? '#/profile' : '#/login');
    return;
  }
  if (e.key === 'g') {
    shortcutPendingG = true;
    shortcutPendingTimer = setTimeout(() => { shortcutPendingG = false; }, 800); // laisse ~800ms pour taper la 2e touche
  }
});

/**

  if (hash === '#/profile') return renderProfilePage();
  if (hash === '#/calendar') return renderCalendar();
  if (hash.startsWith('#/media/')) {
    const [, , type, tmdbId] = hash.split('/');
    return renderMediaDetail(type, parseInt(tmdbId, 10));

  if (hash.startsWith('#/collection/')) {
    const [, , collectionId] = hash.split('/');
    return renderCollectionPage(parseInt(collectionId, 10));

  if (hash.startsWith('#/person/')) {

  if (hash.startsWith('#/keyword/')) {

    return renderKeywordPage(parseInt(keywordId, 10), mediaTypeHint || 'movie', nameEncoded ? decodeURIComponent(nameEncoded) : '');

/** Traite un tableau avec un nombre limité d'appels en parallèle, pour ne pas saturer TMDB */
async function mapWithConcurrency(items, limit, fn) {
  const results = new Array(items.length);
  let index = 0;
  async function worker() {
    while (index < items.length) {
      const current = index++;
      results[current] = await fn(items[current]);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

async function fetchHomeData() {
  const [trendingMovies, trendingTV] = await Promise.all([getTrending('movie'), getTrending('tv')]);
  const heroRaw = trendingMovies[0];
  const hero = heroRaw ? await getMediaDetails(heroRaw.tmdb_id, 'movie') : null;

  const movieRows = await mapWithConcurrency(trendingMovies.slice(1, 13), 4, m => getMediaDetails(m.tmdb_id, 'movie'));
  const tvRows = await mapWithConcurrency(trendingTV.slice(0, 12), 4, m => getMediaDetails(m.tmdb_id, 'tv'));

  const interactionsMap = await getUserInteractionsMap();
  const continueWatching = await getContinueWatching();
  const upNext = await getUpNextEpisodes().catch(() => []); // jamais bloquant : best-effort
  const flashback = await getFlashbackItems().catch(() => []); // jamais bloquant si ça échoue

  const discoverDefs = [
    { title: 'Au cinéma en ce moment', type: 'movie', fn: () => getMovieCategory('now_playing') },
    { title: 'Bientôt au cinéma', type: 'movie', fn: () => getMovieCategory('upcoming') },
    { title: 'Films les mieux notés', type: 'movie', fn: () => getMovieCategory('top_rated') },
    { title: 'Séries les mieux notées', type: 'tv', fn: () => getTVCategory('top_rated') },
    { title: 'Séries en diffusion actuellement', type: 'tv', fn: () => getTVCategory('on_the_air') },
  ];
  // Les 5 catégories sont indépendantes : on les lance en parallèle (au lieu d'un
  // await séquentiel un par un) pour ne pas cumuler leurs temps de réponse.
  const discoverSettled = await Promise.allSettled(discoverDefs.map(async def => ({
    title: def.title, type: def.type, items: (await def.fn()).slice(0, 12),
  })));
  const discoverCategories = discoverSettled
    .filter(r => r.status === 'fulfilled') // une catégorie qui échoue ne doit pas casser les autres
    .map(r => r.value);

  // Anti-Watchlist : exclusion instantanée et dynamique de TOUTES les rangées de l'accueil
  const blacklist = await getBlacklistedTmdbKeys().catch(() => new Set());
  const notBanned = (m) => m && !blacklist.has(`${m.media_type}-${m.tmdb_id}`);
  const filterList = (arr) => arr.filter(notBanned);

  const filteredMovieRows = filterList(movieRows);
  const filteredTvRows = filterList(tvRows);
  const filteredContinueWatching = filterList(continueWatching);
  const filteredUpNext = upNext.filter(u => notBanned(u.media));
  const filteredDiscover = discoverCategories.map(cat => ({ ...cat, items: filterList(cat.items) }));
  const filteredFlashback = flashback.filter(f => notBanned(f.media));
  let effectiveHeroSource = hero;
  if (!notBanned(hero)) effectiveHeroSource = filteredMovieRows[0] ?? null;

  return {
    hero: effectiveHeroSource, movieRows: filteredMovieRows, tvRows: filteredTvRows,
    interactionsMap, continueWatching: filteredContinueWatching, upNext: filteredUpNext,
    discoverCategories: filteredDiscover, flashback: filteredFlashback,
  };
}

/** Accueil en Stale-While-Revalidate : le cache (s'il existe) s'affiche instantanément,
 * pendant qu'un fetch frais tourne en arrière-plan et remplace le contenu sans loader
 * bloquant dès qu'il est prêt (sauf si l'utilisateur a déjà changé de page entre-temps). */
async function renderHome() {
  const cacheKey = 'home_data_v2';
  const cached = localCache.get(cacheKey);

  if (cached) { lastHomeData = cached; renderHomeContent(cached); }
  else if (!isOnline) {
    const stale = localCache.getStale(cacheKey); // mieux vaut de vieilles données que rien du tout hors-ligne
    if (stale) { lastHomeData = stale; renderHomeContent(stale); }
    else renderHomeSkeleton();
  }
  else { renderHomeSkeleton(); }

  loadStreakCache(); // ne fait rien si déjà chargé cette session ; met à jour le badge en tâche de fond
  checkReleaseReminders(); // ne fait rien si désactivé dans les réglages ou déjà vérifié aujourd'hui

  try {
    const fresh = await fetchHomeData();
    localCache.set(cacheKey, fresh);
    if ((location.hash || '#/') === '#/') { lastHomeData = fresh; renderHomeContent(fresh); }
  } catch (err) {
    if (!cached) {
      const stale = localCache.getStale(cacheKey);
      if (stale) { lastHomeData = stale; renderHomeContent(stale); }
      else root.innerHTML = chrome() + `<div class="container page"><p class="error-text">Erreur : ${escapeHtml(err.message)}</p></div>`;
    } else {
      showErrorToast("Impossible de rafraîchir l'accueil : " + err.message);
    }
  }
}

let searchDebounce = null;
let searchRequestId = 0;
let lastSearchResults = { media: [], people: [] }; // pour filtrer localement (genre/année) sans refaire de requête
let lastExecutedSearchQuery = '';

function searchEmptyStateHtml(title, detail, icon = '⌕') {
