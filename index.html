<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MatthiasTrack — ton univers cinéma</title>

<!-- Rend l'app installable sur téléphone (icône sur l'écran d'accueil, plein écran sans barre de navigateur) -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-apple-touch.png" />
<meta name="theme-color" content="#090d16" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MatthiasTrack" />

<!-- defer : ne bloque plus le premier affichage ; exécutés avant le module principal (ordre garanti). -->
<script defer src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js" integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #090d16;
    --card: #10151f;
    --border: rgba(0,242,254,0.12);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --blue: #00f2fe;      /* Cyan Électrique — variable gardée "blue" pour ne pas casser tout le fichier */
    --green: #10b981;
    --amber: #f59e0b;
    --red: #f87171;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  body.amoled-mode { --bg: #000000; --card: #000000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-family);
    padding-bottom: calc(84px + var(--safe-bottom)); /* place pour la bottom nav fixe + zone home-indicator iPhone */ }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input { font-family: inherit; }
  img { display: block; }

  /* Transition douce à chaque changement de page : les nouveaux enfants de #root
     jouent automatiquement cette animation dès leur insertion dans le DOM. */
  #root > * { animation: pageEnter .12s ease; }
  @keyframes pageEnter { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:translateY(0);} }

  /* ---- Top bar slim (branding + AMOLED + réglages + auth) ---- */
  .topbar { position: fixed; top:0; left:0; right:0; z-index: 50; display:flex; align-items:center;
    justify-content: space-between; gap: 12px; padding: calc(12px + var(--safe-top)) 18px 12px; min-height: 56px;
    background: linear-gradient(180deg, var(--bg) 0%, rgba(9,13,22,0.75) 70%, transparent 100%); }
  .logo { font-weight: 800; font-size: 17px; }
  .logo span { color: var(--blue); }
  .offline-banner { position:fixed; top: calc(56px + var(--safe-top)); left:0; right:0; z-index:49;
    display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; padding:7px 16px;
    background: rgba(245,158,11,.15); border-bottom:1px solid rgba(245,158,11,.35); color:#f59e0b; }
  body.is-offline .page { padding-top: calc(104px + var(--safe-top)); }
  .topbar .right { display:flex; align-items:center; gap: 8px; }
  .icon-btn { width:34px; height:34px; border-radius:50%; background: rgba(255,255,255,0.06);
    color: var(--muted); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .icon-btn:hover { background: rgba(255,255,255,0.12); }
  .icon-btn.amoled-active { color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
  .streak-badge { display:flex; align-items:center; padding:5px 10px; border-radius:999px; font-size:13px; font-weight:700;
    background: rgba(255,159,10,.12); border:1px solid rgba(255,159,10,.4); color:#ffb84d; flex-shrink:0; }
  .pill-btn { border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
  .pill-btn.primary { background: white; color: var(--bg); }
  .pill-btn.ghost { background: rgba(255,255,255,0.06); color: var(--text); }

  .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
  .page { padding-top: calc(72px + var(--safe-top)); padding-bottom: 24px; }

  .hero { position: relative; height: 60vh; min-height: 380px; width: 100%; overflow: hidden; }
  .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hero .overlay { position:absolute; inset:0;
    background: linear-gradient(0deg, var(--bg) 5%, rgba(2,6,23,0.5) 55%, rgba(2,6,23,0.1) 100%); }
  .hero .content { position:absolute; left:0; right:0; bottom:0; padding: 32px 24px; max-width: 900px; margin: 0 auto; }
  .hero h1 { font-size: 40px; margin: 0 0 8px; max-width: 600px; }
  .hero p { color: var(--muted); max-width: 480px; font-size: 15px; margin: 0 0 16px; }
  .hero .actions { display:flex; gap: 12px; flex-wrap: wrap; }

  .btn { display:inline-flex; align-items:center; gap:8px; padding: 11px 20px; border-radius: 6px;
    font-size: 14px; font-weight: 600; transition: transform .15s; }
  .btn:hover { transform: scale(1.05); }
  .btn.white { background: white; color: var(--bg); }
  .btn.glass { background: rgba(255,255,255,0.15); color: white; backdrop-filter: blur(6px); }
  .btn.outline { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; }
  .btn.outline.active { background: var(--green); border-color: var(--green); }
  .btn.blue { background: var(--blue); color: white; }
  .btn:disabled { opacity: .5; cursor: default; transform:none; }

  .row { margin: 0 0 32px; }
  .row h2 { padding: 0 24px; font-size: 17px; margin: 0 0 10px; }
  .row-scroll { display:flex; gap: 10px; overflow-x: auto; padding: 0 24px 8px; scrollbar-width: none;
    scroll-snap-type: x proximity; scroll-padding-left: 24px; }
  .row-scroll::-webkit-scrollbar { display:none; }
  .row-scroll > .card { scroll-snap-align: start; }
  a.card:focus-visible, .btn:focus-visible, .mini-btn:focus-visible, .ban-btn:focus-visible,
  button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .card { flex-shrink:0; width: 160px; position:relative; }
  .card .poster { position:relative; aspect-ratio: 2/3; width:100%; border-radius:10px; overflow:hidden;
    background: var(--card); transition: transform .25s, box-shadow .25s; }
  .card:hover .poster { transform: scale(1.08); z-index:5;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,.7), 0 0 30px -5px rgba(96,165,250,.25); }
  .card .poster img { width:100%; height:100%; object-fit:cover; }
  .up-next-card .poster { outline: 2px solid rgba(0,242,254,.5); outline-offset: -2px; }
  .card .title { margin-top: 6px; font-size: 13px; color: #e2e8f0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .badge { position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%;
    background: var(--green); color:white; display:flex; align-items:center; justify-content:center; font-size:11px; }
  .card .card-next-ep { position:absolute; left:0; right:0; bottom:0; padding:4px 6px; font-size:10px; font-weight:700;
    color:#00f2fe; background:linear-gradient(to top, rgba(0,0,0,.85), transparent); text-align:center; }
  .card .overlay-actions { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center;
    padding-bottom: 10px; gap:8px; opacity:0; transition: opacity .2s;
    background: linear-gradient(0deg, rgba(0,0,0,.8), rgba(0,0,0,0) 60%); }
  .card:hover .overlay-actions { opacity:1; }
  @media (hover: none) { .overlay-actions { opacity:1; background: linear-gradient(0deg, rgba(0,0,0,.75), rgba(0,0,0,0) 65%); } }
  .mini-btn { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; }
  .mini-btn.white { background:white; color:var(--bg); }
  .mini-btn.outline { background:transparent; border:1px solid rgba(255,255,255,.6); color:white; }

  .form-card { max-width: 380px; margin: 0 auto; padding-top: calc(76px + var(--safe-top)); }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
  .field input { width:100%; padding: 10px 12px; border-radius:6px; border:1px solid var(--border);
    background: rgba(255,255,255,.05); color: var(--text); outline:none; font-size:14px; }
  .field input:focus { border-color: var(--blue); }
  .field .help { font-size:11px; color:#64748b; margin-top:4px; }
  .error-text { color: var(--red); font-size: 13px; margin: 8px 0; }
  .success-text { color: var(--green); font-size: 13px; margin: 8px 0; }
  .panel { border:1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h3 { margin: 0 0 6px; font-size: 14px; }
  .panel a.ext { color: var(--blue); font-size: 13px; }
  .profile-link { display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding: 16px; font-size: 14px; color: var(--text); background: transparent;
    border-bottom: 1px solid var(--border); }
  .profile-link:last-child { border-bottom: none; }
  .profile-link:hover { background: rgba(255,255,255,0.04); }

  .search-page-wrap { display:flex; flex-direction:column; min-height:60vh; }
  .search-box { position:relative; margin-top:14vh; } /* descendue dans la zone naturelle du pouce sur mobile */
  .search-box input { width:100%; padding: 18px 20px 18px 52px; border-radius:14px; border:1px solid var(--border);
    background: #111726; color: var(--text); font-size:16px; outline:none; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .search-box input:focus { border-color: var(--blue); box-shadow: 0 8px 24px rgba(0,242,254,.15); }
  .search-box input::placeholder { color: #64748b; }
  .search-icon { position:absolute; left:18px; top:50%; transform: translateY(-50%); color: var(--blue); font-size:20px; }
  .search-filters { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .search-filters select { padding:8px 12px; border-radius:8px; border:1px solid var(--border);
    background: #111726; color: var(--text); font-size:13px; }
  .search-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; margin-top: 24px; }

  @media (max-width: 640px) {
    .search-box { margin-top: 12vh; }
  }

  .detail-hero { position:relative; height: 40vh; min-height: 260px; width:100%; overflow:hidden; }
  .detail-hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .detail-hero .overlay { position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(2,6,23,.3) 0%, rgba(2,6,23,.9) 75%, var(--bg) 100%); }
  .detail-body { max-width: 800px; margin: -90px auto 0; padding: 0 24px 60px; position:relative; }
  .detail-flex { display:flex; gap: 24px; flex-wrap: wrap; }
  .detail-poster { width: 160px; flex-shrink:0; border-radius:10px; overflow:hidden; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .detail-poster img { width:100%; display:block; }
  .detail-info { flex:1; min-width: 240px; }
  .detail-info h1 { margin: 0 0 6px; font-size: 26px; }
  .meta-line { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .cert-badge { display:inline-block; border:1px solid var(--muted); border-radius:4px; padding:0 5px; font-size:11px; font-weight:700; color:var(--text); }
  .external-links { display:flex; gap:14px; margin-bottom:10px; }
  .external-links a { font-size:12px; color:var(--blue); }
  .genres { display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 14px; }
  .genre-chip { background: rgba(255,255,255,.06); padding: 4px 10px; border-radius: 999px; font-size:12px; color:#cbd5e1; }
  .watch-providers { display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .watch-providers-label { font-size:12px; color:var(--muted); }
  .provider-logo { width:32px; height:32px; border-radius:8px; flex-shrink:0; }
  .watch-providers-more { font-size:12px; color:var(--blue); }
  .production-panel { padding:14px; }
  .production-stats-grid { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:12px; }
  .production-stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .production-stat-value { font-size:16px; font-weight:700; color:var(--text); margin-top:2px; }
  .production-studios { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .studio-logo { height:28px; max-width:90px; object-fit:contain; filter: brightness(0) invert(1); opacity:.75; }
  .studio-name-chip { font-size:12px; color:var(--muted); background:rgba(255,255,255,.05); padding:4px 10px; border-radius:999px; }
  .franchise-cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:14px; }
  .franchise-card { display:flex; flex-direction:column; align-items:center; gap:6px; padding:24px 12px;
    background: var(--card); border:1px solid var(--border); border-radius:14px; text-align:center; }
  .franchise-card-emoji { font-size:36px; }
  .franchise-card-label { font-size:14px; font-weight:700; color:var(--text); }
  .franchise-card-count { font-size:12px; color:var(--muted); }
  .franchise-films-list { display:flex; flex-direction:column; gap:8px; }
  .franchise-film-row { display:flex; align-items:center; gap:12px; background: rgba(255,255,255,.03);
    border-radius:8px; padding:8px 12px; }
  .franchise-film-row.watched { background: rgba(16,185,129,.07); }
  .franchise-film-num { width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.08); color:var(--muted);
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .franchise-film-poster { width:40px; height:58px; border-radius:5px; overflow:hidden; background:var(--card); flex-shrink:0; }
  .franchise-film-poster img { width:100%; height:100%; object-fit:cover; }
  .franchise-film-info { min-width:0; flex:1; }
  .franchise-film-title { font-size:14px; font-weight:600; color:var(--text); }
  .franchise-film-meta { font-size:12px; color:var(--muted); margin-top:1px; }
  .franchise-watched-check { color:var(--green); font-size:16px; flex-shrink:0; }
  .next-ep-countdown { display:inline-flex; align-items:center; gap:8px; margin-top:10px; padding:6px 12px;
    background: rgba(0,242,254,.1); border:1px solid rgba(0,242,254,.35); border-radius:999px; font-size:13px; flex-wrap:wrap; }
  .next-ep-countdown .next-ep-when { color:#00f2fe; font-weight:700; }
  .next-ep-countdown .next-ep-what { color:#cbd5e1; }
  .show-progress { margin-top:10px; max-width:360px; }
  .show-progress-label { font-size:12px; color:#cbd5e1; margin-bottom:4px; }
  .show-progress-bar { height:6px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
  .show-progress-fill { height:100%; background:linear-gradient(90deg,#00f2fe,#4facfe); border-radius:999px; transition:width .3s ease; }
  .overview { color:#cbd5e1; font-size:14px; line-height:1.6; max-width: 600px; margin-top: 14px; }
  .collection-link { display:inline-block; margin-top:12px; padding:8px 14px; border-radius:8px;
    background: rgba(0,242,254,.08); border:1px solid rgba(0,242,254,.3); color:#00f2fe; font-size:13px; }
  .credits-line { font-size:12.5px; color:var(--muted); margin-top:10px; }
  .credits-line a { color:var(--blue); }
  .cast-row { display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; }
  .cast-card { flex-shrink:0; width:88px; text-align:center; }
  .cast-photo { width:88px; height:88px; border-radius:50%; overflow:hidden; background: rgba(255,255,255,.05); margin-bottom:6px; }
  .cast-photo img { width:100%; height:100%; object-fit:cover; }
  .cast-photo-fallback { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:28px; }
  .cast-name { font-size:11.5px; color:var(--text); font-weight:600; line-height:1.25; }
  .cast-character { font-size:10.5px; color:var(--muted); line-height:1.25; margin-top:1px; }
  .person-header { display:flex; align-items:center; gap:16px; }
  .person-photo { width:72px; height:72px; border-radius:50%; overflow:hidden; background: rgba(255,255,255,.05); flex-shrink:0; }
  .person-photo img { width:100%; height:100%; object-fit:cover; }
  .accent-swatches { display:flex; gap:10px; flex-wrap:wrap; }
  .accent-swatch { width:32px; height:32px; border-radius:50%; border:2px solid transparent; flex-shrink:0; }
  .accent-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px currentColor; }
  .tags-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .tag-chip { display:inline-flex; align-items:center; gap:4px; background: rgba(0,242,254,.1); border:1px solid rgba(0,242,254,.3);
    color: var(--blue); font-size:12px; padding:4px 6px 4px 10px; border-radius:999px; }
  .tag-chip button { background:none; border:none; color:inherit; font-size:14px; line-height:1; padding:0 4px; cursor:pointer; opacity:.7; }
  .tag-chip button:hover { opacity:1; }
  .tag-input { border:1px dashed var(--border); border-radius:999px; padding:5px 12px; font-size:12px;
    background:transparent; color:var(--text); min-width:120px; }
  .stars { display:flex; gap:4px; margin-top: 12px; }
  .star-rating { display:inline-flex; gap:2px; }
  .star-slot { position:relative; width:24px; height:24px; display:inline-block; flex-shrink:0; }
  .star-slot::before { content:'★'; position:absolute; inset:0; font-size:22px; line-height:24px; color:#3a4356; }
  .star-slot::after { content:'★'; position:absolute; inset:0; font-size:22px; line-height:24px; color:var(--amber);
    width: var(--fill, 0%); overflow:hidden; white-space:nowrap; }
  .star-half { position:absolute; top:0; bottom:0; width:50%; z-index:2; cursor:pointer; }
  .star-half-left { left:0; } .star-half-right { right:0; }
  .star-rating-display .star-slot { width:14px; height:14px; }
  .star-rating-display .star-slot::before, .star-rating-display .star-slot::after { font-size:13px; line-height:14px; }
  .ep-review-panel .star-rating .star-slot { width:18px; height:18px; }
  .ep-review-panel .star-rating .star-slot::before, .ep-review-panel .star-rating .star-slot::after { font-size:16px; line-height:18px; }

  .season-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom: 6px; margin-top: 12px; }
  .season-tab { flex-shrink:0; padding:8px 14px; border-radius:6px; font-size:13px; background: rgba(255,255,255,.05); color:#cbd5e1; }
  .season-tab.active { background: var(--blue); color:white; }
  .episode-item { display:flex; gap:12px; background: rgba(255,255,255,.03); border-radius:8px; padding:10px; margin-bottom:8px; align-items:center;
    cursor:pointer; -webkit-tap-highlight-color: rgba(0,242,254,.15); transition: background .12s; }
  .episode-item:active { background: rgba(0,242,254,.12); }
  .episode-item.pending { pointer-events:none; opacity:.6; }
  .episode-item.not-aired { opacity:.5; }
  .episode-item.not-aired .date { color:#00f2fe; font-weight:600; }
  .episode-thumb { width:100px; height:56px; border-radius:6px; overflow:hidden; background: rgba(255,255,255,.05); flex-shrink:0; }
  .episode-thumb img { width:100%; height:100%; object-fit:cover; }
  .episode-info { flex:1; }
  .episode-info .name { font-size:13px; }
  .episode-info .date { font-size:11px; color:#64748b; }
  .ep-watch-btn { width:32px; height:32px; border-radius:50%; background: rgba(255,255,255,.08); color:#94a3b8; flex-shrink:0; }
  .ep-watch-btn.watched { background: var(--green); color:white; }
  .ep-rewatch-btn { display:flex; align-items:center; gap:3px; background:rgba(255,255,255,.06); color:#94a3b8;
    border-radius:14px; padding:4px 8px; font-size:11px; flex-shrink:0; }
  .ep-rewatch-btn:active { background: rgba(0,242,254,.12); }
  .ep-rewatch-btn .rw-count { color:var(--amber); font-weight:700; }
  .ep-review-panel { background: rgba(255,255,255,.03); border-radius:8px; padding:10px; margin:-4px 0 8px; }
  .ep-review-panel .stars { margin-top:0; }
  .ep-review-panel textarea { width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border);
    background:rgba(255,255,255,.05); color:var(--text); font-family:inherit; font-size:13px; resize:vertical; }

  .dropzone { margin-top: 16px; border: 2px dashed var(--border); border-radius: 12px; padding: 48px 24px;
    text-align:center; transition: border-color .2s, background .2s; }
  .dropzone.dragging { border-color: var(--blue); background: rgba(59,130,246,.05); }
  .dropzone .upload-icon { font-size: 32px; color:#64748b; margin-bottom:10px; }
  .format-tabs { display:flex; gap:8px; margin-top: 16px; }
  .format-tab { padding: 9px 14px; border-radius:6px; font-size:13px; font-weight:500; background: rgba(255,255,255,.05); color:#cbd5e1; }
  .format-tab.active { background: var(--blue); color:white; }

  /* ============================================================
     DASHBOARD PROFIL — Étape 2

  .dash-section { margin-bottom: 22px; }

  .genre-bar-count { font-size:12px; color:var(--muted); width:22px; text-align:right; flex-shrink:0; }

  /* ---- Heatmap annuelle (style GitHub) ---- */
  .heatmap-scroll { overflow-x: auto; padding-bottom: 4px; }

  .heatmap-cell { width: 11px; height: 11px; border-radius: 2px; background: rgba(255,255,255,.05); }

  /* ---- Jauge circulaire objectif annuel ---- */

    background: rgba(255,255,255,.05); color: var(--text); font-size: 13px; }

  /* ---- Histogramme temps d'écran hebdo ---- */
  .bar-chart { display:flex; align-items:flex-end; gap:8px; height:110px; padding-top:10px; }
  .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar { width:100%; max-width:28px; background: linear-gradient(180deg, var(--blue), rgba(0,242,254,.15));
    border-radius: 4px 4px 0 0; min-height:3px; transition: height .4s ease; }
  .bar-col .bar-label { font-size:10px; color:var(--muted); margin-top:6px; }
  .bar-col .bar-value { font-size:9px; color:var(--blue); margin-bottom:2px; }

  /* ---- Indice de fidélité ---- */
  .loyalty-bar { display:flex; height:14px; border-radius:999px; overflow:hidden; background: rgba(255,255,255,.05); }
  .loyalty-bar .discovery { background: var(--blue); }
  .loyalty-bar .rewatch { background: var(--amber); }
  .loyalty-legend { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:8px; }
  .loyalty-legend .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }

  /* ---- Wrapped ---- */
  .wrapped-card { width: 100%; max-width: 340px; aspect-ratio: 2/3; border-radius: 18px; overflow:hidden;
    background: radial-gradient(circle at 30% 0%, rgba(0,242,254,.18), transparent 55%), linear-gradient(180deg, #0c1220, #000);
    padding: 28px 24px; display:flex; flex-direction:column; position:relative; }
  .wrapped-card .wtitle { font-size:13px; color: var(--blue); font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
  .wrapped-card .wperiod { font-size:12px; color:var(--muted); margin-top:2px; }
  .wrapped-card .wstat { margin-top:24px; }
  .wrapped-card .wstat .n { font-size:46px; font-weight:800; line-height:1; }
  .wrapped-card .wstat .l { font-size:13px; color:var(--muted); margin-top:2px; }
  .wrapped-card .wfooter { margin-top:auto; font-size:11px; color:#475569; }
  .quick-stats-grid { display:flex; gap:12px; flex-wrap:wrap; margin-bottom: 22px; }
  .quick-stats-grid .panel { flex:1; min-width:110px; text-align:center; }

  .placeholder-panel { border: 1px dashed var(--border); border-radius: 10px; padding: 20px; text-align:center;
    color: var(--muted); font-size: 13px; }
  .wrapped-modal-box { display:flex; flex-direction:column; align-items:center; gap:16px; max-width:360px; width:100%; }
  .wrapped-modal-actions { display:flex; gap:10px; }

  /* (bloc CSS Tier-List retiré — fonctionnalité supprimée) */

  /* ============================================================
     GÉNÉRATEUR DE STORY INSTAGRAM — Étape 3
     ============================================================ */
  .story-modal-box { display:flex; flex-direction:column; align-items:center; gap:14px; max-width:380px; width:100%; }
  .story-frame { position:relative; width:270px; height:480px; border-radius:22px; overflow:hidden;
    background:#000; box-shadow: 0 20px 60px rgba(0,0,0,.7); flex-shrink:0; }
  .story-bg { position:absolute; inset:-24px; background-size:cover; background-position:center; }
  .story-glass-card { position:absolute; left:20px; right:20px; top:50%; transform:translateY(-50%);
    background: rgba(255,255,255,0.09); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border:1px solid rgba(255,255,255,0.22); border-radius:18px; padding:20px 16px; text-align:center;
    box-shadow: 0 20px 50px rgba(0,0,0,.55); }
  .story-poster { width:110px; aspect-ratio:2/3; object-fit:cover; border-radius:10px; margin:0 auto 12px;
    box-shadow: 0 14px 30px rgba(0,0,0,.7); display:block; }
  .story-poster-fallback { display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:11px; color:white; padding:6px; background: rgba(255,255,255,.08); }
  .story-title { font-size:16px; font-weight:800; color:white; margin:0 0 3px; line-height:1.25; }
  .story-episode-badge { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.03em; color:#00f2fe;
    border:1px solid rgba(0,242,254,.5); border-radius:20px; padding:3px 10px; margin-bottom:8px; }
  .story-year { font-size:11px; color:rgba(255,255,255,.65); margin:0 0 10px; }
  .story-stars { font-size:18px; color:#00f2fe; text-shadow: 0 0 10px #00f2fe, 0 0 20px rgba(0,242,254,.6);
    margin-bottom:10px; letter-spacing:2px; }
  .story-review { font-size:11px; color:rgba(255,255,255,.85); font-style:italic; line-height:1.5; margin:0; }
  .story-watermark { position:absolute; bottom:16px; left:0; right:0; text-align:center; font-size:11px;

  .story-controls { width:100%; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .story-blur-label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); width:100%; }
  .story-blur-label input[type="range"] { width:100%; accent-color: var(--blue); }
  .story-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }

  /* ============================================================
     ÉTAPE 4 — Anti-Watchlist, Notion, Timeline, Décision, Flashback
     ============================================================ */
  .ban-btn { position:absolute; top:6px; left:6px; width:22px; height:22px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#f87171; display:flex; align-items:center; justify-content:center;
    font-size:11px; opacity:0; transition:opacity .15s; z-index:2; }
  .card:hover .ban-btn { opacity:1; }
  @media (hover: none) { .ban-btn { opacity:.85; } } /* toujours visible au tactile, pas de :hover fiable */
  .search-add-btn { position:absolute; top:6px; right:6px; z-index:2; background:rgba(0,0,0,.6); }
  .keywords-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .keyword-chip { font-size:11.5px; color:var(--muted); background:rgba(255,255,255,.04); padding:3px 9px; border-radius:999px; }
  .keyword-chip:hover { color:var(--blue); background:rgba(0,242,254,.08); }

  .notion-textarea { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
    background:rgba(255,255,255,.05); color:var(--text); font-family:inherit; font-size:13px; resize:vertical; }
  .notion-actions { display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }

  .timeline-list { display:flex; flex-direction:column; gap:0; }
  .timeline-item { display:flex; align-items:center; gap:12px; position:relative; padding:10px 0; }
  .timeline-item::before { content:''; position:absolute; left:26px; top:0; bottom:0; width:2px; background:rgba(0,242,254,.25); }
  .timeline-item:first-child::before { top:50%; }
  .timeline-item:last-child::before { bottom:50%; }
  .timeline-poster { width:52px; height:78px; border-radius:6px; overflow:hidden; background:var(--card); flex-shrink:0; z-index:1;
    box-shadow: 0 0 0 3px var(--bg); }

  .journal-day-group { margin-bottom: 22px; }
  .journal-day-label { font-size:12px; font-weight:700; color:#00f2fe; text-transform:capitalize; margin-bottom:10px;
    padding-bottom:6px; border-bottom:1px solid var(--border); }
  .journal-entry { display:flex; gap:12px; padding:8px 0; align-items:flex-start; }
  .journal-entry-poster { width:44px; height:64px; border-radius:6px; overflow:hidden; background:var(--card); flex-shrink:0; }
  .journal-entry-poster img { width:100%; height:100%; object-fit:cover; }
  .journal-entry-info { min-width:0; }
  .journal-entry-title { font-size:14px; font-weight:600; color:var(--text); }
  .journal-entry-subtitle { font-size:12px; color:var(--muted); margin-top:1px; }
  .journal-entry-stars { color:#ffb84d; font-size:12px; margin-top:3px; }
  .journal-entry-review { font-size:12px; color:#cbd5e1; margin-top:3px; font-style:italic; }
  .timeline-poster img { width:100%; height:100%; object-fit:cover; }
  .timeline-info { flex:1; min-width:0; }
  .timeline-title { font-size:13px; margin-bottom:4px; }
  .timeline-label-input { width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--border);
    background:rgba(255,255,255,.04); color:var(--text); font-size:12px; }
  .timeline-order-controls { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
  .timeline-order-controls button { background:rgba(255,255,255,.06); color:var(--muted); width:24px; height:20px;
    border-radius:4px; font-size:11px; }

  .decision-controls { display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .decision-row label { font-size:12px; color:var(--muted); display:block; margin-bottom:5px; }
  .decision-row input[type="range"] { width:100%; accent-color: var(--blue); }
  .decision-scale { display:flex; justify-content:space-between; font-size:10px; color:#64748b; margin-top:2px; }
  .decision-row input[type="number"] { width:100px; padding:7px 10px; border-radius:6px; border:1px solid var(--border);
    background:rgba(255,255,255,.05); color:var(--text); font-size:13px; }
  .decision-buttons { display:flex; gap:8px; flex-wrap:wrap; }

  .flashback-badge { position:absolute; left:6px; right:6px; bottom:6px; background:rgba(245,158,11,.9); color:#000;
    font-size:9px; font-weight:700; text-align:center; padding:2px 4px; border-radius:5px; }

  .error-toast { position:fixed; left:50%; bottom:calc(96px + var(--safe-bottom)); transform:translateX(-50%) translateY(20px);
    background:#7f1d1d; color:#fecaca; padding:12px 18px; border-radius:8px; font-size:13px;
    max-width:90vw; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:300; opacity:0; pointer-events:none;
    transition: opacity .2s, transform .2s; }
  .error-toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
  .error-toast.toast-success { background:#064e3b; color:#a7f3d0; }

  .calendar-day { margin-bottom: 22px; }
  .calendar-day-header { font-size: 14px; font-weight: 700; color: var(--blue); margin-bottom: 10px; text-transform: capitalize; }
  .calendar-item { display:flex; gap:12px; align-items:center; background: rgba(255,255,255,.03); border-radius:10px;
    padding: 10px; margin-bottom: 8px; transition: background .15s; }
  .calendar-item:hover { background: rgba(255,255,255,.07); }
  .calendar-item img { width:52px; height:78px; border-radius:6px; object-fit:cover; flex-shrink:0; }
  .calendar-item-noposter { width:52px; height:78px; border-radius:6px; flex-shrink:0; background: rgba(255,255,255,.05);
    display:flex; align-items:center; justify-content:center; font-size:20px; }
  .calendar-item-info { min-width:0; }
  .calendar-item-info .t { font-size: 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .calendar-item-info .s { font-size: 12px; color: var(--muted); margin-top:2px; }

  /* ============================================================
     BOTTOM NAV — remplace la navbar classique du haut
     ============================================================ */
  .bottom-nav { position: fixed; bottom:0; left:0; right:0; z-index: 60; min-height: 72px;
    padding-bottom: var(--safe-bottom);
    display:flex; align-items:stretch; justify-content:space-around;
    background: rgba(9,13,22,0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(0,242,254,0.18); }
  body.amoled-mode .bottom-nav { background: rgba(0,0,0,0.85); }
  .bn-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 4px; color: var(--muted); font-size: 11px; transition: color .15s; }
  .bn-item svg { width:22px; height:22px; }
  .bn-item.active { color: var(--blue); }
  .bn-item:active { opacity: .7; }

  /* ---- Top pills (filtre Tout / Séries / Films sur l'accueil) ---- */
  .top-pills { display:flex; gap:8px; padding: calc(66px + var(--safe-top)) 16px 6px; overflow-x:auto; scrollbar-width:none; }
  .top-pills::-webkit-scrollbar { display:none; }
  .top-pill { flex-shrink:0; padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight:600;
    background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid transparent; }
  .top-pill.active { background: rgba(0,242,254,0.12); color: var(--blue); border-color: rgba(0,242,254,0.4); }

  /* ---- Skeleton loaders (shimmer) ---- */
  .skeleton { background: linear-gradient(100deg, rgba(255,255,255,.04) 30%, rgba(255,255,255,.10) 45%, rgba(255,255,255,.04) 60%);
    background-size: 300% 100%; animation: shimmer 1.3s ease infinite; border-radius: 10px; }
  @keyframes shimmer { 0% { background-position: 140% 0; } 100% { background-position: -40% 0; } }
  .skeleton-hero { height: 60vh; min-height: 380px; width:100%; border-radius:0; }
  .skeleton-row { display:flex; gap:10px; padding: 0 16px 8px; overflow:hidden; }
  .skeleton-card { flex-shrink:0; width:160px; aspect-ratio:2/3; }

  /* ============================================================
     RESPONSIVE — téléphone / tablette
     ============================================================ */
  @media (max-width: 900px) {
    .container { padding: 0 16px; }
    .row-scroll { padding-left: 16px; padding-right: 16px; }
    .row h2 { padding: 0 16px; }
    .detail-body { padding: 0 16px 50px; }
  }

  @media (max-width: 640px) {
    .topbar { padding: calc(8px + var(--safe-top)) 12px 8px; min-height: 50px; }
    .logo { font-size: 15px; }
    .icon-btn { width: 30px; height: 30px; font-size: 13px; }
    .pill-btn { padding: 7px 12px; font-size: 12px; }
    .bn-item span { font-size: 10px; }

    .hero { height: 52vh; min-height: 300px; }
    .hero h1 { font-size: 26px; }
    .hero p { font-size: 13px; -webkit-line-clamp: 2; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; }
    .hero .actions .btn span { display: none; } /* garde juste l'icône sur "Ma liste" pour économiser la place */
    .btn { padding: 9px 14px; font-size: 13px; }

    .card { width: 128px; }
    .skeleton-card { width: 128px; }
    .search-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; }

    .form-card { padding-top: calc(66px + var(--safe-top)); max-width: 100%; }
    .panel { padding: 12px; }

    .detail-hero { height: 32vh; min-height: 200px; }
    .detail-body { margin-top: -60px; }
    .detail-poster { width: 118px; }
    .detail-info h1 { font-size: 21px; }
    .detail-flex { gap: 16px; }
    .stars { justify-content: center; }
    .genres { justify-content: center; }

    /* Les demi-étoiles cliquables (12px/9px par moitié en desktop) sont trop
       petites pour un doigt — on les agrandit nettement sous 640px, sans
       toucher à la version "affichage seul" (listes/journal) qui n'a pas
       besoin d'être tactile. */
    .star-rating:not(.star-rating-display) .star-slot,
    .ep-review-panel .star-rating:not(.star-rating-display) .star-slot { width:38px; height:38px; }
    .star-rating:not(.star-rating-display) .star-slot::before,
    .star-rating:not(.star-rating-display) .star-slot::after,
    .ep-review-panel .star-rating:not(.star-rating-display) .star-slot::before,
    .ep-review-panel .star-rating:not(.star-rating-display) .star-slot::after { font-size:34px; line-height:38px; }

    /* Casting/personne : les vignettes rondes de 88px sont ok, mais le pas
       entre elles était un peu juste pour un défilement au pouce précis. */
    .cast-row { gap:16px; }

    /* Tags perso : la croix de suppression (14px) était limite pour viser du
       pouce sans toucher le texte du tag adjacent. */
    .tag-chip button { padding:2px 8px; font-size:16px; }

    .episode-thumb { width: 76px; height: 44px; }
    .episode-item { padding: 8px; gap: 8px; }

    .trailer-box { max-width: 100%; }
    .trailer-close { top: -38px; }

    .calendar-item img, .calendar-item-noposter { width: 44px; height: 66px; }
  }

  @media (max-width: 400px) {
    .hero h1 { font-size: 22px; }
  }

/* ========================================================================
   MATTHIASTRACK 19.1 — PREMIUM CINEMATIC UI
   Refined visual layer; app logic and existing routes are preserved.
   ======================================================================== */
:root {
  color-scheme: dark;
  --bg: #080b13;
  --card: #111623;
  --border: rgba(152, 174, 204, .16);
  --text: #f4f7fb;
  --muted: #9aa7bc;
  --blue: #77d9e6;
  --green: #43d6a0;
  --amber: #f4c16a;
  --red: #ff7e8c;
  --surface-raised: #171e2d;
  --surface-glass: rgba(14, 19, 31, .78);
  --shadow-soft: 0 18px 48px rgba(0, 0, 0, .24);
  --shadow-deep: 0 28px 80px rgba(0, 0, 0, .42);
  --radius-card: 16px;
  --ease-premium: cubic-bezier(.22, .8, .25, 1);
}

html { scroll-behavior: smooth; scrollbar-gutter: stable; }
body {
  background:
    radial-gradient(ellipse at 12% -10%, rgba(37, 91, 128, .16), transparent 36rem),
    radial-gradient(ellipse at 88% 22%, rgba(32, 86, 94, .10), transparent 34rem),
    var(--bg);
  color: var(--text);
  line-height: 1.55;
  letter-spacing: .005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  padding-bottom: calc(112px + var(--safe-bottom));
}
body.amoled-mode { background: #000; }
::selection { background: rgba(119, 217, 230, .28); color: #fff; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(145, 163, 188, .22); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(145, 163, 188, .38); border: 2px solid transparent; background-clip: padding-box; }

#root > * { animation: pageEnter .26s var(--ease-premium) both; }
@keyframes pageEnter {
  from { opacity: 0; transform: translateY(10px); filter: blur(2px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
#root > .bottom-nav { animation-name: dockAppear; }
@keyframes dockAppear { from { opacity: 0; } to { opacity: 1; } }
@keyframes cinematicDrift { from { transform: scale(1.025); } to { transform: scale(1.085); } }
@keyframes softGlow { 0%, 100% { box-shadow: 0 0 0 1px rgba(119,217,230,.12), 0 12px 30px rgba(0,0,0,.16); } 50% { box-shadow: 0 0 0 1px rgba(119,217,230,.24), 0 14px 34px rgba(0,0,0,.2); } }

/* Navigation & global chrome */
.topbar {
  padding: calc(14px + var(--safe-top)) clamp(18px, 4vw, 58px) 14px;
  min-height: 66px;
  background: linear-gradient(180deg, rgba(8, 11, 19, .94), rgba(8, 11, 19, .68));
  border-bottom: 1px solid rgba(160, 184, 214, .08);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
}
.logo { font-size: 18px; font-weight: 850; letter-spacing: -.045em; display: inline-flex; align-items: center; gap: 1px; }
.logo span { color: var(--blue); }
.topbar .right { gap: 10px; }
.icon-btn {
  width: 38px; height: 38px; font-size: 15px;
  color: #d5deeb; background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.075);
  transition: background .18s var(--ease-premium), color .18s, border-color .18s, transform .18s;
}
.icon-btn:hover { background: rgba(255,255,255,.095); color: #fff; border-color: rgba(119,217,230,.25); transform: translateY(-1px); }
.icon-btn.amoled-active { color: var(--blue); border-color: rgba(119,217,230,.48); box-shadow: 0 0 0 3px rgba(119,217,230,.08); }
.pill-btn { padding: 9px 16px; font-size: 12px; letter-spacing: .01em; transition: transform .18s var(--ease-premium), background .18s, border-color .18s; }
.pill-btn.primary { background: #f4f7fb; color: #101520; }
.pill-btn.primary:hover { background: #fff; transform: translateY(-1px); }
.pill-btn.ghost { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); }
.pill-btn.ghost:hover { background: rgba(255,255,255,.09); }
.streak-badge { background: rgba(244,193,106,.1); border-color: rgba(244,193,106,.24); color: #ffd58b; }
.offline-banner { top: calc(66px + var(--safe-top)); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.container { max-width: 1280px; padding-inline: clamp(18px, 3.4vw, 46px); }
.page { padding-top: calc(82px + var(--safe-top)); padding-bottom: 34px; }

/* Cinematic home */
.top-pills {
  max-width: 1280px; margin-inline: auto;
  padding: calc(78px + var(--safe-top)) clamp(18px, 3.4vw, 46px) 13px;
  gap: 9px;
}
.top-pill {
  padding: 8px 17px; border-radius: 999px; font-size: 12px; letter-spacing: .025em;
  background: rgba(255,255,255,.035); border-color: rgba(255,255,255,.045);
  transition: color .18s, background .18s, border-color .18s, transform .18s var(--ease-premium);
}
.top-pill:hover { color: #f4f7fb; background: rgba(255,255,255,.075); transform: translateY(-1px); }
.top-pill.active { background: rgba(119,217,230,.105); color: #a3f0f2; border-color: rgba(119,217,230,.3); }
.hero { height: min(70vh, 790px); min-height: 440px; background: #0b1020; }
.hero img { animation: cinematicDrift 28s ease-in-out alternate infinite; will-change: transform; filter: saturate(.88) contrast(1.04); }
.hero .overlay {
  background:
    linear-gradient(90deg, rgba(8,11,19,.88) 0%, rgba(8,11,19,.52) 37%, rgba(8,11,19,.04) 78%),
    linear-gradient(0deg, var(--bg) 0%, rgba(8,11,19,.65) 21%, rgba(8,11,19,.08) 66%, rgba(8,11,19,.16) 100%);
}
.hero .content { max-width: 1280px; padding: 46px clamp(22px, 4vw, 60px) 62px; }
.hero h1 { max-width: 720px; font-size: clamp(34px, 5.3vw, 66px); line-height: 1.04; letter-spacing: -.055em; font-weight: 850; text-wrap: balance; text-shadow: 0 5px 32px rgba(0,0,0,.28); }
.hero p { max-width: 550px; color: #c1ccdb; font-size: clamp(14px, 1.3vw, 17px); line-height: 1.65; }
.hero .actions { gap: 10px; }
.btn {
  min-height: 42px; padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 700;
  letter-spacing: .005em; transition: transform .2s var(--ease-premium), filter .2s, background .2s, border-color .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
.btn:active { transform: translateY(0) scale(.985); }
.btn.white { background: #f5f7fb; color: #0c111b; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.btn.white:hover { background: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
.btn.glass { background: rgba(244,247,251,.12); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(16px); }
.btn.outline { border: 1px solid rgba(238,244,252,.26); background: rgba(12,17,27,.18); backdrop-filter: blur(10px); }
.btn.outline:hover { border-color: rgba(119,217,230,.7); background: rgba(119,217,230,.09); }
.btn.outline.active { background: rgba(67,214,160,.18); border-color: rgba(67,214,160,.46); color: #91f2c6; }
.btn.blue { background: linear-gradient(135deg, #277ba8, #187e86); color: #fff; box-shadow: 0 8px 24px rgba(29,123,152,.18); }
.btn.blue:hover { box-shadow: 0 12px 30px rgba(29,123,152,.28); }
.btn:disabled { filter: grayscale(.3); }

/* The rows feel like a well-edited streaming catalogue, not a row of widgets */
.row { margin: 0 auto 36px; }
.row h2 {
  padding-inline: max(18px, calc((100vw - 1190px) / 2)); margin-bottom: 14px;
  font-size: clamp(17px, 1.5vw, 20px); font-weight: 760; letter-spacing: -.025em;
  display: flex; align-items: center; gap: 9px;
}
.row-scroll {
  gap: clamp(12px, 1.25vw, 18px);
  padding: 0 max(18px, calc((100vw - 1190px) / 2)) 14px;
  scroll-padding-inline: max(18px, calc((100vw - 1190px) / 2));
  scroll-snap-type: x mandatory; overscroll-behavior-inline: contain;
}
.row-scroll > .card { scroll-snap-align: start; }
.card { width: clamp(148px, 13.8vw, 190px); }
.card .poster {
  border-radius: 13px; background: linear-gradient(145deg, #151d2d, #0d111b);
  box-shadow: 0 9px 26px rgba(0,0,0,.20); border: 1px solid rgba(255,255,255,.055);
  transition: transform .28s var(--ease-premium), box-shadow .28s var(--ease-premium), border-color .28s;
}
.card .poster img { transition: filter .28s var(--ease-premium); }
.card:hover .poster { transform: translateY(-4px) scale(1.015); z-index: 5; border-color: rgba(119,217,230,.3); box-shadow: 0 18px 38px rgba(0,0,0,.45), 0 0 0 1px rgba(119,217,230,.06); }
.card:hover .poster img { filter: saturate(1.06); }
.card .title {
  margin-top: 9px; font-size: 13px; line-height: 1.38; font-weight: 620; color: #dce5f1;
  white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  min-height: 2.76em; text-overflow: ellipsis; transition: color .18s;
}
.card:hover .title { color: #fff; }
.card .badge { width: 25px; height: 25px; top: 8px; right: 8px; border: 1px solid rgba(255,255,255,.24); box-shadow: 0 4px 16px rgba(0,0,0,.3); }
.card .card-next-ep { padding: 10px 7px 7px; font-size: 10px; letter-spacing: .035em; }
.card .overlay-actions { padding-bottom: 12px; }
.mini-btn { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.15); box-shadow: 0 6px 18px rgba(0,0,0,.28); }
.mini-btn.white { background: rgba(250,252,255,.96); color: #0b1018; }
.mini-btn.outline { background: rgba(8,11,19,.62); border-color: rgba(255,255,255,.32); }
.up-next-card .poster { outline: 1px solid rgba(119,217,230,.58); outline-offset: -1px; }

/* Shared surfaces: detail pages, stats, lists, import/export, forms */
.panel, .summary-box, .franchise-card, .achievement-card, .calendar-item, .episode-item,
.franchise-film-row, .profile-link, .form-card, .dropzone {
  border-radius: 14px;
}
.panel {
  background: linear-gradient(145deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
  border: 1px solid rgba(153,176,207,.14); box-shadow: 0 10px 32px rgba(0,0,0,.09);
  padding: 19px; margin-bottom: 17px;
}
.panel h3 { font-size: 15px; font-weight: 730; letter-spacing: -.015em; }
.profile-link { border-bottom-color: rgba(153,176,207,.12); transition: background .18s, padding-left .18s var(--ease-premium); }
.profile-link:hover { background: rgba(119,217,230,.045); padding-left: 20px; }
.field label { color: #d2dceb; font-size: 12px; font-weight: 650; letter-spacing: .025em; }
.field input, input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), textarea, select {
  accent-color: var(--blue);
}
.field input, .decision-row input[type="number"], .ep-review-panel textarea, .tag-input,
.search-box input, .search-filters select, textarea, select {
  border-radius: 10px; border-color: rgba(153,176,207,.2);
  background-color: rgba(17,22,35,.82); color: #f1f5fa;
  transition: border-color .18s, box-shadow .18s, background .18s;
}
.field input, textarea, select { min-height: 42px; }
.field input:focus, .search-box input:focus, textarea:focus, select:focus {
  border-color: rgba(119,217,230,.68); outline: none;
  box-shadow: 0 0 0 3px rgba(119,217,230,.09);
}
input::placeholder, textarea::placeholder { color: #74839a; opacity: 1; }
input[type="checkbox"], input[type="radio"] { accent-color: #55c9d5; }
.search-page-wrap { min-height: 62vh; }
.search-box { width: min(900px, 100%); margin: clamp(44px, 7vh, 90px) auto 0; }
.search-box input { padding: 20px 22px 20px 56px; border-radius: 16px; background: rgba(17,22,35,.86); border-color: rgba(153,176,207,.18); box-shadow: var(--shadow-soft); font-size: 16px; }
.search-box input:focus { border-color: rgba(119,217,230,.55); box-shadow: 0 10px 36px rgba(0,0,0,.22), 0 0 0 3px rgba(119,217,230,.08); }
.search-icon { color: var(--blue); left: 20px; }
.search-filters { gap: 8px; }
.search-filters select { min-height: 38px; padding: 8px 13px; border-radius: 999px; }
.search-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 20px 16px; }
.detail-hero { height: min(50vh, 580px); min-height: 300px; }
.detail-hero .overlay { background: linear-gradient(90deg, rgba(8,11,19,.48), rgba(8,11,19,.06) 60%), linear-gradient(180deg, rgba(8,11,19,.18), rgba(8,11,19,.55) 58%, var(--bg) 100%); }
.detail-body { max-width: 1120px; padding-inline: clamp(20px, 4vw, 46px); }
.detail-flex { gap: clamp(22px, 3vw, 38px); }
.detail-poster { width: clamp(142px, 17vw, 204px); border-radius: 14px; box-shadow: 0 24px 58px rgba(0,0,0,.48); border: 1px solid rgba(255,255,255,.1); }
.detail-info h1 { font-size: clamp(25px, 3.3vw, 42px); font-weight: 820; letter-spacing: -.045em; line-height: 1.08; }
.meta-line { line-height: 1.8; }
.genre-chip, .keyword-chip, .tag-chip { border-radius: 999px; }
.genre-chip { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.055); }
.season-tabs { gap: 9px; }
.season-tab, .format-tab { border: 1px solid rgba(255,255,255,.075); border-radius: 999px; padding: 9px 15px; transition: background .16s, border-color .16s; }
.season-tab.active, .format-tab.active { background: rgba(119,217,230,.15); color: #b7f4f3; border-color: rgba(119,217,230,.34); }
.episode-item { border: 1px solid rgba(153,176,207,.06); background: rgba(255,255,255,.025); transition: background .18s, border-color .18s, transform .18s var(--ease-premium); }
.episode-item:hover { background: rgba(255,255,255,.05); border-color: rgba(119,217,230,.16); transform: translateY(-1px); }
.ep-watch-btn { transition: background .16s, color .16s, transform .16s; }
.ep-watch-btn:hover { transform: scale(1.06); }
.ep-watch-btn.watched { background: #209c79; color: #fff; }
.stars .star-slot::before { color: #303a4d; }
.stars .star-slot::after { color: #f4c16a; }
.dropzone { background: rgba(255,255,255,.015); border-color: rgba(153,176,207,.22); transition: background .2s, border-color .2s; }
.dropzone:hover, .dropzone.dragging { border-color: rgba(119,217,230,.55); background: rgba(119,217,230,.045); }
.progress-bar-bg { background: rgba(255,255,255,.07); }
.progress-bar-fill, .show-progress-fill { background: linear-gradient(90deg, #34c8bd, #62b9ef); box-shadow: 0 0 12px rgba(71,198,218,.18); }
.genre-bar-fill { background: linear-gradient(90deg, #36cfc0, #58aeea); }
.monthly-bar { background: linear-gradient(180deg, #66d8e8, #3778b6); }

/* Modals and feedback should feel deliberate and polished */
.trailer-overlay { background: rgba(3,5,10,.78); backdrop-filter: blur(16px) saturate(120%); -webkit-backdrop-filter: blur(16px) saturate(120%); padding: clamp(14px, 4vw, 40px); }
.trailer-box, .wrapped-modal-box, .story-modal-box { border: 1px solid rgba(190,210,238,.16); border-radius: 18px; overflow: visible; box-shadow: var(--shadow-deep); }
.trailer-box { border-radius: 16px; overflow: hidden; }
.trailer-close { border: 1px solid rgba(255,255,255,.13); background: rgba(21,27,41,.88); backdrop-filter: blur(14px); transition: transform .18s, background .18s; }
.trailer-close:hover { background: rgba(50,61,80,.92); transform: rotate(4deg); }
.error-toast { border: 1px solid rgba(255,255,255,.1); border-radius: 12px; backdrop-filter: blur(18px); box-shadow: var(--shadow-deep); }
.error-toast.toast-success { background: rgba(10,80,65,.94); }
.loading-center { min-height: 36vh; }
.spinner { border-color: rgba(255,255,255,.15); border-top-color: var(--blue); }
.skeleton { background: linear-gradient(100deg, rgba(255,255,255,.035) 28%, rgba(255,255,255,.085) 45%, rgba(255,255,255,.035) 62%); background-size: 250% 100%; }
@keyframes shimmer { 0% { background-position: 130% 0; } 100% { background-position: -30% 0; } }

/* A compact floating navigation dock on desktop; thumb-first bar on phones */
.bottom-nav {
  left: 50%; right: auto; bottom: calc(20px + var(--safe-bottom)); transform: translateX(-50%);
  width: min(520px, calc(100vw - 36px)); min-height: 68px; padding: 5px;
  border: 1px solid rgba(157,183,215,.17); border-radius: 22px;
  background: rgba(13,18,29,.82); box-shadow: 0 18px 60px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.035);
  backdrop-filter: blur(28px) saturate(165%); -webkit-backdrop-filter: blur(28px) saturate(165%);
  justify-content: stretch; gap: 4px;
}
body.amoled-mode .bottom-nav { background: rgba(4,5,8,.89); }
.bn-item { border-radius: 16px; gap: 4px; font-size: 10px; font-weight: 620; letter-spacing: .015em; transition: color .18s, background .18s, transform .18s; }
.bn-item svg { width: 21px; height: 21px; transition: transform .2s var(--ease-premium); }
.bn-item:hover { color: #e6f4fa; background: rgba(255,255,255,.045); }
.bn-item:hover svg { transform: translateY(-1px); }
.bn-item.active { color: #a6ecf1; background: rgba(119,217,230,.09); box-shadow: inset 0 0 0 1px rgba(119,217,230,.08); }
.bn-item.active svg { filter: drop-shadow(0 0 7px rgba(119,217,230,.18)); }

/* Accessibility and touch ergonomics */
a, button, input, select, textarea { -webkit-tap-highlight-color: rgba(119,217,230,.12); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid #8ee8ef !important; outline-offset: 3px;
}
button, .btn, .mini-btn, .top-pill, .season-tab, .format-tab { touch-action: manipulation; }
@media (hover: hover) and (pointer: fine) {
  .profile-link:hover, .calendar-item:hover, .franchise-card:hover { transform: translateY(-1px); }
}
@media (max-width: 900px) {
  .hero .content { padding-inline: 28px; }
  .row h2, .row-scroll { padding-inline: 22px; }
  .detail-body { padding-inline: 22px; }
  .search-grid { gap: 16px 12px; }
}
@media (max-width: 640px) {
  body { padding-bottom: calc(88px + var(--safe-bottom)); }
  #root > * { animation-duration: .22s; }
  .topbar { min-height: 55px; padding: calc(9px + var(--safe-top)) 13px 9px; gap: 8px; }
  .logo { font-size: 16px; }
  .topbar .right { gap: 6px; }
  .icon-btn { width: 33px; height: 33px; font-size: 14px; }
  .pill-btn { padding: 8px 11px; font-size: 11px; }
  .streak-badge { padding: 5px 8px; font-size: 11px; }
  .top-pills { padding: calc(66px + var(--safe-top)) 15px 11px; gap: 7px; }
  .top-pill { padding: 8px 15px; }
  .hero { height: 55svh; min-height: 355px; max-height: 570px; }
  .hero img { animation-duration: 36s; }
  .hero .overlay { background: linear-gradient(0deg, var(--bg) 0%, rgba(8,11,19,.78) 21%, rgba(8,11,19,.19) 62%, rgba(8,11,19,.08) 100%); }
  .hero .content { padding: 28px 20px 34px; }
  .hero h1 { font-size: clamp(28px, 8vw, 38px); line-height: 1.04; margin-bottom: 10px; max-width: 100%; }
  .hero p { max-width: 95%; font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
  .hero .actions { gap: 8px; }
  .btn { min-height: 40px; padding: 10px 13px; border-radius: 10px; font-size: 12px; }
  .hero .actions .btn span { display: inline; }
  .row { margin-bottom: 29px; }
  .row h2 { font-size: 16px; margin-bottom: 11px; padding-inline: 16px; }
  .row-scroll { gap: 12px; padding: 0 16px 12px; scroll-padding-left: 16px; }
  .card { width: 132px; }
  .card .poster { border-radius: 11px; }
  .card .title { font-size: 12px; line-height: 1.35; margin-top: 8px; min-height: 2.7em; }
  .card .badge { width: 22px; height: 22px; top: 6px; right: 6px; }
  .mini-btn { width: 34px; height: 34px; }
  .container { padding-inline: 16px; }
  .page { padding-top: calc(70px + var(--safe-top)); }
  .search-page-wrap { min-height: 58vh; }
  .search-box { margin-top: 7vh; }
  .search-box input { padding: 17px 15px 17px 48px; font-size: 15px; }
  .search-grid { grid-template-columns: repeat(auto-fill, minmax(106px, 1fr)); gap: 16px 10px; }
  .detail-hero { height: 34svh; min-height: 215px; }
  .detail-body { margin-top: -62px; padding: 0 16px 46px; }
  .detail-flex { align-items: flex-end; gap: 15px; flex-wrap: nowrap; }
  .detail-poster { width: 112px; border-radius: 11px; flex: 0 0 112px; }
  .detail-info { min-width: 0; padding-bottom: 2px; }
  .detail-info h1 { font-size: clamp(19px, 5.9vw, 26px); line-height: 1.12; }
  .meta-line { font-size: 11px; }
  .genres { gap: 5px; margin-bottom: 8px; }
  .genre-chip { font-size: 10px; padding: 4px 8px; }
  .panel { padding: 14px; }
  .bottom-nav {
    left: 0; right: 0; bottom: 0; transform: none; width: 100%; min-height: 67px;
    padding: 5px 8px calc(5px + var(--safe-bottom)); gap: 4px;
    border-left: 0; border-right: 0; border-bottom: 0; border-radius: 19px 19px 0 0;
    background: rgba(10,14,23,.91); box-shadow: 0 -12px 36px rgba(0,0,0,.22);
  }
  .bn-item { gap: 3px; font-size: 10px; }
  .bn-item svg { width: 21px; height: 21px; }
  .error-toast { width: calc(100vw - 30px); max-width: 420px; text-align: center; bottom: calc(81px + var(--safe-bottom)); }
}
@media (max-width: 390px) {
  .topbar .right { gap: 4px; }
  .logo { font-size: 15px; }
  .pill-btn { padding-inline: 9px; }
  .hero .actions .btn span { display: none; }
  .card { width: 120px; }
  .detail-flex { gap: 12px; }
  .detail-poster { width: 98px; flex-basis: 98px; }

.wrapped-launch-card { width:100%; display:flex; align-items:center; gap:15px; text-align:left; padding:17px 19px; margin:0 0 23px; border:1px solid rgba(119,217,230,.23); border-radius:18px; color:var(--text); background:radial-gradient(ellipse at 5% 0,rgba(119,217,230,.15),transparent 52%),linear-gradient(110deg,rgba(255,255,255,.045),rgba(255,255,255,.012)); box-shadow:0 12px 34px rgba(0,0,0,.13); transition:transform .2s var(--ease-premium),border-color .2s,background .2s; }

/* The Wrapped is a real swipe-like vertical story deck, not a static stats poster. */
#wrapped-modal { padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); }

.wrapped-close { width:34px; height:34px; margin:0 0 1px auto; }

.wrapped-period-badge { max-width:46%; padding:6px 9px; border:1px solid rgba(153,176,207,.12); border-radius:999px; color:#aab7c9; background:rgba(255,255,255,.035); font-size:9px; text-align:center; }
.wrapped-period-switch { width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); padding:4px; gap:4px; border:1px solid rgba(153,176,207,.11); border-radius:13px; background:rgba(255,255,255,.025); }

.wrapped-period-btn.active { color:#d9fbfc; background:rgba(119,217,230,.13); box-shadow:inset 0 0 0 1px rgba(119,217,230,.2); }
.wrapped-story { width:min(326px, calc(58dvh * .5625), calc(100vw - 60px)); aspect-ratio:9/16; max-height:none; border-radius:21px; overflow:hidden; position:relative; isolation:isolate; display:flex; flex-direction:column; padding:clamp(15px,4.2vw,24px); color:#f7f9fc; background:radial-gradient(circle at 78% 11%,rgba(119,217,230,.17),transparent 39%),linear-gradient(150deg,#101a2d 0%,#090e18 55%,#03060b 100%); border:1px solid rgba(255,255,255,.12); box-shadow:0 18px 45px rgba(0,0,0,.36); }
.wrapped-story::before { content:""; position:absolute; z-index:-1; top:-15%; right:-28%; width:75%; aspect-ratio:1; border-radius:50%; border:1px solid rgba(119,217,230,.14); box-shadow:0 0 0 16px rgba(119,217,230,.02),0 0 0 34px rgba(119,217,230,.018),0 0 72px rgba(119,217,230,.08); }
.wrapped-story::after { content:""; position:absolute; z-index:-1; left:-35%; bottom:-19%; width:76%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(97,126,209,.12),transparent 70%); pointer-events:none; }
.wrapped-story-1 { background:radial-gradient(circle at 12% 22%,rgba(134,168,255,.17),transparent 39%),linear-gradient(155deg,#111a2e,#080d17 70%,#05070c); }
.wrapped-story-2 { background:radial-gradient(circle at 90% 10%,rgba(199,161,255,.18),transparent 40%),linear-gradient(155deg,#1a142c,#0c0b19 70%,#05060c); }
.wrapped-story-3 { background:radial-gradient(circle at 80% 8%,rgba(121,228,189,.15),transparent 40%),linear-gradient(155deg,#102520,#08120f 70%,#040908); }
.wrapped-story-4 { background:radial-gradient(circle at 80% 8%,rgba(246,197,108,.16),transparent 40%),linear-gradient(155deg,#271e13,#12100e 70%,#060606); }
.wrapped-story-5 { background:radial-gradient(circle at 80% 8%,rgba(255,156,168,.15),transparent 40%),linear-gradient(155deg,#28141e,#120a12 70%,#050609); }
.wrapped-story-top, .wrapped-story-bottom { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-shrink:0; }
.wrapped-story-top { color:#afbbcf; font-size:7px; letter-spacing:.13em; font-weight:850; }

.wrapped-story-bottom { padding-top:10px; margin-top:auto; border-top:1px solid rgba(255,255,255,.12); color:#8090a8; font-size:6px; letter-spacing:.12em; font-weight:750; }

.wrapped-cover-orb { width:clamp(78px,26vw,116px); aspect-ratio:1; margin:18px auto 15px; display:grid; place-items:center; border-radius:50%; color:#d6fbfc; border:1px solid rgba(119,217,230,.55); background:radial-gradient(circle at 34% 28%,rgba(119,217,230,.34),rgba(119,217,230,.03) 55%,rgba(0,0,0,.08)); box-shadow:0 0 0 10px rgba(119,217,230,.035),0 0 60px rgba(119,217,230,.14); font-size:24px; font-weight:900; letter-spacing:-.08em; }
.wrapped-cover-content { display:flex; flex:1; min-height:0; flex-direction:column; }

.wrapped-slide-copy { flex-shrink:0; }
.wrapped-subcopy { margin:9px 0 0; max-width:250px; color:#a8b5c9; font-size:9px; line-height:1.55; }
.wrapped-metric-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:auto; }
.wrapped-metric-card { min-width:0; min-height:70px; display:flex; flex-direction:column; justify-content:center; gap:4px; padding:11px; border:1px solid rgba(255,255,255,.1); border-radius:12px; background:rgba(255,255,255,.045); }

.wrapped-metric-wide span { max-width:85px; text-align:right; }
.wrapped-genre-feature { display:flex; flex-direction:column; gap:5px; padding:15px; margin-top:15px; border:1px solid rgba(199,161,255,.24); border-radius:13px; background:rgba(199,161,255,.075); }

.wrapped-genre-list { display:flex; flex-direction:column; gap:10px; margin-top:15px; }
.wrapped-genre-label { display:flex; justify-content:space-between; gap:8px; margin-bottom:5px; color:#dce4f0; font-size:9px; }
.wrapped-genre-label b { color:#aebbd0; }
.wrapped-genre-track { height:5px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.08); }
.wrapped-genre-track i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#c7a1ff,#8da5ff); }
.wrapped-feature-panel { flex:1; min-height:0; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; margin-top:14px; padding:19px; border:1px solid rgba(121,228,189,.2); border-radius:16px; background:linear-gradient(140deg,rgba(121,228,189,.07),rgba(255,255,255,.025)); }
.wrapped-feature-symbol { display:grid; place-items:center; width:34px; height:34px; border:1px solid rgba(121,228,189,.22); border-radius:11px; color:#8ce8c5; background:rgba(121,228,189,.08); }
.wrapped-feature-overline { margin-top:17px; color:#8ce8c5; font-size:7px; letter-spacing:.14em; font-weight:850; }
.wrapped-feature-panel > strong { display:block; margin-top:8px; font-size:clamp(20px,6vw,29px); line-height:1.08; letter-spacing:-.05em; overflow-wrap:anywhere; }
.wrapped-feature-number { margin-top:15px; color:#8ce8c5; font-size:clamp(42px,13vw,62px); font-weight:850; line-height:1; }
.wrapped-feature-caption { margin-top:5px; color:#aab9c7; font-size:8px; line-height:1.5; }
.wrapped-rating-panel { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; flex:1; min-height:0; margin-top:14px; padding:18px; border:1px solid rgba(246,197,108,.18); border-radius:16px; background:rgba(246,197,108,.055); }
.wrapped-rating-label { color:#f0c876; font-size:7px; letter-spacing:.13em; font-weight:850; }
.wrapped-rating-number { margin-top:10px; font-size:clamp(31px,10vw,45px); line-height:1; letter-spacing:-.06em; color:#f7d48e; }
.wrapped-rating-number small { font-size:10px; font-weight:600; letter-spacing:0; color:#aab5c8; }
.wrapped-rating-no-data { margin-top:10px; font-size:23px; line-height:1.15; }
.wrapped-favorite-rule { width:100%; margin:16px 0; border-top:1px solid rgba(255,255,255,.12); }
.wrapped-rated-title { margin-top:8px; font-size:clamp(15px,4.3vw,22px); line-height:1.2; letter-spacing:-.035em; overflow-wrap:anywhere; }
.wrapped-rated-score { margin-top:8px; color:#f4c16a; font-size:10px; }
.wrapped-muted-note { margin:9px 0 0; color:#aab5c8; font-size:8px; line-height:1.6; }
.wrapped-rhythm-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-top:auto; }
.wrapped-rhythm-card { min-width:0; padding:13px 10px; display:flex; flex-direction:column; gap:7px; border:1px solid rgba(255,156,168,.18); border-radius:13px; background:rgba(255,156,168,.045); }
.wrapped-rhythm-card span, .wrapped-peak-card > span { color:#edaab7; font-size:7px; letter-spacing:.1em; font-weight:850; }
.wrapped-rhythm-card strong { font-size:clamp(27px,8vw,37px); line-height:1; letter-spacing:-.06em; }

.wrapped-peak-card { display:flex; flex-direction:column; gap:6px; margin-top:9px; padding:12px; border:1px solid rgba(255,255,255,.1); border-radius:12px; background:rgba(255,255,255,.035); }

.wrapped-outro { margin-top:12px; color:#ffb9c2; font-size:10px; font-weight:800; }
.wrapped-outro span { display:block; margin-top:3px; color:#aab5c8; font-size:8px; font-weight:500; }
.wrapped-empty { display:flex; flex:1; flex-direction:column; align-items:flex-start; justify-content:center; }
.wrapped-empty-orbit { display:grid; place-items:center; width:65px; height:65px; margin-bottom:20px; border:1px solid rgba(119,217,230,.35); border-radius:22px; color:var(--blue); font-size:32px; background:rgba(119,217,230,.06); }
.wrapped-empty p { color:#a8b5c9; font-size:10px; line-height:1.7; }

.wrapped-empty-inline { padding:20px 15px; margin-top:auto; margin-bottom:auto; border:1px dashed rgba(255,255,255,.16); border-radius:13px; color:#aab5c8; font-size:9px; line-height:1.7; }
.wrapped-story-nav { width:100%; display:flex; align-items:center; justify-content:center; gap:15px; }
.wrapped-nav-arrow { width:34px; height:34px; border:1px solid rgba(153,176,207,.16); border-radius:11px; color:#d7e0ec; background:rgba(255,255,255,.045); font-size:17px; transition:background .16s,border-color .16s; }
.wrapped-nav-arrow:not(:disabled):hover { border-color:rgba(119,217,230,.32); background:rgba(119,217,230,.08); }
.wrapped-nav-arrow:disabled { opacity:.25; cursor:not-allowed; }
.wrapped-story-dots { display:flex; align-items:center; justify-content:center; gap:6px; }

.wrapped-story-dot.active { width:20px; background:var(--blue); }
.wrapped-export-hint { max-width:310px; margin:0; color:#8190a6; font-size:8px; line-height:1.55; text-align:center; }
.wrapped-modal-actions { width:100%; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.65fr); gap:8px; }
.wrapped-modal-actions .btn { width:100%; min-height:40px; display:flex; align-items:center; justify-content:center; white-space:normal; text-align:center; padding:9px 10px; font-size:10px; }

@media (max-width:760px) {
  .custom-list-head { flex-direction:column; align-items:stretch; gap:12px; }
  .custom-list-actions { justify-content:flex-start; }
  .custom-list-create { grid-template-columns:52px minmax(0,1fr); }
  .custom-list-create .btn { grid-column:1/-1; min-height:42px; }
  .profile-detail-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:420px) {
  .custom-list-panel { padding:12px; border-radius:15px; }
  .custom-list-identity h3 { font-size:14px; }
  .custom-list-actions { gap:5px; }
  .custom-list-action-btn { padding:7px 8px; font-size:9px; }
  .custom-list-item { gap:7px; padding:6px; }

  .wrapped-story-main { padding-top:18px; }
  .wrapped-cover-orb { margin:13px auto 10px; }

  .wrapped-feature-panel { padding:14px; }
  .wrapped-rating-panel { padding:14px; }
}
@media (max-height:740px) {
  .wrapped-story { width:min(275px, calc(53dvh * .5625), calc(100vw - 60px)); max-height:none; }

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.118.0'; // version figée : pas de mise à jour surprise en production

// l'utilisateur, jamais stockées dans localStorage). C'est la SEULE source

/** Date locale YYYY-MM-DD : évite que les dates du jour basculent à hier/demain
 * quand le fuseau local est différent de UTC. Les timestamps serveur restent en ISO UTC. */
function localDateISO(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

/** Normalise date SQL ou timestamp ISO en jour civil local. L'application stocke
 * souvent une DATE SQL, mais certains imports peuvent fournir un horodatage ISO.
 * On conserve le jour explicite d'une chaîne ISO pour éviter les décalages UTC. */
function normalizeWatchedDay(value) {
  if (!value) return null;
  if (typeof value === 'string') {
    const match = value.match(/^(\d{4}-\d{2}-\d{2})/);
    if (match) return match[1];
  }
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? null : localDateISO(parsed);
}

const CONFIG = Object.freeze({
  supabaseUrl: 'https://adrpfwmtajxiqsjdukrx.supabase.co',
  supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkcnBmd210YWp4aXFzamR1a3J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNDQ0MTksImV4cCI6MjA5OTcyMDQxOX0.rzRH5h9_xlSQvjru1TqckYwy0WxVTBBH41gKXrxl6Ds',

// ============================================================================
// CACHE SWR (Stale-While-Revalidate) — localStorage, expiration 6h
// Affiche le cache instantanément si présent, pendant qu'un fetch frais tourne
// en arrière-plan (voir renderHome). Rend le bouton "retour" quasi instantané.
// ============================================================================
const localCache = {
  get(key) {
    try {
      const raw = localStorage.getItem('swr_' + key);
      if (!raw) return null;
      const { value, expiresAt } = JSON.parse(raw);
      if (Date.now() > expiresAt) return null;
      return value;
    } catch { return null; }
  },

   * vaut afficher des données un peu vieilles que rien du tout. */

    try {
      const raw = localStorage.getItem('swr_' + key);
      if (!raw) return null;
      return JSON.parse(raw).value;
    } catch { return null; }
  },
  set(key, value, ttlMs = 6 * 60 * 60 * 1000) {
    try { localStorage.setItem('swr_' + key, JSON.stringify({ value, expiresAt: Date.now() + ttlMs })); }
    catch { /* quota localStorage dépassé : tant pis, pas de cache cette fois */ }
  },
  delete(key) { try { localStorage.removeItem('swr_' + key); } catch { /* tant pis */ } },
};

// ============================================================================
// Mode hors-ligne : bannière globale + secours sur le cache même expiré pour

// `config` reste un alias vers CONFIG, gardé pour ne pas toucher au reste du
// code : partout ailleurs, config.xxx lit directement l'objet CONFIG en dur.
const config = CONFIG;
