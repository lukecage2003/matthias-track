function yearOverYearSummaryHtml(interactionRows, epRows) {
  const now = new Date();
  const nowYear = now.getFullYear(), previousYear = nowYear - 1;
  const currentEnd = localDateISO(now);
  const prevMonthEnd = new Date(previousYear, now.getMonth() + 1, 0).getDate();
  const previousEnd = `${previousYear}-${String(now.getMonth()+1).padStart(2,'0')}-${String(Math.min(now.getDate(),prevMonthEnd)).padStart(2,'0')}`;
  const summarize = (year, endDay) => {
    const yearStart = `${year}-01-01`;
    const movies = (interactionRows || []).filter(r => r.status === 'watched' && r.media?.media_type === 'movie' && (() => { const d=normalizeWatchedDay(r.watched_at); return d && d>=yearStart && d<=endDay; })());
    const episodes = (epRows || []).filter(r => { const d=normalizeWatchedDay(r.watched_at); return d && d>=yearStart && d<=endDay; });
    const total = movies.length + episodes.length;
    const minutes = movies.reduce((sum,r)=>sum + Number(r.media?.runtime||0)*(1+Number(r.rewatch_count||0)),0) + episodes.reduce((sum,r)=>sum+Number(r.episodes?.runtime||0),0);
    const ratings = movies.filter(r => r.rating != null).map(r=>Number(r.rating)).filter(Number.isFinite);
    return { year, movies:movies.length, episodes:episodes.length, total, minutes, average:ratings.length?ratings.reduce((a,b)=>a+b,0)/ratings.length:null };
  };
  const curr = summarize(nowYear, currentEnd), prev = summarize(previousYear, previousEnd);
  const delta = curr.total - prev.total;
  const deltaText = delta === 0 ? 'Le même nombre de visionnages sur cette période' : `${delta > 0 ? '+' : '−'}${Math.abs(delta)} visionnage${Math.abs(delta)===1?'':'s'} par rapport à la même période l’an dernier`;
  const metric = (label,a,b) => { const max=Math.max(a,b,1); return `<div class="year-compare-metric"><span>${label}</span><div><i style="width:${Math.max(2,a/max*100)}%"></i></div><strong>${a.toLocaleString('fr-FR')}</strong><small>${b.toLocaleString('fr-FR')} en ${previousYear}</small></div>`; };
  return `<section class="year-compare-panel panel"><div class="year-compare-heading"><div><div class="library-eyebrow">TON ÉVOLUTION</div><h3>${nowYear} vs ${previousYear}</h3><p>${escapeHtml(deltaText)}. Les deux chiffres couvrent la même période de l’année.</p></div><span class="year-compare-mark">↗</span></div><div class="year-compare-top"><div><span>${nowYear} · depuis janvier</span><strong>${curr.total.toLocaleString('fr-FR')}</strong><small>films + épisodes vus</small></div><div><span>${previousYear} · même période</span><strong>${prev.total.toLocaleString('fr-FR')}</strong><small>films + épisodes vus</small></div></div><div class="year-compare-bars">${metric('Films',curr.movies,prev.movies)}${metric('Épisodes',curr.episodes,prev.episodes)}</div><div class="year-compare-bottom"><span>⏱ ${escapeHtml(formatWatchDuration(curr.minutes))} regardés cette année</span><span>${curr.average != null ? `★ ${curr.average.toFixed(1)}/5 de moyenne sur les films notés` : 'Pas encore de moyenne de notes cette année'}</span></div></section>`;
}

    listsCount,

  </div>`;
}

function drawWrappedCanvas(w, slideIndex = 0) {
  const canvas = document.createElement('canvas');
  canvas.width = 1080; canvas.height = 1920;
  const ctx = canvas.getContext('2d');
  if (!ctx) throw new Error('Le navigateur ne permet pas de créer une image.');
  const count = wrappedSlideCount(w);
  const index = Math.min(Math.max(0, slideIndex), count - 1);
  const accents = ['#78e2e8', '#86a8ff', '#c7a1ff', '#79e4bd', '#f6c56c', '#ff9ca8'];
  const accent = accents[index % accents.length];
  const background = ctx.createLinearGradient(0, 0, 1080, 1920);
  background.addColorStop(0, '#101829'); background.addColorStop(.48, '#090e18'); background.addColorStop(1, '#03060b');
  ctx.fillStyle = background; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const glow = ctx.createRadialGradient(840, 250, 15, 690, 420, 900);
  glow.addColorStop(0, `${accent}38`); glow.addColorStop(1, `${accent}00`);
  ctx.fillStyle = glow; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save(); ctx.globalAlpha = .15; ctx.strokeStyle = accent; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(900, 240, 150 + i * 45, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();

  const roundedRect = (x, y, width, height, radius, fill, stroke) => {
    const r = Math.min(radius, width/2, height/2); ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+width,y,x+width,y+height,r); ctx.arcTo(x+width,y+height,x,y+height,r); ctx.arcTo(x,y+height,x,y,r); ctx.arcTo(x,y,x+width,y,r); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
  };
  const drawWrappedText = (text, x, y, maxWidth, lineHeight, font, color, maxLines = 5) => {
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'left';
    const blocks = String(text ?? '').split('\n'); let yy = y; let drawn = 0;
    for (let b = 0; b < blocks.length && drawn < maxLines; b++) {
      const words = blocks[b].split(/\s+/).filter(Boolean); let line = '';
      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (line && ctx.measureText(test).width > maxWidth) { ctx.fillText(line, x, yy); yy += lineHeight; drawn++; line = word; if (drawn >= maxLines) break; }
        else line = test;
      }
      if (line && drawn < maxLines) { ctx.fillText(line, x, yy); yy += lineHeight; drawn++; }
    }
    return yy;
  };
  const label = (text, y = 170) => { ctx.fillStyle = accent; ctx.font = '700 22px Arial, sans-serif'; ctx.letterSpacing = '5px'; ctx.fillText(text.toLocaleUpperCase('fr-FR'), 82, y); ctx.letterSpacing = '0px'; };
  const metricBox = (x, y, width, height, value, caption, size = 72) => {
    roundedRect(x, y, width, height, 30, 'rgba(255,255,255,.045)', 'rgba(255,255,255,.11)');
    drawWrappedText(value, x+30, y+82, width-60, size*.98, `700 ${size}px Arial, sans-serif`, '#f7f9fc', 2);
    drawWrappedText(caption, x+32, y+height-37, width-64, 28, '22px Arial, sans-serif', '#a6b4c9', 2);
  };
  const brand = () => {
    ctx.fillStyle = '#e8eef8'; ctx.font = '700 24px Arial, sans-serif'; ctx.fillText('MATTHIASTRACK', 82, 88);
    ctx.fillStyle = '#8b98ad'; ctx.font = '18px Arial, sans-serif'; ctx.textAlign = 'right'; ctx.fillText(`${String(index+1).padStart(2,'0')} / ${String(count).padStart(2,'0')}`, 998, 88); ctx.textAlign = 'left';
    ctx.fillStyle = '#7f8da4'; ctx.font = '18px Arial, sans-serif'; ctx.fillText(w.periodLabel.toLocaleUpperCase('fr-FR'), 82, 132);
  };
  const footer = () => {
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(82, 1780); ctx.lineTo(998,1780); ctx.stroke();
    ctx.fillStyle = '#8492a8'; ctx.font = '18px Arial, sans-serif'; ctx.fillText('TON UNIVERS. TON HISTORIQUE.', 82, 1830); ctx.textAlign = 'right'; ctx.fillStyle = accent; ctx.font = '700 23px Arial, sans-serif'; ctx.fillText('MT.', 998, 1830); ctx.textAlign = 'left';
  };
  brand();

  if (!w.hasActivity) {
    label('TON RÉCAP PERSONNEL', 260);
    drawWrappedText('Ton histoire\ncommence ici.', 82, 470, 850, 120, '700 94px Arial, sans-serif', '#f7f9fc', 3);
    roundedRect(82, 930, 916, 360, 36, 'rgba(255,255,255,.045)', 'rgba(255,255,255,.1)');
    drawWrappedText('Enregistre tes premiers films ou épisodes pour faire apparaître ton Wrapped.', 125, 1040, 820, 48, '30px Arial, sans-serif', '#c4cfdf', 5);
  } else if (index === 0) {
    label('TON RÉCAP PERSONNEL', 290);
    drawWrappedText('Ton univers,\ntes histoires.', 82, 475, 910, 130, '700 105px Arial, sans-serif', '#f7f9fc', 4);
    ctx.fillStyle = accent; ctx.font = '700 38px Arial, sans-serif'; ctx.fillText(w.formattedDuration, 86, 1000);
    drawWrappedText('de visionnage estimé', 86, 1060, 830, 36, '26px Arial, sans-serif', '#b2bfd0', 2);
    roundedRect(82, 1220, 916, 230, 32, 'rgba(255,255,255,.045)', 'rgba(255,255,255,.12)');
    metricBox(110, 1248, 408, 174, String(w.moviesCount), `film${w.moviesCount === 1 ? '' : 's'} vus`, 66);

// --- CALENDRIER : sorties de films (watchlist) + prochains épisodes (séries suivies) ---
function formatCalendarDate(dateStr) {
  const date = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diffDays = Math.round((date - today) / 86400000);
  if (diffDays === 0) return "Aujourd'hui";
  if (diffDays === 1) return 'Demain';
  if (diffDays === -1) return 'Hier';
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  if (date.getFullYear() !== today.getFullYear()) opts.year = 'numeric';
  return date.toLocaleDateString('fr-FR', opts);
}

/** Version compacte "façon TV Time" pour le badge de compte à rebours (Aujourd'hui /
 * Demain / Dans X jours / date courte si lointain ou déjà diffusé). */
function formatCountdown(dateStr) {
  const date = new Date(dateStr + 'T00:00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diffDays = Math.round((date - today) / 86400000);
  if (diffDays === 0) return "Aujourd'hui";
  if (diffDays === 1) return 'Demain';
  if (diffDays > 1 && diffDays <= 21) return `Dans ${diffDays} jours`;
  const opts = { day: 'numeric', month: 'short' };
  if (date.getFullYear() !== today.getFullYear()) opts.year = 'numeric';
  return date.toLocaleDateString('fr-FR', opts);
}

let pendingBackupRestore = null;
function validateMatthiasBackup(backup) {
  if (!backup || backup.format !== 'MatthiasTrack JSON Backup' || Number(backup.schema_version) !== 1 || !backup.data || typeof backup.data !== 'object') {
    throw new Error('Ce fichier ne ressemble pas à une archive MatthiasTrack reconnue (format v1).');
  }
  const required = ['interactions','episode_interactions','custom_lists','custom_list_items'];
  for (const key of required) {
    if (!Array.isArray(backup.data[key])) throw new Error(`Archive invalide : section « ${key} » manquante ou incorrecte.`);
    if (backup.data[key].length > 250000) throw new Error(`Archive trop volumineuse dans la section « ${key} » (250 000 entrées maximum).`);
    if (backup.data[key].some(item => !item || typeof item !== 'object' || Array.isArray(item))) {
      throw new Error(`Archive invalide : une entrée de « ${key} » n'est pas un objet valide.`);
    }
  }
  if (backup.exported_at && Number.isNaN(new Date(backup.exported_at).getTime())) throw new Error('La date d’export de cette archive est invalide.');
  return backup;
}

    try {
      const m = await resolveBackupMedia(r.media);
      const payload = { user_id: currentUser.id, media_id: m.id, status: ['watched','watchlist','watching','blacklisted'].includes(r.status) ? r.status : 'watchlist' };
      for (const key of ['rating','rating_story','rating_pacing','rating_acting','rating_directing','review','rewatch_count','is_rewatch','watched_at','timeline_order','timeline_label']) {
        if (r[key] !== undefined) payload[key] = r[key];
      }
      const { error } = await sb.from('interactions').upsert(payload, { onConflict:'user_id,media_id' });
      if (error) throw new Error(formatSbError(error));
      return { ok:true };
    } catch (err) { return { error:err?.message || 'Erreur interaction' }; }
    finally { done++; if (done % 10 === 0) setProgress(`Interactions : ${done}/${data.interactions.length}…`); }
  });
  for (const r of interactionResults) { if (r.ok) stats.interactions++; else { stats.skipped++; stats.errors.push(r.error); } }
  setProgress('Synchronisation des saisons et épisodes…'); done = 0;
  const episodeResults = await mapWithConcurrency(data.episode_interactions, 2, async r => {
    try {
      const ep = r.episodes, season = ep?.seasons;
      const m = await resolveBackupMedia(season?.media);
      if (!ep || season?.season_number == null || ep.episode_number == null) throw new Error('Référence d’épisode incomplète.');
      const episodes = await getOrSyncSeason(m.id, Number(m.tmdb_id), Number(season.season_number));
      const target = episodes.find(x => Number(x.episode_number) === Number(ep.episode_number));
      if (!target) throw new Error(`Épisode S${season.season_number}E${ep.episode_number} introuvable dans TMDB.`);
      const payload = { user_id: currentUser.id, episode_id: target.id };
      for (const key of ['watched_at','rating','review','rewatch_count']) if (r[key] !== undefined) payload[key] = r[key];
      const { error } = await sb.from('episode_interactions').upsert(payload, { onConflict:'user_id,episode_id' });
      if (error) throw new Error(formatSbError(error));
      return { ok:true };
    } catch (err) { return { error:err?.message || 'Erreur épisode' }; }
    finally { done++; if (done % 10 === 0) setProgress(`Épisodes : ${done}/${data.episode_interactions.length}…`); }
  });
  for (const r of episodeResults) { if (r.ok) stats.episodes++; else { stats.skipped++; stats.errors.push(r.error); } }
  setProgress('Fusion des listes personnelles…');
  let currentLists = await fetchCustomLists(true);
  const listMap = new Map();
  for (const sourceList of [...data.custom_lists].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))) {
    try {
      const match = Object.values(currentLists).find(l => String(l.name).trim().toLocaleLowerCase('fr-FR') === String(sourceList.name || '').trim().toLocaleLowerCase('fr-FR'));
      if (match) listMap.set(sourceList.id, match.id);
      else {
        const { data: created, error } = await sb.from('custom_lists').insert({ user_id: currentUser.id, name:String(sourceList.name || 'Collection restaurée').slice(0,70), emoji:sourceList.emoji || null, sort_order:Number(sourceList.sort_order || 0), ranked_mode:!!sourceList.ranked_mode }).select('id').single();
        if (error) throw new Error(formatSbError(error));
        listMap.set(sourceList.id, created.id); stats.lists++;
        customListsCache = null; currentLists = await fetchCustomLists(true);
      }
    } catch (err) { stats.errors.push(err?.message || 'Erreur liste'); }
  }
  customListsCache = null; currentLists = await fetchCustomLists(true);
  const listsWithItems = new Map();
  for (const r of data.custom_list_items) {
    const targetListId = listMap.get(r.list_id); const srcMedia = r.media;
    if (!targetListId || !srcMedia?.tmdb_id || !['movie','tv'].includes(srcMedia.media_type)) { stats.skipped++; continue; }
    if (!listsWithItems.has(targetListId)) listsWithItems.set(targetListId, []);
    listsWithItems.get(targetListId).push(r);
  }
  for (const [targetListId, items] of listsWithItems) {
    items.sort((a,b)=>(a.position||0)-(b.position||0));
    for (const item of items) {
      try {
        const media = await resolveBackupMedia(item.media);
        const current = (currentLists[targetListId]?.items || []);
        if (current.some(x => x.mediaId === media.id)) continue;
        await addToCustomListDb(targetListId, media); stats.listItems++;
        currentLists = await fetchCustomLists(true);
      } catch (err) { stats.skipped++; stats.errors.push(err?.message || 'Erreur élément de liste'); }
    }
  }
  // Restaurer les réglages d'apparence locaux et l'objectif annuel uniquement : les
  // identifiants, e-mails et préférences de notification d'un autre compte sont ignorés.
  // Only import known, well-formed preference values from an archive. A JSON file is
  // user-controlled input, so never blindly copy arbitrary strings into appearance settings.
  const prefs = data.local_preferences || {};
  if (prefs.streamtrack_amoled === '0' || prefs.streamtrack_amoled === '1') localStorage.setItem('streamtrack_amoled', prefs.streamtrack_amoled);
  const validAccents = (typeof ACCENT_PRESETS !== 'undefined' ? ACCENT_PRESETS : []).map(x => x.hex);
  if (typeof prefs.streamtrack_accent === 'string' && validAccents.includes(prefs.streamtrack_accent)) localStorage.setItem('streamtrack_accent', prefs.streamtrack_accent);
  const validFonts = (typeof FONT_PRESETS !== 'undefined' ? FONT_PRESETS : []).map(x => x.key);
  if (typeof prefs.streamtrack_font === 'string' && validFonts.includes(prefs.streamtrack_font)) localStorage.setItem('streamtrack_font', prefs.streamtrack_font);
  if (prefs.streamtrack_notif_enabled === '0' || prefs.streamtrack_notif_enabled === '1') localStorage.setItem('streamtrack_notif_enabled', prefs.streamtrack_notif_enabled);
  if (typeof prefs.streamtrack_last_backup === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(prefs.streamtrack_last_backup) && !Number.isNaN(Date.parse(prefs.streamtrack_last_backup))) localStorage.setItem('streamtrack_last_backup', prefs.streamtrack_last_backup);
  if (prefs.streamtrack_provider_region === 'FR' || prefs.streamtrack_provider_region === 'BE') localStorage.setItem('streamtrack_provider_region', prefs.streamtrack_provider_region);
  if (typeof prefs.matthiastack_discovery_prefs === 'string') {
    try {
      const saved = JSON.parse(prefs.matthiastack_discovery_prefs);
      const moods = DISCOVERY_MOODS.map(x => x.id);
      const clean = {
        mood: moods.includes(saved?.mood) ? saved.mood : 'escape',
        type: ['all','movie','tv'].includes(saved?.type) ? saved.type : 'all',
        runtime: ['', '90','120','150'].includes(String(saved?.runtime ?? '')) ? String(saved?.runtime ?? '') : '120',
        genre: DISCOVERY_STATIC_GENRES.includes(saved?.genre) ? saved.genre : '',
        country: ['FR','BE'].includes(saved?.country) ? saved.country : (prefs.streamtrack_provider_region === 'BE' ? 'BE' : 'FR'),
      };
      localStorage.setItem('matthiastack_discovery_prefs', JSON.stringify(clean));
    } catch { stats.errors.push('Préférences de découverte ignorées : format invalide.'); }
  }
  // Sync in-memory settings with the validated values just restored.
  discoveryPrefs = getDiscoveryPrefs();
  document.body.classList.toggle('amoled-mode', localStorage.getItem('streamtrack_amoled') === '1');
  applyTheme();
  const goal = data.profile?.yearly_goal;
  if (Number.isFinite(Number(goal)) && Number(goal) > 0) {
    const { error } = await sb.from('profiles').update({ yearly_goal:Number(goal), yearly_goal_year:Number(data.profile?.yearly_goal_year || new Date().getFullYear()) }).eq('id', currentUser.id);
    if (error) stats.errors.push('Objectif annuel non restauré : ' + formatSbError(error));
  }
  mediaDetailsCache.clear(); customListsCache = null; invalidatePersonalViews(); streakCache = null;
  const restoreButton = document.getElementById('backup-restore-start');
  if (restoreButton) restoreButton.disabled = false;
  setProgress(`Terminé : ${stats.interactions} interactions, ${stats.episodes} épisodes, ${stats.lists} listes créées, ${stats.listItems} éléments de liste ajoutés.${stats.skipped ? ` ${stats.skipped} entrée(s) ignorée(s).` : ''}`);
  return stats;
}

const FORMAT_LABELS = { letterboxd: 'Letterboxd', tvtime: 'TV Time (épisodes)', tvtime_shows: 'TV Time (séries vues)' };

function readImportFile(file) {
  const errorBox = document.getElementById('import-error');
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) {
    if (errorBox) errorBox.textContent = 'Fichier trop volumineux (maximum 25 Mo). Exporte un CSV plus petit puis réessaie.';
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => {
    const box = document.getElementById('import-error');
    if (box) box.textContent = 'Impossible de lire ce fichier. Vérifie son format et réessaie.';
  };
  reader.onload = () => {
    try {
      const text = String(reader.result ?? '');
      const parsed = parseImportFile(text, importState.format);
      importState.fileName = file.name;
      importState._content = text;
      importState.records = parsed.records;
      importState.skipped = parsed.skipped;
      importState.detectedFormat = parsed.format;
      renderImport();
      const detail = document.getElementById('dropzone-detail');
      const error = document.getElementById('import-error');
      if (parsed.format === 'unknown') {
        if (error) error.textContent = 'Format non reconnu : vérifie que le fichier vient bien de Letterboxd ou TV Time.';
      } else if (detail) {
        detail.textContent = `Format détecté : ${FORMAT_LABELS[parsed.format] ?? parsed.format} — ${parsed.records.length} entrée(s) exploitable(s)${parsed.skipped ? `, ${parsed.skipped} ignorée(s)` : ''}`;
      }
    } catch (err) {
      const box = document.getElementById('import-error');
      if (box) box.textContent = `Lecture du CSV impossible : ${err?.message || 'format invalide'}`;
    }
  };
  reader.readAsText(file);
}

async function startImport() {
  document.getElementById('import-actions').style.display = 'none';
  document.getElementById('import-progress').style.display = 'block';
  const records = importState.records;
  const total = records.length;
  const summary = { moviesImported: 0, episodesImported: 0, showsImported: 0, showsInProgress: 0, showsWatchlisted: 0, showsSkipped: 0, unmatched: [], errors: [] };
  const showCache = new Map();

  for (let i = 0; i < total; i++) {
    const rec = records[i];
    const label = rec.kind === 'movie' ? rec.title
      : rec.kind === 'show_watched' ? rec.seriesTitle
      : `${rec.seriesTitle} S${rec.seasonNumber}E${rec.episodeNumber}`;
    try {
      if (rec.kind === 'movie') {
        const match = await resolveMovie(rec.title, rec.year);
        if (!match) summary.unmatched.push(label);
        else { await importMovieWatch({ tmdbId: match.tmdbId, watchedDate: rec.watchedDate, rating: rec.rating, isRewatch: rec.isRewatch, rewatchCount: rec.rewatchCount }); summary.moviesImported++; }
      } else if (rec.kind === 'show_watched') {
        let show = showCache.get(rec.seriesTitle);
        if (show === undefined) {
          const match = await resolveTVShow(rec.seriesTitle);
          show = match ? await importShowStub(match.tmdbId) : null;
          showCache.set(rec.seriesTitle, show);
        }
        if (!show) summary.unmatched.push(label);
        else {
          const result = await importShowWatched(show.id, show.tmdbId, { episodesSeenCount: rec.episodesSeenCount, isFollowed: rec.isFollowed });
          if (result === 'watching') summary.showsInProgress++;
          else if (result === 'watchlist') summary.showsWatchlisted++;
          else if (result === 'skipped') summary.showsSkipped++;
          else summary.showsImported++;
        }
      } else {
        let show = showCache.get(rec.seriesTitle);
        if (show === undefined) {
          const match = await resolveTVShow(rec.seriesTitle);
          show = match ? await importShowStub(match.tmdbId) : null;
          showCache.set(rec.seriesTitle, show);
        }
        if (!show) summary.unmatched.push(label);
        else { await importEpisodeWatch({ mediaId: show.id, seasonNumber: rec.seasonNumber, episodeNumber: rec.episodeNumber, episodeTitle: rec.episodeTitle, watchedDate: rec.watchedDate }); summary.episodesImported++; }
      }
    } catch (err) {
      summary.errors.push({ label, error: err.message });
    }
    document.getElementById('progress-count').textContent = `${i + 1} / ${total}`;
    document.getElementById('progress-fill').style.width = `${Math.round(((i + 1) / total) * 100)}%`;
  }

  document.getElementById('import-progress').style.display = 'none';
  watchedItemsCache = null; // les œuvres importées doivent apparaître dans la Timeline sans recharger la page
  streakCache = null; // un import peut ajouter des dates passées ; on force un recalcul complet plutôt qu'un ajustement local
  document.getElementById('import-summary').innerHTML = `
    <div class="summary-box">
      <p class="success-text">✓ Import terminé</p>
      <ul style="font-size:14px; color:#cbd5e1; padding-left:18px;">
        ${summary.moviesImported ? `<li>${summary.moviesImported} film(s) importé(s)</li>` : ''}
        ${summary.showsImported ? `<li>${summary.showsImported} série(s) marquée(s) comme entièrement vue(s)</li>` : ''}
        ${summary.showsInProgress ? `<li>${summary.showsInProgress} série(s) en cours (progression importée)</li>` : ''}
        ${summary.showsWatchlisted ? `<li>${summary.showsWatchlisted} série(s) ajoutée(s) à la watchlist (suivies, pas encore commencées)</li>` : ''}
        ${summary.episodesImported ? `<li>${summary.episodesImported} épisode(s) importé(s)</li>` : ''}
        ${summary.showsSkipped ? `<li style="color:var(--muted);">${summary.showsSkipped} série(s) ignorée(s) (ni vues ni suivies)</li>` : ''}
        ${summary.unmatched.length ? `<li style="color:var(--amber);">${summary.unmatched.length} entrée(s) non trouvée(s) sur TMDB</li>` : ''}
        ${summary.errors.length ? `<li style="color:var(--red);">${summary.errors.length} erreur(s)</li>` : ''}
      </ul>
      <button class="btn ghost" onclick="app.resetImport()">Importer un autre fichier</button>
    </div>`;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/** Notification visible en bas de l'écran — pour que les échecs d'écriture
 * (RLS, réseau, etc.) ne soient jamais silencieux comme avant. showToast(msg,'success')
 * réutilise le même mécanisme pour les confirmations positives (fond vert plutôt que rouge). */
let toastTimeout = null;
function showToast(message, kind = 'error') {
  let el = document.getElementById('error-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'error-toast';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', kind === 'error' ? 'assertive' : 'polite');
    el.setAttribute('aria-atomic', 'true');
    document.body.appendChild(el);
  }
  el.setAttribute('role', 'status');
  el.setAttribute('aria-live', kind === 'error' ? 'assertive' : 'polite');
  el.className = 'error-toast' + (kind === 'success' ? ' toast-success' : '');
  el.textContent = (kind === 'success' ? '✓ ' : '⚠ ') + message;
  el.classList.add('visible');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('visible'), 5000);
}
function showErrorToast(message) { showToast(message, 'error'); }

  async markUpNextWatched(mediaId, episodeId, seasonNumber, episodeNumber, btnEl) {
    const card = btnEl.closest('.up-next-card');
    if (btnEl.disabled) return;
    btnEl.disabled = true; btnEl.textContent = '…';
    try {
      await markEpisodeWatchedOnly(episodeId); // idempotent : ne peut plus décocher un épisode déjà vu
      localCache.delete('home_data_v2');
      noteWatchedToday();

      // Série à partir des données de l'accueil, sinon relue en base (évite que
      // la carte disparaisse à tort quand lastHomeData n'est pas à jour).
      let media = lastHomeData?.upNext?.find(u => u.media.id === mediaId)?.media;
      if (!media) {
        const { data } = await sb.from('media').select('*').eq('id', mediaId).maybeSingle();
        media = data ?? null;
      }
      // Épisode suivant calculé directement depuis celui qu'on vient de cocher :
      // pas besoin de relire tout l'historique de l'utilisateur.
      const nextInfo = media ? await resolveNextEpisode(media, seasonNumber, episodeNumber).catch(() => null) : null;

      if (nextInfo && media) {
        if (card) card.outerHTML = upNextCardHtml({ media, next: nextInfo });
      } else if (card) {
        card.remove(); // série à jour, plus rien à cocher pour l'instant
      }
      if (lastHomeData?.upNext) {
        lastHomeData.upNext = nextInfo && media
          ? lastHomeData.upNext.map(u => u.media.id === mediaId ? { media, next: nextInfo } : u)
          : lastHomeData.upNext.filter(u => u.media.id !== mediaId);
      }
      // La série vient peut-être d'être terminée : rafraîchit "Reprendre" en tâche de fond.
      fetchHomeData().then(fresh => {
        localCache.set('home_data_v2', fresh);
        if ((location.hash || '#/') === '#/') { lastHomeData = fresh; renderHomeContent(fresh); }
      }).catch(() => { /* non bloquant : le prochain passage sur l'accueil recharge de toute façon */ });
    } catch (err) {
      showErrorToast(err.message);
      btnEl.disabled = false; btnEl.textContent = '✓ Vu';
    }
  },

    const a = lists[idx], b = lists[swapIdx];

    const a = items[idx], b = items[swapIdx];

  pickDiscoveryForMe() {

      return;

    const recent = (() => { try { return JSON.parse(localStorage.getItem('mt_discovery_recent') || '[]'); } catch { return []; } })();
    const pool = discoveryVisibleItems.filter(m => !recent.includes(`${m.media_type}:${m.tmdb_id}`));
    const candidates = pool.length ? pool : discoveryVisibleItems;
    const top = candidates.slice(0, Math.min(5, candidates.length));
    const chosen = top[Math.floor(Math.random() * top.length)];
    const key = `${chosen.media_type}:${chosen.tmdb_id}`;
    localStorage.setItem('mt_discovery_recent', JSON.stringify([key, ...recent.filter(x => x !== key)].slice(0,8)));

    if (existing >= 0) discoveryCompare.splice(existing,1);
    else {

  },
  async setProviderRegion(region, mediaType, tmdbId) {
    const country = ['FR','BE'].includes(region) ? region : 'FR';
    localStorage.setItem('streamtrack_provider_region', country);
    discoveryPrefs.country = country; saveDiscoveryPrefs();
    const target = document.getElementById('provider-region-results');
    if (target) target.innerHTML = `<div class="provider-loading"><span class="spinner"></span> Recherche des disponibilités…</div>`;
    const data = await getWatchProviders(parseInt(tmdbId,10), mediaType, country);
    const currentSelect = document.getElementById('provider-region-select');
    if (currentSelect) currentSelect.value = country;
    if (target) target.innerHTML = watchProvidersHtml(data, country);
  },
  async enableShakeToPick() {
    if (shakeListenerActive) { showErrorToast('Shake to Pick est déjà activé — secoue ton téléphone !'); return; }
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const res = await DeviceMotionEvent.requestPermission();
        if (res !== 'granted') { showErrorToast('Permission refusée pour le capteur de mouvement.'); return; }
      } catch (err) { showErrorToast("Impossible d'activer Shake to Pick : " + err.message); return; }
    }
    window.addEventListener('devicemotion', handleDeviceShake);
    shakeListenerActive = true;
    showErrorToast('📳 Shake to Pick activé — secoue ton téléphone pour choisir !');
  },
};
</script>

<script>
/* ========================================================================
   MATTHIASTRACK 21.0 — SMALL, LOCAL UX HELPERS
   No backend changes: keyboard/focus ergonomics and one-tap return-to-top.
   ======================================================================== */
// Service worker : permet d'ouvrir l'app sans réseau (voir sw.js). Ignoré en
// file:// et sur les navigateurs qui ne le supportent pas.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker non enregistré :', err));
  });
}

(() => {
  const body = document.body;
  const html = document.documentElement;
  const root = document.getElementById('root');
  if (!root) return;

  // Keyboard users can skip the repeated header/navigation and reach the app content.
  if (!document.getElementById('mt-skip-content')) {
    const skip = document.createElement('a');
    skip.id = 'mt-skip-content';
    skip.href = '#root';
    skip.textContent = 'Passer au contenu';
    skip.addEventListener('click', event => {
      event.preventDefault();
      root.tabIndex = -1;
      root.focus({ preventScroll: true });
      root.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });
    body.prepend(skip);
  }

  // One-tap return-to-top control appears only after meaningful scrolling.
  let topButton = document.getElementById('mt-scroll-top');
  if (!topButton) {
    topButton = document.createElement('button');
    topButton.id = 'mt-scroll-top';
    topButton.type = 'button';
    topButton.className = 'mt-scroll-top';
    topButton.setAttribute('aria-label', 'Remonter en haut de la page');
    topButton.setAttribute('title', 'Remonter en haut');
    topButton.setAttribute('aria-hidden', 'true');
    topButton.tabIndex = -1;
    topButton.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    topButton.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });
    body.appendChild(topButton);
  }

  let modalElements = [...document.querySelectorAll('.trailer-overlay')];
  let activeModal = null;
  let restoreFocusTo = null;
  let savedOverflow = null;

  const visibleModal = el => !!el && getComputedStyle(el).display !== 'none' && el.getClientRects().length > 0;
  const updateTopButton = () => {
    const modalOpen = modalElements.some(visibleModal);
    const show = window.scrollY > 460 && !modalOpen;
    topButton.classList.toggle('is-visible', show);
    topButton.setAttribute('aria-hidden', show ? 'false' : 'true');
    topButton.tabIndex = show ? 0 : -1;
  };

  const syncModalState = () => {
    const nextModal = [...modalElements].reverse().find(visibleModal) || null;
    if (nextModal && !activeModal) {
      activeModal = nextModal;
      const activeElement = document.activeElement;
      restoreFocusTo = activeElement && activeElement !== document.body ? activeElement : null;
      savedOverflow = { html: html.style.overflow, body: body.style.overflow };
      html.classList.add('mt-modal-lock');
      body.classList.add('mt-modal-lock');
      html.style.overflow = 'hidden';
      body.style.overflow = 'hidden';
      requestAnimationFrame(() => {
        if (!activeModal) return;
        const target = activeModal.querySelector('button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])');
        if (target && visibleModal(activeModal)) target.focus({ preventScroll: true });
      });
    } else if (!nextModal && activeModal) {
      activeModal = null;
      html.classList.remove('mt-modal-lock');
      body.classList.remove('mt-modal-lock');
      if (savedOverflow) {
        html.style.overflow = savedOverflow.html;
        body.style.overflow = savedOverflow.body;
      }
      savedOverflow = null;
      const focusReturn = restoreFocusTo;
      if (focusReturn?.isConnected && typeof focusReturn.focus === 'function') {
        requestAnimationFrame(() => focusReturn.isConnected && focusReturn.focus({ preventScroll: true }));
      }
      restoreFocusTo = null;
    } else if (nextModal && nextModal !== activeModal) {
      activeModal = nextModal;
      requestAnimationFrame(() => {
        const target = activeModal?.querySelector('button:not(:disabled), [href], input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])');
        if (target && visibleModal(activeModal)) target.focus({ preventScroll: true });
      });
    }
    updateTopButton();
  };

  // Prevent focus from escaping an open dialog with the keyboard.
  document.addEventListener('keydown', event => {
    if (event.key !== 'Tab' || !activeModal) return;
    const focusables = [...activeModal.querySelectorAll('a[href], button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])')]
      .filter(el => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden');
    if (!focusables.length) { event.preventDefault(); return; }
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (event.shiftKey && (document.activeElement === first || !activeModal.contains(document.activeElement))) {
      event.preventDefault(); last.focus();
    } else if (!event.shiftKey && (document.activeElement === last || !activeModal.contains(document.activeElement))) {
      event.preventDefault(); first.focus();
    }
  });

  // Modal display is toggled by the existing app API. Watch their state and also
  // register the shortcut-help overlay when it is created later in the session.
  const observer = new MutationObserver(records => {
    let shouldSync = false;
    for (const record of records) {
      if (record.type === 'attributes') shouldSync = true;
      for (const node of record.addedNodes || []) {
        if (!(node instanceof Element)) continue;
        const found = [];
        if (node.matches?.('.trailer-overlay')) found.push(node);
        found.push(...(node.querySelectorAll?.('.trailer-overlay') || []));
        for (const modal of found) {
          if (!modalElements.includes(modal)) {
            modalElements.push(modal);
            observer.observe(modal, { attributes: true, attributeFilter: ['style', 'class', 'aria-hidden'] });
            shouldSync = true;
          }
        }
      }
    }
    if (shouldSync) syncModalState();
  });
  modalElements.forEach(el => observer.observe(el, { attributes: true, attributeFilter: ['style', 'class', 'aria-hidden'] }));
  observer.observe(body, { childList: true });
  window.addEventListener('scroll', updateTopButton, { passive: true });
  window.addEventListener('resize', updateTopButton, { passive: true });
  window.addEventListener('hashchange', () => requestAnimationFrame(updateTopButton));
  window.addEventListener('pageshow', syncModalState);

  // A gentle stagger for the first visible cards on each route. Observe only the
  // router root so normal hover/state changes do not cause an observer storm.
  const revealSelector = '.smart-collection-card, .smart-media-card, .discovery-card, .journal-entry, .custom-list-panel, .profile-shortcut-card, .calendar-activity-item, .year-compare-panel, .wrapped-launch-card';
  let revealFrame = 0;
  const applyRouteReveal = () => {
    revealFrame = 0;
    const targets = [...root.querySelectorAll(revealSelector)].filter(el => !el.classList.contains('mt-item-reveal')).slice(0, 14);
    targets.forEach((el, index) => {
      el.style.setProperty('--mt-reveal-delay', `${Math.min(index, 9) * 24}ms`);
      el.classList.add('mt-item-reveal');
    });
  };
  const routeRevealObserver = new MutationObserver(() => {
    if (!revealFrame) revealFrame = requestAnimationFrame(applyRouteReveal);
  });
  routeRevealObserver.observe(root, { childList:true });
  applyRouteReveal();
  syncModalState();
})();
</script>
</body>
</html>
